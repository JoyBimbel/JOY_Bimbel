<script>
// ================= ERROR HANDLER GLOBAL =================
window.onerror = function(msg, url, line, col, error) {
  const errDiv = document.getElementById('global-error');
  if (errDiv) {
    errDiv.innerHTML = "⚠️ Error Sistem: " + msg + " (Baris " + line + ")";
    errDiv.classList.remove('hidden');
    setTimeout(() => errDiv.classList.add('hidden'), 5000);
  }
  return false;
};

// ================= GLOBAL DATA =================
let DB = { profile: null, siswa: [], tentor: [], jadwal: [], absensi: [], invoice: [], laporan: [], users: [] };
let currentPage = 'dashboard';
let absensiDate = new Date().toISOString().slice(0,10);
let realtimeChannel = null;
let refreshTimeout = null;
let chartInstance = null;

// ================= HELPERS =================
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

// ================= AUTH =================
async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      await loadAllData(session.user);
    } else {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-page').classList.add('hidden');
      document.getElementById('loading-page').classList.add('hidden');
    }
  } catch (e) {
    console.error(e);
    document.getElementById('login-page').classList.remove('hidden');
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true; btnText.innerHTML = `Memverifikasi...`;

  const email = f.email.value.trim();
  const password = f.password.value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadAllData(data.user);
  } catch (err) {
    alert("Login Gagal: " + err.message);
    document.getElementById('login-error').classList.remove('hidden');
    btn.disabled = false; btnText.innerText = 'Masuk';
  }
});

async function loadAllData(user) {
  try {
    document.getElementById('login-page').classList.add('hidden');
    const loadingPage = document.getElementById('loading-page');
    loadingPage.classList.remove('hidden'); setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);

    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
    if (profErr || !profile) throw new Error("Profil Anda belum terdaftar.");
    DB.profile = profile;

    const [resSiswa, resTentor, resJadwal, resAbsensi, resInvoice, resLaporan, resUsers] = await Promise.all([
      supabaseClient.from('siswa').select('*').order('nama'),
      supabaseClient.from('tentor').select('*').order('nama'),
      supabaseClient.from('jadwal').select('*'),
      supabaseClient.from('absensi').select('*'),
      supabaseClient.from('invoice').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('laporan').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('profiles').select('*').order('nama')
    ]);

    DB.siswa = resSiswa.data || []; DB.tentor = resTentor.data || []; DB.jadwal = resJadwal.data || [];
    DB.absensi = resAbsensi.data || []; DB.invoice = resInvoice.data || []; DB.laporan = resLaporan.data || [];
    DB.users = resUsers.data || [];

    bootApp();
    
    if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => loadAllData(user), 1000);
      }).subscribe();

  } catch (err) {
    alert("Error Load Data: " + err.message);
    await supabaseClient.auth.signOut();
    location.reload();
  }
}

async function logout() { 
  if (!confirm('Apakah Anda yakin ingin keluar?')) return; 
  try {
    if (realtimeChannel) { await supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
    await supabaseClient.removeAllChannels();
    await supabaseClient.auth.signOut(); 
    location.reload(); 
  } catch (error) { location.reload(); }
}

// ================= APP ROUTING =================
function bootApp() {
  const loadingPage = document.getElementById('loading-page');
  if (loadingPage) loadingPage.classList.add('opacity-0');
  
  setTimeout(() => {
    if (loadingPage) loadingPage.classList.add('hidden');
    const appPage = document.getElementById('app-page');
    if (appPage) { appPage.classList.remove('hidden'); setTimeout(() => appPage.classList.remove('opacity-0'), 50); }
    
    const sidebarRole = document.getElementById('sidebar-role');
    if (sidebarRole && DB.profile) sidebarRole.textContent = DB.profile.role.toUpperCase() + ' - ' + DB.profile.nama;
    const mobileRole = document.getElementById('mobile-role');
    if (mobileRole && DB.profile) mobileRole.textContent = DB.profile.role;
    
    renderNav(); renderPage(); 
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }, 400);
}

function renderNav() {
  const s = DB.profile;
  const adminMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'}, {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'absensi', label:'Absensi', icon:'clipboard-check'}, {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
    {id:'invoice', label:'Invoice', icon:'file-text'}, {id:'keuangan', label:'Laporan Keuangan', icon:'bar-chart-3'},
    {id:'akun', label:'Akun & Akses', icon:'shield'}, {id:'backup', label:'Backup Data', icon:'database'}
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'}, {id:'absensi', label:'Absensi', icon:'clipboard-check'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'}
  ];
  const menus = s && s.role === 'admin' ? adminMenus : tentorMenus;
  const nav = document.getElementById('nav');
  if (nav) {
    nav.innerHTML = menus.map(m => `
      <button onclick="navigate('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg w-full text-left transition ${currentPage===m.id ? 'bg-orange-50 text-orange-700 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">
        <i data-lucide="${m.icon}" class="w-4 h-4 flex-shrink-0"></i> <span class="truncate">${m.label}</span>
      </button>`).join('');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function navigate(page) { currentPage = page; renderNav(); renderPage(); if (window.innerWidth < 768) { const sb = document.getElementById('sidebar'); if (sb) { sb.classList.add('hidden','-translate-x-full'); } } }
function toggleSidebar() { const s = document.getElementById('sidebar'); if (s) { s.classList.toggle('hidden'); s.classList.toggle('-translate-x-full'); } }

// ================= MODAL =================
let modalSubmit = null;
function openModal(title, body, onSubmit) {
  const mTitle = document.getElementById('modal-title'); if (mTitle) mTitle.textContent = title; 
  const mBody = document.getElementById('modal-body'); if (mBody) mBody.innerHTML = body;
  modalSubmit = onSubmit; 
  const m = document.getElementById('modal'); if (m) m.classList.remove('hidden'); 
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

// ================= RENDER PAGE =================
function renderPage() {
  const content = document.getElementById('content');
  if (!content) return;
  const pages = { dashboard: renderDashboard, siswa: () => renderSiswa(), tentor: () => renderTentor(), jadwal: () => renderJadwal(), absensi: () => renderAbsensi(), invoice: () => renderInvoice(), keuangan: () => renderLaporanKeuangan(), akun: () => renderAkun(), backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor() };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  if (typeof lucide !== 'undefined') lucide.createIcons();
  if (currentPage === 'keuangan') setTimeout(mountChart, 50);
}

// ================= DASHBOARD =================
function renderDashboard() {
  const s = DB.profile; const siswa = DB.siswa, tentor = DB.tentor, inv = DB.invoice;
  const pemasukan = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);
  const pemasukanCard = s && s.role === 'admin' ? `<div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Pemasukan Lunas</div><div class="text-xl font-bold text-emerald-600">${rupiah(pemasukan)}</div></div>` : '';
  return `
    <div>
      <h1 class="text-2xl font-bold mb-1">Dashboard ${s && s.role==='admin'?'Admin':'Tentor'}</h1>
      <p class="text-gray-500 mb-6 text-sm">Selamat datang, ${s ? escapeHtml(s.nama) : ''} 👋</p>
      <div class="grid grid-cols-2 ${s && s.role==='admin'?'md:grid-cols-4':'md:grid-cols-3'} gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Siswa</div><div class="text-xl font-bold">${siswa.length}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Tentor</div><div class="text-xl font-bold">${tentor.length}</div></div>
        ${pemasukanCard}
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Laporan</div><div class="text-xl font-bold text-orange-600">${DB.laporan.length}</div></div>
      </div>
    </div>`;
}

// ================= AKUN & AKSES =================
function renderAkun() {
  return `<div>
    <div class="flex justify-between items-center mb-4">
      <div><h1 class="text-2xl font-bold">Akun & Akses</h1><p class="text-gray-500 text-sm">Kelola user yang bisa login ke sistem</p></div>
      <button onclick="openUserForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Tambah Akun</button>
    </div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm">
      <thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-left px-4 py-3">Email</th><th class="text-left px-4 py-3">Role</th><th class="text-right px-4 py-3">Aksi</th></tr></thead>
      <tbody>${DB.users.map(u=>`
        <tr class="border-t">
          <td class="px-4 py-3 font-medium">${escapeHtml(u.nama)}</td>
          <td class="px-4 py-3">${escapeHtml(u.email)}</td>
          <td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded ${u.role==='admin'?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700'}">${u.role}</span></td>
          <td class="px-4 py-3 text-right whitespace-nowrap">
            ${u.email !== 'ricokristanto18@gmail.com' ? `
              <button onclick="resetPass('${u.email}')" class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded text-xs border border-blue-200 mr-1">Reset Pass</button>
              <button onclick="hapusAkun('${u.email}', '${u.nama}')" class="text-red-600 hover:bg-red-50 p-1.5 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
            ` : '<span class="text-xs text-gray-400">Admin Utama</span>'}
          </td>
        </tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function openUserForm() {
  const body = `<form>
    <div class="space-y-3">
      <div><label class="text-sm">Nama Lengkap *</label><input name="nama" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Email *</label><input name="email" type="email" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Password Awal *</label><input name="password" required class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="Minimal 6 karakter" /></div>
      <div><label class="text-sm">Role *</label>
        <select name="role" class="w-full border rounded-lg px-3 py-2 mt-1">
          <option value="tentor">Tentor</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold mt-4">Buat Akun</button>
    </div></form>`;
  openModal('Tambah Akun Baru', body, simpanUser);
}

async function simpanUser(e) {
  e.preventDefault();
  const f = e.target;
  const email = f.email.value.trim();
  const pass = f.password.value;
  const nama = f.nama.value;
  const role = f.role.value;

  const tempClient = supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } });

  try {
    const { data, error } = await tempClient.auth.signUp({ 
      email, password: pass,
      options: { data: { nama: nama, role: role } }
    });
    if (error) throw error;
    alert("✅ Akun berhasil dibuat! User tersebut sekarang sudah bisa login.");
    closeModal();
    loadAllData({ id: DB.profile.id }); 
  } catch (err) {
    alert("Gagal membuat akun: " + err.message);
  }
}

async function resetPass(email) {
  const newPass = prompt(`Masukkan password baru untuk akun ${email}:\n(Minimal 6 karakter)`);
  if (!newPass) return;
  if (newPass.length < 6) { alert('Password terlalu pendek! Minimal 6 karakter.'); return; }

  try {
    const { error } = await supabaseClient.rpc('admin_reset_password', { user_email: email, new_password: newPass });
    if (error) throw error;
    alert(`✅ Password untuk ${email} berhasil diubah menjadi: ${newPass}\n\nSilakan beritahu password baru ini kepada yang bersangkutan.`);
  } catch (err) {
    alert("Gagal mereset password: " + err.message);
  }
}

async function hapusAkun(email, nama) {
  if (!confirm(`Yakin ingin menghapus akun ${nama} (${email}) secara permanen?`)) return;
  try {
    const { error } = await supabaseClient.rpc('delete_user_by_admin', { user_email: email });
    if (error) throw error;
    alert(`✅ Akun ${nama} berhasil dihapus permanen.`);
    loadAllData({ id: DB.profile.id }); 
  } catch (err) {
    alert("Gagal menghapus akun: " + err.message);
  }
}

// ================= LAPORAN TENTOR =================
function renderLaporanTentor() {
  const role = DB.profile ? DB.profile.role : 'tentor';
  return `<div>
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Laporan Mengajar</h1>
      ${role==='tentor'?`<button onclick="openLaporanForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm">+ Buat Laporan</button>`:''}
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      ${DB.laporan.map(l=>{ 
        const s = DB.siswa.find(x=>x.id===l.siswa_id)||{}; 
        const t = DB.tentor.find(x=>x.id===l.tentor_id)||{}; 
        return `<div class="bg-white rounded-xl border overflow-hidden flex flex-col relative">
          ${l.foto?`<img src="${l.foto}" class="w-full h-48 object-cover border-b" />`:''}
          <div class="p-4 flex-1 pb-12">
            <div class="font-bold text-lg">${escapeHtml(s.nama)}</div>
            <div class="text-xs text-gray-500 mb-2">${l.tanggal} • ${escapeHtml(t.nama)}</div>
            <p class="text-sm text-gray-700">${escapeHtml(l.catatan)}</p>
          </div>
          <div class="absolute bottom-3 right-3 flex gap-1 bg-white p-1 rounded-lg shadow-sm border">
            <button onclick="openLaporanForm('${l.id}')" class="text-blue-600 p-1.5 hover:bg-blue-50 rounded" title="Edit Laporan"><i data-lucide="pencil" class="w-4 h-4"></i></button>
            <button onclick="hapusLaporan('${l.id}')" class="text-red-600 p-1.5 hover:bg-red-50 rounded" title="Hapus Laporan"><i data-lucide="trash-2" class="w-4 h-4"></i></button>

function openLaporanForm(id) {

      </div>

      <div>
        <label class="text-sm">${editing ? 'Ganti Foto (Opsional):' : 'Foto *'}</label>

        ${editing ? `<img src="${editing.foto}" class="h-20 mt-2 rounded border"/>` : ''}

    </div></form>`;
  
  openModal(editing ? 'Edit Laporan' : 'Buat Laporan', body, async (e) => {
    const f = e.target; 
    const file = document.getElementById('foto-input').files[0];
    
    if (!file && !editing) { alert('Pilih foto terlebih dahulu!'); return; }

    let fotoUrl = editing ? editing.foto : null;

    if (file) {
      const fileName = `laporan/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
      const { error: err } = await supabaseClient.storage.from('foto_laporan').upload(fileName, file);
      if (err) { alert("Gagal upload foto: " + err.message); return; }
      const { data: { publicUrl } } = supabaseClient.storage.from('foto_laporan').getPublicUrl(fileName);
      fotoUrl = publicUrl;
    }
    
    const myTentor = DB.tentor.find(t => DB.profile && t.email === DB.profile.email) || DB.tentor[0] || { id: null };
    const data = { tentor_id: editing ? editing.tentor_id : myTentor.id, siswa_id: f.siswa_id.value, tanggal: f.tanggal.value, mapel: f.mapel.value, catatan: f.catatan.value, foto: fotoUrl };

    if (editing) {
      await supabaseClient.from('laporan').update(data).eq('id', editing.id);
    } else {
      await supabaseClient.from('laporan').insert([data]);
    }
    closeModal();
  });
}

async function hapusLaporan(id) {
  if (!confirm('Yakin ingin menghapus laporan ini?')) return;
  await supabaseClient.from('laporan').delete().eq('id', id);
}

function openInvoiceForm(id) {
  const editing = id ? DB.invoice.find(x=>x.id===id) : null;
  const body = `
    <form id="form-invoice">
      <div class="space-y-3">
        <div><label class="text-sm font-medium">Jenis Invoice *</label>
          <select name="jenis" onchange="refreshRecipients(this.value)" class="w-full border rounded-lg px-3 py-2 mt-1">

          </select></div>
        <div><label class="text-sm font-medium">Penerima *</label>

        </div>
        <div><label class="text-sm font-medium">Status</label>
          <select name="status" class="w-full border rounded-lg px-3 py-2 mt-1">
            <option value="belum_bayar" ${editing?.status==='belum_bayar'||!editing?'selected':''}>Belum Bayar</option>
            <option value="lunas" ${editing?.status==='lunas'?'selected':''}>Lunas</option>
          </select></div>
        <div class="flex justify-between items-center pt-3 border-t">
          <span class="text-sm text-gray-500">Total</span>
          <span id="invoice-total" class="text-xl font-bold text-orange-600">Rp0</span>

        <button type="submit" class="w-full bg-rose-600 text-white py-2 rounded-lg font-semibold mt-4">Simpan Invoice</button>
      </div>
    </form>`;
  
  openModal(editing ? 'Edit Invoice' : 'Buat Invoice Baru', body, async (e) => {
    const f = e.target;
    const items = [];
    document.querySelectorAll('#items-container .item-row').forEach(row => {
      const deskripsi = row.querySelector('.item-desk').value.trim();
      const qty = Number(row.querySelector('.item-qty').value) || 0;
      const harga = Number(row.querySelector('.item-harga').value) || 0;
      if (deskripsi && qty > 0) items.push({ deskripsi, qty, harga });
    });
    if (items.length === 0) { alert('Minimal 1 item harus diisi'); return; }
    const total = items.reduce((a,it)=>a+it.qty*it.harga, 0);
    
    const data = {
      jenis: f.jenis.value, untuk_id: f.untuk_id.value, periode: f.periode.value.trim(),
      items: items, total: total, status: f.status.value,
    };

    if (editing) {
      await supabaseClient.from('invoice').update(data).eq('id', editing.id);
    } else {
      const no = `INV-${new Date().getFullYear()}-${Math.floor(Math.random()*1000)}`;
      await supabaseClient.from('invoice').insert([{ no_invoice: no, ...data, tanggal: todayISO() }]);
    }
    closeModal();
  });

  refreshRecipients(editing?.jenis||'siswa', editing?.untuk_id);
  const items = editing ? editing.items : [{deskripsi:'', qty:1, harga:0}];
  if(Array.isArray(items)) items.forEach(it => addItemRow(it));
  updateInvoiceTotal();
}

function refreshRecipients(jenis, selectedId) {
  const sel = document.getElementById('recipient-select');
  if (!sel) return;
  const data = jenis === 'siswa' ? DB.siswa : DB.tentor;
  sel.innerHTML = '<option value="">— Pilih —</option>' + data.map(d => `
    <option value="${d.id}" ${d.id===selectedId?'selected':''}>
      ${escapeHtml(jenis==='siswa' ? `${d.nama} (${d.nama_orang_tua||'-'})` : `${d.nama} - ${d.mapel||'-'}`)}
    </option>`).join('');
}

function addItemRow(item) {
  const container = document.getElementById('items-container');
  if (!container) return;
  const it = item || { deskripsi:'', qty:1, harga:0 };
  const div = document.createElement('div');
  div.className = 'item-row flex gap-2 items-start';
  div.innerHTML = `
    <input class="item-desk flex-1 border rounded-lg px-2 py-1.5 text-sm" placeholder="Deskripsi (misal: SPP Bulan Ini)" value="${escapeHtml(it.deskripsi)}" />
    <input class="item-qty w-16 border rounded-lg px-2 py-1.5 text-sm" type="number" min="1" placeholder="Qty" value="${it.qty}" oninput="updateInvoiceTotal()" />
    <input class="item-harga w-28 border rounded-lg px-2 py-1.5 text-sm" type="number" min="0" placeholder="Harga" value="${it.harga}" oninput="updateInvoiceTotal()" />
    <button type="button" onclick="this.parentElement.remove(); updateInvoiceTotal();" class="text-red-500 hover:bg-red-50 p-1.5 rounded font-bold">✕</button>
  `;
  container.appendChild(div);
  updateInvoiceTotal();
}

function updateInvoiceTotal() {
  let total = 0;
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    const q = Number(row.querySelector('.item-qty').value)||0;
    const h = Number(row.querySelector('.item-harga').value)||0;
    total += q*h;
  });
  const el = document.getElementById('invoice-total');
  if (el) el.textContent = rupiah(total);
}

      <div><label class="text-sm">Nama Orang Tua *</label><input name="nama_orang_tua" required value="${escapeHtml(editing?.nama_orang_tua||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">No WhatsApp Orang Tua</label><input name="no_wa" value="${escapeHtml(editing?.no_wa||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" placeholder="08..." /></div>
      <div><label class="text-sm">Tentor</label><select name="tentor_id" class="w-full border rounded-lg px-3 py-2 mt-1"><option value="">-</option>${DB.tentor.map(t=>`<option value="${t.id}" ${editing?.tentor_id===t.id?'selected':''}>${escapeHtml(t.nama)}</option>`).join('')}</select></div>
      <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold">Simpan</button>
    </div></form>`;
  openModal(editing?'Edit Siswa':'Tambah Siswa', body, simpanSiswa);
}

// ================= CRUD TENTOR, JADWAL, ABSENSI =================
function renderTentor() {
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Daftar Tentor</h1><button onclick="openTentorForm()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Tambah Tentor</button></div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-left px-4 py-3">Mapel</th><th class="text-left px-4 py-3">Email</th><th class="text-right px-4 py-3">Aksi</th></tr></thead>
      <tbody>${DB.tentor.map(t=>`<tr class="border-t"><td class="px-4 py-3 font-medium">${escapeHtml(t.nama)}</td><td class="px-4 py-3">${escapeHtml(t.mapel)}</td><td class="px-4 py-3">${escapeHtml(t.email)}</td><td class="px-4 py-3 text-right"><button onclick="openTentorForm('${t.id}')" class="text-orange-600 p-1.5 hover:bg-orange-50 rounded"><i data-lucide="pencil" class="w-4 h-4"></i></button><button onclick="deleteRecord('tentor','${t.id}')" class="text-red-600 p-1.5 hover:bg-red-50 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}
async function simpanTentor(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { nama: f.nama.value, email: f.email.value, mapel: f.mapel.value, tarif: Number(f.tarif.value)||0 };
  if (id) await supabaseClient.from('tentor').update(data).eq('id', id);
  else await supabaseClient.from('tentor').insert([data]);
  closeModal();
}
function openTentorForm(id) {
  const editing = id ? DB.tentor.find(x=>x.id===id) : null;
  const body = `<form data-id="${id||''}"><div class="space-y-3">
    <div><label class="text-sm">Nama *</label><input name="nama" required value="${escapeHtml(editing?.nama||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    <div><label class="text-sm">Email</label><input name="email" type="email" value="${escapeHtml(editing?.email||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    <div><label class="text-sm">Mapel</label><input name="mapel" value="${escapeHtml(editing?.mapel||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    <div><label class="text-sm">Tarif per Sesi</label><input name="tarif" type="number" value="${editing?.tarif||''}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold">Simpan</button>
  </div></form>`;
  openModal(editing?'Edit Tentor':'Tambah Tentor', body, simpanTentor);
}

function renderJadwal() {
  const role = DB.profile ? DB.profile.role : 'tentor';
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Jadwal</h1>${role==='admin'?`<button onclick="openJadwalForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Tambah</button>`:''}</div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Hari</th><th class="text-left px-4 py-3">Jam</th><th class="text-left px-4 py-3">Siswa</th>${role==='admin'?'<th class="text-right px-4 py-3">Aksi</th>':''}</tr></thead>
      <tbody>${DB.jadwal.map(j=>{ const s = DB.siswa.find(x=>x.id===j.siswa_id)||{}; return `<tr class="border-t"><td class="px-4 py-3">${j.hari}</td><td class="px-4 py-3">${j.jam_mulai}-${j.jam_selesai}</td><td class="px-4 py-3">${escapeHtml(s.nama)}</td>${role==='admin'?`<td class="px-4 py-3 text-right"><button onclick="deleteRecord('jadwal','${j.id}')" class="text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>`:''}</tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}
async function simpanJadwal(e) {
  const f = e.target;
  await supabaseClient.from('jadwal').insert([{ siswa_id: f.siswa_id.value, tentor_id: f.tentor_id.value, hari: f.hari.value, jam_mulai: f.jam_mulai.value, jam_selesai: f.jam_selesai.value }]);
  closeModal();
}
function openJadwalForm() {
  const body = `<form><div class="space-y-3">
    <div><label class="text-sm">Siswa</label><select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.siswa.map(s=>`<option value="${s.id}">${escapeHtml(s.nama)}</option>`).join('')}</select></div>
    <div><label class="text-sm">Tentor</label><select name="tentor_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.tentor.map(t=>`<option value="${t.id}">${escapeHtml(t.nama)}</option>`).join('')}</select></div>
    <div><label class="text-sm">Hari</label><select name="hari" class="w-full border rounded-lg px-3 py-2 mt-1">${HARI.map(h=>`<option value="${h}">${h}</option>`).join('')}</select></div>
    <div class="grid grid-cols-2 gap-2"><div><label class="text-sm">Mulai</label><input type="time" name="jam_mulai" value="15:00" class="w-full border rounded-lg px-3 py-2" /></div><div><label class="text-sm">Selesai</label><input type="time" name="jam_selesai" value="16:30" class="w-full border rounded-lg px-3 py-2" /></div></div>
    <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold">Simpan</button>
  </div></form>`;
  openModal('Tambah Jadwal', body, simpanJadwal);
}

function renderAbsensi() {
  const existing = DB.absensi.filter(a => a.tanggal === absensiDate);
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Absensi</h1><input type="date" value="${absensiDate}" onchange="absensiDate=this.value; renderPage();" class="border rounded-lg px-3 py-2 text-sm" /></div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-center px-4 py-3">Status</th></tr></thead>
      <tbody>${DB.siswa.map(s=>{ const cur = existing.find(a=>a.siswa_id===s.id)?.status; return `<tr class="border-t"><td class="px-4 py-3">${escapeHtml(s.nama)}</td><td class="px-4 py-3 flex justify-center gap-1">${['hadir','izin','sakit','alpa'].map(st=>`<button onclick="setAbsensi('${s.id}','${st}')" class="px-3 py-1 rounded text-xs border ${cur===st?'bg-orange-500 text-white':'bg-white'} capitalize">${st}</button>`).join('')}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}
async function setAbsensi(siswa_id, status) {
  const ex = DB.absensi.find(a => a.siswa_id===siswa_id && a.tanggal===absensiDate);
  if (ex) await supabaseClient.from('absensi').update({ status }).eq('id', ex.id);
  else await supabaseClient.from('absensi').insert([{ siswa_id, tanggal: absensiDate, status, oleh: DB.profile ? DB.profile.email : '' }]);
}

async function deleteRecord(table, id) {
  if (!confirm('Yakin hapus data ini?')) return;
  await supabaseClient.from(table).delete().eq('id', id);
}

// ================= INIT =================
window.addEventListener('DOMContentLoaded', () => { 
  if (typeof lucide !== 'undefined') lucide.createIcons(); 
  checkSession(); 
});
</script>
</body>
</html>
