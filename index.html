function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NAMA_BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_HARI_SINGKAT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

function formatJam(t) { if (!t) return '-'; return String(t).substring(0, 5); }
function formatTanggal(tgl) {
  if (!tgl) return null;
  const d = new Date(tgl + 'T00:00:00');
  if (isNaN(d)) return tgl;
  return `${NAMA_HARI_SINGKAT[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN_SINGKAT[d.getMonth()]} ${d.getFullYear()}`;
}
function getFotoArray(fotoStr) {
  if (!fotoStr) return [];
  if (typeof fotoStr === 'string' && fotoStr.trim().startsWith('[')) {
    try { return JSON.parse(fotoStr); } catch(e) { return [fotoStr]; }
  }
  return [fotoStr];
}

function getInitials(name) {
  if (!name) return '?';
  const words = String(name).trim().split(/\s+/);
  if (words.length === 0) return '?';
  if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
  return (words[0][0] + words[words.length - 1][0]).toUpperCase();
}

function updateAvatarUI() {
  if (!DB.profile) return;
  const initials = getInitials(DB.profile.nama);
  const name = DB.profile.nama || '-';
  const email = DB.profile.email || '-';
  const role = DB.profile.role || '';

  ['profile-avatar-mobile', 'profile-avatar-desktop'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = initials;
  });
  const nameD = document.getElementById('profile-name-desktop');
  if (nameD) nameD.textContent = name;
  const roleD = document.getElementById('profile-role-desktop');
  if (roleD) roleD.textContent = role.charAt(0).toUpperCase() + role.slice(1);

  const menuAvatar = document.getElementById('profile-menu-avatar');
  if (menuAvatar) menuAvatar.textContent = initials;
  const menuName = document.getElementById('profile-menu-name');
  if (menuName) menuName.textContent = name;
  const menuEmail = document.getElementById('profile-menu-email');
  if (menuEmail) menuEmail.textContent = email;
  const menuRole = document.getElementById('profile-menu-role');
  if (menuRole) {
    menuRole.textContent = role.charAt(0).toUpperCase() + role.slice(1);
    menuRole.className = `px-2 py-1 text-xs rounded font-semibold ${role === 'admin' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`;
  }
}

function toggleProfileMenu(e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById('profile-menu');
  if (menu) menu.classList.toggle('hidden');
}
document.addEventListener('click', (e) => {
  const menu = document.getElementById('profile-menu');
  if (!menu || menu.classList.contains('hidden')) return;
  const btnM = document.querySelector('#mobile-topbar button[onclick*="toggleProfileMenu"]');
  if (!menu.contains(e.target) && !(btnM && btnM.contains(e.target))) {
    const clickedAvatar = e.target.closest && (e.target.closest('#profile-avatar-btn-desktop') || e.target.closest('[onclick*="toggleProfileMenu"]'));
    if (!clickedAvatar) menu.classList.add('hidden');
  }
});

function getBadgeCount(menuId) {
  const role = DB.profile?.role || '';
  if (menuId === 'invoice' && role === 'admin') {
    return DB.invoice.filter(i => i.jenis === 'siswa' && i.status === 'belum_bayar').length;
  }
  if (menuId === 'jadwal') {
    const tgl = todayISO();
    const myId = getMyTentorId();
    let list = DB.jadwal.filter(j => j.tanggal === tgl);
    if (myId) list = list.filter(j => j.tentor_id === myId);
    return list.length;
  }
  return 0;
}

function showToast(message, type = 'success') {
  const colors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-amber-500' };
  const icons = { success: 'check-circle', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
  const toast = document.createElement('div');
  toast.className = `fixed top-4 right-4 z-[99999] px-4 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center gap-2 max-w-xs animate-slide-in ${colors[type] || colors.success}`;
  toast.innerHTML = `<i data-lucide="${icons[type] || 'check'}" class="w-5 h-5 flex-shrink-0"></i><span class="text-sm">${escapeHtml(message)}</span>`;
  document.body.appendChild(toast);
  if (typeof lucide !== 'undefined') lucide.createIcons();
  setTimeout(() => {
    toast.style.transition = 'all 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(120%)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function showConfirm(title, message, onConfirm, confirmLabel = 'Ya, Lanjutkan', danger = true) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 bg-black/50 z-[99998] flex items-center justify-center p-4 animate-fade-in';
  overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-scale-in">
      <div class="p-6 text-center">
        <div class="w-14 h-14 mx-auto rounded-full ${danger ? 'bg-red-100 text-red-600' : 'bg-orange-100 text-orange-600'} flex items-center justify-center mb-4">
          <i data-lucide="${danger ? 'alert-triangle' : 'help-circle'}" class="w-7 h-7"></i>
        </div>
        <h3 class="text-lg font-bold mb-2">${escapeHtml(title)}</h3>
        <p class="text-sm text-gray-600">${escapeHtml(message)}</p>
      </div>
      <div class="flex gap-2 p-4 bg-gray-50">
        <button class="cancel-btn flex-1 bg-white border rounded-lg py-2.5 font-semibold text-gray-700 hover:bg-gray-100">Batal</button>
        <button class="confirm-btn flex-1 ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-orange-600 hover:bg-orange-700'} text-white rounded-lg py-2.5 font-semibold">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  if (typeof lucide !== 'undefined') lucide.createIcons();
  overlay.querySelector('.cancel-btn').onclick = () => overlay.remove();
  overlay.querySelector('.confirm-btn').onclick = () => { overlay.remove(); onConfirm(); };
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
}

function showImagePreview(src) {
  document.getElementById('image-preview-img').src = src;
  document.getElementById('image-preview-modal').classList.remove('hidden');

async function loadLogo() {
  try {
    const { data } = await supabaseClient.from('settings').select('value').eq('key', 'logo_url').single();
    if (data && data.value) { LOGO_URL = data.value; applyLogo(); }
  } catch (e) { console.log("Logo belum diatur."); }
}
function applyLogo() {
  if (!LOGO_URL) return;
  ['login-logo','sidebar-logo','mobile-logo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.src = LOGO_URL; el.classList.remove('hidden'); }
  });

}

async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { await loadAllData(session.user); }
    else {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-page').classList.add('hidden');
      document.getElementById('loading-page').classList.add('hidden');
    }
  } catch (e) { console.error(e); document.getElementById('login-page').classList.remove('hidden'); }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true; btnText.innerHTML = `Memverifikasi...`;
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email: f.email.value.trim(), password: f.password.value });
    if (error) throw error;
    await loadAllData(data.user);
  } catch (err) {
    showToast("Login gagal: " + err.message, 'error');
    document.getElementById('login-error').classList.remove('hidden');
    btn.disabled = false; btnText.innerText = 'Masuk';
  }
});

async function loadAllData(user) {
  try {
    document.getElementById('login-page').classList.add('hidden');
    const loadingPage = document.getElementById('loading-page');
    loadingPage.classList.remove('hidden'); setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);

    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
    if (profErr || !profile) throw new Error("Profil Anda belum terdaftar.");
    DB.profile = profile;

    const [resSiswa, resTentor, resJadwal, resInvoice, resLaporan, resUsers, resSettings] = await Promise.all([
      supabaseClient.from('siswa').select('*').order('nama'),
      supabaseClient.from('tentor').select('*').order('nama'),
      supabaseClient.from('jadwal').select('*'),
      supabaseClient.from('invoice').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('laporan').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('profiles').select('*').order('nama'),
      supabaseClient.from('settings').select('*')
    ]);

    DB.siswa = resSiswa.data || []; DB.tentor = resTentor.data || []; DB.jadwal = resJadwal.data || [];
    DB.invoice = resInvoice.data || []; DB.laporan = resLaporan.data || [];
    DB.users = resUsers.data || [];
    if (resSettings.data) { resSettings.data.forEach(s => DB.settings[s.key] = s.value); if (DB.settings.logo_url) LOGO_URL = DB.settings.logo_url; }

    if (profile.role === 'tentor') {
      const myTentorId = profile.tentor_id || DB.tentor.find(t => t.email === profile.email)?.id;
      if (myTentorId) {
        DB.jadwal = DB.jadwal.filter(j => j.tentor_id === myTentorId);
        DB.laporan = DB.laporan.filter(l => l.tentor_id === myTentorId);
        const mySiswaIds = new Set(DB.jadwal.map(j => j.siswa_id));
        DB.siswa.forEach(s => { if (s.tentor_id === myTentorId) mySiswaIds.add(s.id); });
        DB.siswa = DB.siswa.filter(s => mySiswaIds.has(s.id));
        DB.tentor = DB.tentor.filter(t => t.id === myTentorId);
        DB.invoice = [];
        DB.users   = [];
      } else {
        DB.siswa = []; DB.jadwal = []; DB.laporan = []; DB.invoice = []; DB.users = [];
      }
    }

    bootApp();
    if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => loadAllData(user), 1000);
      }).subscribe();
  } catch (err) {
    console.error(err);
    showToast("Error: " + err.message, 'error');
    await supabaseClient.auth.signOut();
    location.reload();
  }
}

function logout() {
  const menu = document.getElementById('profile-menu');
  if (menu) menu.classList.add('hidden');
  showConfirm('Logout?', 'Anda akan keluar dari sistem Joy Bimbel.', async () => {
    try {
      if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
      await supabaseClient.removeAllChannels();
      await supabaseClient.auth.signOut();
      location.reload();
    } catch(e) { location.reload(); }
  }, 'Ya, Logout', false);
}

function bootApp() {
  const loadingPage = document.getElementById('loading-page');
  if (loadingPage) loadingPage.classList.add('opacity-0');
  setTimeout(() => {
    if (loadingPage) loadingPage.classList.add('hidden');
    const appPage = document.getElementById('app-page');
    if (appPage) { appPage.classList.remove('hidden'); setTimeout(() => appPage.classList.remove('opacity-0'), 50); }
    applyLogo();
    updateAvatarUI();
    const sidebarRole = document.getElementById('sidebar-role');
    if (sidebarRole && DB.profile) sidebarRole.textContent = DB.profile.role.toUpperCase() + ' - ' + DB.profile.nama;
    renderNav(); renderPage();
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }, 400);
}

function renderNav() {
  const s = DB.profile;

    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'}, {id:'jadwal', label:'Jadwal', icon:'calendar'},

    {id:'akun', label:'Akun & Akses', icon:'shield'}, {id:'pengaturan', label:'Pengaturan Website', icon:'settings'},
    {id:'backup', label:'Backup Data', icon:'database'}
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},

      const badgeCount = getBadgeCount(m.id);

function navigate(page) {
  currentPage = page;
  searchSiswa = ''; searchTentor = ''; searchInvoice = ''; searchLaporan = '';
  filterInvoiceStatus = 'all'; filterInvoiceJenis = 'all'; filterLaporanTentor = 'all';

function toggleSidebar() {
  const s = document.getElementById('sidebar');
  if (!s) return;
  const isOpen = !s.classList.contains('hidden');
  if (isOpen) { closeMobileSidebar(); }
  else {
    s.classList.remove('hidden', '-translate-x-full');
    s.classList.add('flex');
    document.body.classList.add('sidebar-mobile-open');
  }
  setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 50);
}

function closeMobileSidebar() {
  const s = document.getElementById('sidebar');
  if (!s) return;
  s.classList.add('hidden', '-translate-x-full');
  s.classList.remove('flex');
  document.body.classList.remove('sidebar-mobile-open');
}

function toggleSidebarCollapse() {
  document.body.classList.toggle('sidebar-collapsed');
  localStorage.setItem('sidebarCollapsed', document.body.classList.contains('sidebar-collapsed') ? '1' : '0');
  setTimeout(() => { if (typeof lucide !== 'undefined') lucide.createIcons(); }, 50);
}

let modalSubmit = null;
function openModal(title, body, onSubmit) {
  const mTitle = document.getElementById('modal-title'); if (mTitle) mTitle.textContent = title;
  const mBody = document.getElementById('modal-body'); if (mBody) mBody.innerHTML = body;
  modalSubmit = onSubmit;
  const m = document.getElementById('modal'); if (m) m.classList.remove('hidden');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

function renderPage(silent = false) {
  const content = document.getElementById('content');
  if (!content) return;
  const pages = { dashboard: renderDashboard, siswa: () => renderSiswa(), tentor: () => renderTentor(), jadwal: () => renderJadwal(), invoice: () => renderInvoice(), keuangan: () => renderLaporanKeuangan(), akun: () => renderAkun(), pengaturan: () => renderPengaturan(), backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor() };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  if (typeof lucide !== 'undefined') lucide.createIcons();
  if (!silent) {
    content.classList.remove('page-enter');
    void content.offsetWidth;
    content.classList.add('page-enter');
  }
}

function doSearch(key, value, inputId) {
  if (key === 'siswa') searchSiswa = value;
  else if (key === 'tentor') searchTentor = value;
  else if (key === 'invoice') searchInvoice = value;
  else if (key === 'laporan') searchLaporan = value;
  renderPage(true);
  const el = document.getElementById(inputId);
  if (el) {
    el.focus();
    try { const len = el.value.length; el.setSelectionRange(len, len); } catch(e) {}
  }
}

  if (!DB.profile || DB.profile.role !== 'tentor') return null;
  if (DB.profile.tentor_id) return DB.profile.tentor_id;
  const match = DB.tentor.find(t => t.email === DB.profile.email);
  return match ? match.id : null;
}

async function uploadLogo() {
  const input = document.getElementById('logo-input');
  const btn = document.getElementById('btn-upload-logo');
  const file = input.files[0];
  if (!file) { showToast('Pilih file gambar terlebih dahulu!', 'warning'); return; }
  if (file.size > 2 * 1024 * 1024) { showToast('Ukuran file maksimal 2MB.', 'warning'); return; }
  btn.disabled = true; btn.textContent = 'Mengupload...';
  try {
    const fileName = `logo_${Date.now()}.${file.name.split('.').pop()}`;
    const { error: uploadErr } = await supabaseClient.storage.from('logo').upload(fileName, file);
    if (uploadErr) throw uploadErr;
    const { data: { publicUrl } } = supabaseClient.storage.from('logo').getPublicUrl(fileName);
    const { error: dbErr } = await supabaseClient.from('settings').upsert({ key: 'logo_url', value: publicUrl });
    if (dbErr) throw dbErr;
    LOGO_URL = publicUrl; applyLogo();
    showToast('Logo berhasil diperbarui!', 'success');
    renderPage();
  } catch (err) {
    showToast('Gagal upload logo: ' + err.message, 'error');
    btn.disabled = false; btn.textContent = 'Upload Logo';
  }
}

function downloadCSV(table) {
  const data = DB[table] || [];
  if (data.length === 0) { showToast(`Tidak ada data ${table} untuk diunduh.`, 'warning'); return; }
  const allKeys = [...new Set(data.flatMap(obj => Object.keys(obj)))];
  const csvRows = [allKeys.map(h => `"${h}"`).join(',')];
  data.forEach(row => {
    csvRows.push(allKeys.map(h => {
      let val = row[h];
      if (val === null || val === undefined) val = '';
      if (typeof val === 'object') val = JSON.stringify(val);
      return `"${String(val).replace(/"/g, '""')}"`;
    }).join(','));
  });
  const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `JoyBimbel_${table}_${todayISO()}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  showToast(`File ${table} berhasil diunduh`, 'success');
}

async function downloadLaporanAsWord(laporanId) {

  const fotos = getFotoArray(l.foto);

  showToast('Menyiapkan file Word... mohon tunggu', 'info');

  const base64Images = [];
  for (const url of fotos) {
    try {
      const res = await fetch(url);
      const blob = await res.blob();
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
      base64Images.push(base64);

      console.warn('Foto gagal dimuat:', url, e);

    </div></form>`;

  openModal(editing ? 'Edit Laporan' : 'Buat Laporan', body, async (e) => {
    const f = e.target;
    const fileInput = document.getElementById('foto-input');
    const files = fileInput.files;
    if (!files.length && !editing) { showToast('Pilih minimal 1 foto!', 'warning'); return; }
    if (files.length > 5) { showToast('Maksimal 5 foto!', 'warning'); return; }
    if (!f.siswa_id.value) { showToast('Pilih siswa terlebih dahulu!', 'warning'); return; }

    let fotoUrls = [];
    if (files.length > 0) {
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileName = `laporan/${Date.now()}_${i}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
        const { error: err } = await supabaseClient.storage.from('foto_laporan').upload(fileName, file);
        if (err) { showToast("Gagal upload foto: " + err.message, 'error'); return; }
        const { data: { publicUrl } } = supabaseClient.storage.from('foto_laporan').getPublicUrl(fileName);
        fotoUrls.push(publicUrl);
      }
    } else if (editing) { fotoUrls = getFotoArray(editing.foto); }

    const fotoString = JSON.stringify(fotoUrls);
    const myTentorId = getMyTentorId() || DB.tentor[0]?.id;

    else { await supabaseClient.from('laporan').insert([data]); }
    showToast(editing ? 'Laporan diperbarui' : 'Laporan tersimpan', 'success');
    closeModal();
  });

  if (selectedSiswaId) setTimeout(() => updateSiswaInfo(selectedSiswaId), 50);
}

  const editing = id ? DB.invoice.find(x=>x.id===id) : null;
  const body = `<form id="form-invoice">
    <div class="space-y-3">
      <div><label class="text-sm font-medium">Jenis Dokumen *</label>
        <select name="jenis" onchange="onJenisChange(this.value)" class="w-full border rounded-lg px-3 py-2 mt-1">
          <option value="siswa" ${editing?.jenis==='siswa'||!editing?'selected':''}>👨‍👩‍👧 Tagihan / Invoice Siswa</option>
          <option value="tentor" ${editing?.jenis==='tentor'?'selected':''}>👨‍🏫 Slip Gaji Tentor</option>
        </select></div>
      <div>
        <label class="text-sm font-medium">Penerima *</label>
        <div class="flex gap-2 mt-1">
          <select name="untuk_id" id="recipient-select" required onchange="onRecipientChange(this.value)" class="flex-1 border rounded-lg px-3 py-2"></select>

        </div>
      </div>
      <div><label class="text-sm font-medium">Periode</label><input name="periode" value="${escapeHtml(editing?.periode||periodeNow())}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm font-medium">Item</label><div id="items-container" class="space-y-2 mt-1"></div><button type="button" onclick="addItemRow()" class="mt-2 text-sm text-orange-600 hover:underline font-semibold">+ Tambah Baris</button></div>
      <div><label class="text-sm font-medium">Status</label>
        <select name="status" class="w-full border rounded-lg px-3 py-2 mt-1">
          <option value="belum_bayar" ${editing?.status==='belum_bayar'||!editing?'selected':''}>Belum Bayar</option>
          <option value="lunas" ${editing?.status==='lunas'?'selected':''}>Lunas / Sudah Dibayar</option>
        </select></div>
      <div class="flex justify-between items-center pt-3 border-t"><span class="text-sm text-gray-500">Total</span><span id="invoice-total" class="text-xl font-bold text-orange-600">Rp0</span></div>
      <button type="submit" class="w-full bg-rose-600 text-white py-2 rounded-lg font-semibold mt-4">Simpan Dokumen</button>
    </div></form>`;

  openModal(editing ? 'Edit Dokumen' : 'Buat Dokumen Baru', body, async (e) => {
    const f = e.target;
    const items = [];
    document.querySelectorAll('#items-container .item-row').forEach(row => {
      const deskripsi = row.querySelector('.item-desk').value.trim();
      const qty = Number(row.querySelector('.item-qty').value) || 0;
      const harga = Number(row.querySelector('.item-harga').value) || 0;
      let tanggal = null, siswa_id = null;
      const tglInput = row.querySelector('.item-tgl');
      if (tglInput && tglInput.value) tanggal = tglInput.value;
      const selSiswa = row.querySelector('.item-siswa');
      if (selSiswa && selSiswa.value) siswa_id = selSiswa.value;
      if (deskripsi && qty > 0) items.push({ tanggal, siswa_id, deskripsi, qty, harga });
    });
    if (items.length === 0) { showToast('Minimal 1 item harus diisi', 'warning'); return; }
    const total = items.reduce((a,it)=>a+it.qty*it.harga, 0);
    const data = { jenis: f.jenis.value, untuk_id: f.untuk_id.value, periode: f.periode.value.trim(), items: items, total: total, status: f.status.value };
    if (editing) { await supabaseClient.from('invoice').update(data).eq('id', editing.id); }
    else { const no = `INV-${new Date().getFullYear()}-${Math.floor(Math.random()*1000)}`; await supabaseClient.from('invoice').insert([{ no_invoice: no, ...data, tanggal: todayISO() }]); }
    showToast(editing ? 'Dokumen diperbarui' : 'Dokumen tersimpan', 'success');
    closeModal();
  });

  const jenis = editing?.jenis || 'siswa';
  refreshRecipients(jenis, editing?.untuk_id);
  setTimeout(() => { toggleItemFields(jenis); }, 50);

  const items = editing ? editing.items : [{deskripsi:'', qty:1, harga:0}];
  if(Array.isArray(items)) items.forEach(it => addItemRow(it));
  updateInvoiceTotal();
}

function onJenisChange(jenis) {
  refreshRecipients(jenis, '');
  toggleItemFields(jenis);
  document.getElementById('items-container').innerHTML = '';
  addItemRow();
  updateInvoiceTotal();
  const btn = document.getElementById('btn-fetch-jadwal');
  if (btn) btn.classList.toggle('hidden', jenis !== 'tentor');
}

function onRecipientChange(untukId) {
  const jenis = document.querySelector('select[name="jenis"]').value;
  const btn = document.getElementById('btn-fetch-jadwal');
  if (btn) btn.classList.toggle('hidden', jenis !== 'tentor');

  if (jenis === 'tentor' && untukId) {
    const tentor = DB.tentor.find(t => t.id === untukId);
    if (!tentor) return;
    const pastInvoices = DB.invoice.filter(i => i.jenis === 'tentor' && i.untuk_id === untukId);
    const invoicedDates = new Set();
    pastInvoices.forEach(inv => { if (Array.isArray(inv.items)) inv.items.forEach(it => { if (it.tanggal) invoicedDates.add(it.tanggal); }); });
    const today = todayISO();
    const allJadwalTentor = DB.jadwal.filter(j => j.tentor_id === untukId);
    const jadwalTentor = allJadwalTentor.filter(j => j.tanggal && j.tanggal <= today && !invoicedDates.has(j.tanggal));
    const jadwalLama = allJadwalTentor.filter(j => !j.tanggal);
    document.getElementById('items-container').innerHTML = '';
    let addedCount = 0;
    const itemsToInsert = [];
    jadwalTentor.forEach(j => {
      const siswa = DB.siswa.find(s => s.id === j.siswa_id);
      if (!siswa) return;
      const laporan = DB.laporan.find(l => l.tanggal === j.tanggal && l.siswa_id === j.siswa_id && l.tentor_id === untukId);
      const materi = laporan && laporan.topik ? laporan.topik : (siswa.mapel || tentor.mapel || 'Les Privat');
      itemsToInsert.push({ tanggal: j.tanggal, siswa_id: j.siswa_id, deskripsi: materi, qty: 1, harga: tentor.tarif });
      addedCount++;
    });
    jadwalLama.forEach(j => {
      const siswa = DB.siswa.find(s => s.id === j.siswa_id);
      if (!siswa) return;
      const laporan = DB.laporan.find(l => l.siswa_id === j.siswa_id && l.tentor_id === untukId);
      const materi = laporan && laporan.topik ? laporan.topik : (siswa.mapel || tentor.mapel || 'Les Privat');
      itemsToInsert.push({ tanggal: today, siswa_id: j.siswa_id, deskripsi: materi, qty: 1, harga: tentor.tarif });
      addedCount++;
    });
    itemsToInsert.sort((a,b) => {
      const nameA = DB.siswa.find(s=>s.id===a.siswa_id)?.nama || '';
      const nameB = DB.siswa.find(s=>s.id===b.siswa_id)?.nama || '';
      if (nameA !== nameB) return nameA.localeCompare(nameB);
      return a.tanggal.localeCompare(b.tanggal);
    });
    itemsToInsert.forEach(it => addItemRow(it));
    if (addedCount > 0) showToast(`Berhasil menarik ${addedCount} data jadwal`, 'success');
    else {
      if (allJadwalTentor.length === 0) showToast(`Tentor ini belum memiliki jadwal sama sekali.`, 'warning');
      else showToast(`Semua jadwal sudah pernah ditagihkan, atau tanggalnya masih di masa depan.`, 'info');
      addItemRow();
    }
    updateInvoiceTotal();
  }
}

function toggleItemFields(jenis) {
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    const tglInput = row.querySelector('.item-tgl');
    const siswaInput = row.querySelector('.item-siswa');
    if (jenis === 'tentor') {
      if (!tglInput) {
        const newTgl = document.createElement('input');
        newTgl.type = 'date';
        newTgl.className = 'item-tgl w-32 border rounded-lg px-2 py-1.5 text-sm flex-shrink-0';
        newTgl.required = true;
        row.insertBefore(newTgl, row.firstChild);
      }
      if (!siswaInput) {
        const newSiswa = document.createElement('select');
        newSiswa.className = 'item-siswa w-32 border rounded-lg px-2 py-1.5 text-sm flex-shrink-0';
        newSiswa.required = true;
        newSiswa.innerHTML = `<option value="">Pilih</option>` + DB.siswa.map(s => `<option value="${s.id}">${s.nama}</option>`).join('');
        row.insertBefore(newSiswa, row.children[1]);
      }
    } else {
      if (tglInput) tglInput.remove();
      if (siswaInput) siswaInput.remove();
    }
  });
}

function refreshRecipients(jenis, selectedId) {
  const sel = document.getElementById('recipient-select');
  if (!sel) return;
  const data = jenis === 'siswa' ? DB.siswa : DB.tentor;
  sel.innerHTML = '<option value="">— Pilih —</option>' + data.map(d => `<option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(jenis==='siswa' ? `${d.nama} (${d.nama_orang_tua||'-'})` : `${d.nama} - ${d.mapel||'-'}`)}</option>`).join('');
}

function addItemRow(item) {
  const container = document.getElementById('items-container');
  if (!container) return;
  const it = item || { deskripsi:'', qty:1, harga:0, tanggal: '', siswa_id: '' };
  const jenis = document.querySelector('select[name="jenis"]').value;
  const div = document.createElement('div');
  div.className = 'item-row flex flex-col md:flex-row gap-2 items-start md:items-center bg-gray-50 md:bg-transparent p-2 md:p-0 rounded-lg md:rounded-none border md:border-0 mb-2 md:mb-0';
  let html = '';
  if (jenis === 'tentor') {
    html += `<input type="date" class="item-tgl w-full md:w-32 border rounded-lg px-2 py-1.5 text-sm flex-shrink-0" value="${it.tanggal || ''}" required />`;
    html += `<select class="item-siswa w-full md:w-32 border rounded-lg px-2 py-1.5 text-sm flex-shrink-0" required><option value="">Pilih</option>${DB.siswa.map(s => `<option value="${s.id}" ${it.siswa_id===s.id?'selected':''}>${s.nama}</option>`).join('')}</select>`;
  }
  html += `
    <input class="item-desk flex-1 w-full border rounded-lg px-2 py-1.5 text-sm" placeholder="${jenis==='tentor'?'Materi / Topik':'Deskripsi'}" value="${escapeHtml(it.deskripsi)}" required />
    <input class="item-qty w-full md:w-14 border rounded-lg px-2 py-1.5 text-sm" type="number" min="1" value="${it.qty}" oninput="updateInvoiceTotal()" required />
    <input class="item-harga w-full md:w-24 border rounded-lg px-2 py-1.5 text-sm" type="number" min="0" value="${it.harga}" oninput="updateInvoiceTotal()" required />
    <button type="button" onclick="this.parentElement.remove(); updateInvoiceTotal();" class="text-red-500 hover:bg-red-50 p-1.5 rounded font-bold self-end md:self-auto">✕</button>
  `;
  div.innerHTML = html;
  container.appendChild(div);
  updateInvoiceTotal();
}

function updateInvoiceTotal() {
  let total = 0;
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    total += (Number(row.querySelector('.item-qty').value)||0) * (Number(row.querySelector('.item-harga').value)||0);
  });
  const el = document.getElementById('invoice-total');
  if (el) el.textContent = rupiah(total);
}

function buildInvoiceHTML(inv, target) {
  const namaPenerima = inv.jenis==='siswa'

  let itemsArr = inv.items;
  if (!Array.isArray(itemsArr)) itemsArr = [];
  let docTitle = 'INVOICE';

  let totalQty = 0;
  itemsArr.forEach(it => { totalQty += Number(it.qty)||0; });

  if (inv.jenis === 'tentor') { docTitle = 'SLIP GAJI'; headerLabel = 'Pembayaran kepada :'; }

        currentSiswaId = it.siswa_id;
        rowsHtml += `<tr class="bg-orange-100 border-y-2 border-orange-300 font-bold text-orange-900"><td colspan="5" class="py-2 px-2 text-left">👤 ${escapeHtml(namaSiswa)}</td></tr>`;

function printInvoice(id) {
  const inv = DB.invoice.find(x=>x.id===id);
  if (!inv) return;
  const target = inv.jenis==='siswa' ? DB.siswa.find(x=>x.id===inv.untuk_id) : DB.tentor.find(x=>x.id===inv.untuk_id);
  document.getElementById('print-area').innerHTML = buildInvoiceHTML(inv, target);
  setTimeout(() => { window.print(); setTimeout(() => { document.getElementById('print-area').innerHTML = ''; }, 1000); }, 100);
}

async function simpanSiswa(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { nama: f.nama.value, kelas: f.kelas.value, mapel: f.mapel.value || null, alamat: f.alamat.value || null, nama_orang_tua: f.nama_orang_tua.value, no_wa: f.no_wa.value, tentor_id: f.tentor_id.value || null, aktif: true };
  if (id) await supabaseClient.from('siswa').update(data).eq('id', id);
  else await supabaseClient.from('siswa').insert([data]);
  showToast(id ? 'Data siswa diperbarui' : 'Siswa baru ditambahkan', 'success');
  closeModal();
}

          <div class="flex-1 min-w-0"><div class="font-bold text-base truncate">${escapeHtml(t.nama)}</div><div class="text-xs text-gray-500">${escapeHtml(t.mapel || '-')}</div></div>
          <div class="flex gap-1 flex-shrink-0">
            <button onclick="openTentorForm('${t.id}')" class="text-orange-600 p-2.5 bg-orange-50 hover:bg-orange-100 rounded-lg border border-orange-200"><i data-lucide="pencil" class="w-4 h-4"></i></button>
            <button onclick="deleteRecord('tentor','${t.id}','${escapeHtml(t.nama)}')" class="text-red-600 p-2.5 bg-red-50 hover:bg-red-100 rounded-lg border border-red-200"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
        <div class="text-sm space-y-1.5 pt-2 border-t">
          <div class="flex gap-2"><span class="text-gray-500 flex-shrink-0 w-12">Email:</span><span class="truncate">${escapeHtml(t.email || '-')}</span></div>
          <div class="flex gap-2"><span class="text-gray-500 flex-shrink-0 w-12">No WA:</span><span>${escapeHtml(t.no_wa || '-')}</span></div>
          ${t.nama_bank ? `<div class="flex gap-2"><span class="text-gray-500 flex-shrink-0 w-12">Bank:</span><span class="font-medium text-blue-600">${escapeHtml(t.nama_bank)} - ${escapeHtml(t.no_rekening)}</span></div>` : ''}
          <div class="flex gap-2"><span class="text-gray-500 flex-shrink-0 w-12">Siswa:</span><span class="font-semibold">${siswaCount[t.id] || 0} siswa</span></div>
        </div>
      </div>`).join('')}
    </div>
    <div class="hidden md:block bg-white rounded-xl border overflow-hidden">
      <table class="w-full text-sm">
        <thead class="bg-gray-50"><tr>
          <th class="text-left px-4 py-3">Nama</th><th class="text-left px-4 py-3">Kontak</th>
          <th class="text-left px-4 py-3">Mapel</th><th class="text-left px-4 py-3">Bank</th>
          <th class="text-left px-4 py-3">Siswa</th><th class="text-right px-4 py-3">Aksi</th>
        </tr></thead>
        <tbody>${filtered.map(t=>`<tr class="border-t hover:bg-gray-50">
          <td class="px-4 py-3 font-medium">${escapeHtml(t.nama)}</td>
          <td class="px-4 py-3 text-xs">${t.email ? `<div>${escapeHtml(t.email)}</div>` : ''}${t.no_wa ? `<div class="text-gray-500">${escapeHtml(t.no_wa)}</div>` : ''}</td>
          <td class="px-4 py-3">${escapeHtml(t.mapel)}</td>
          <td class="px-4 py-3 text-xs">${t.nama_bank ? `${escapeHtml(t.nama_bank)}<br/><span class="text-gray-500">${escapeHtml(t.no_rekening)}</span>` : '-'}</td>
          <td class="px-4 py-3"><span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold">${siswaCount[t.id] || 0}</span></td>
          <td class="px-4 py-3 text-right whitespace-nowrap">
            <button onclick="openTentorForm('${t.id}')" class="text-orange-600 p-1.5 hover:bg-orange-50 rounded"><i data-lucide="pencil" class="w-4 h-4"></i></button>
            <button onclick="deleteRecord('tentor','${t.id}','${escapeHtml(t.nama)}')" class="text-red-600 p-1.5 hover:bg-red-50 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </td>
        </tr>`).join('')}</tbody>
      </table>
    </div>
    </>`}
  </div>`;
}

async function simpanTentor(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { nama: f.nama.value, email: f.email.value, no_wa: f.no_wa.value, mapel: f.mapel.value, tarif: Number(f.tarif.value)||0, nama_bank: f.nama_bank.value || null, no_rekening: f.no_rekening.value || null };
  if (id) await supabaseClient.from('tentor').update(data).eq('id', id);
  else await supabaseClient.from('tentor').insert([data]);
  showToast(id ? 'Data tentor diperbarui' : 'Tentor baru ditambahkan', 'success');
  closeModal();
}

function openTentorForm(id) {
  const editing = id ? DB.tentor.find(x=>x.id===id) : null;
  const body = `<form data-id="${id||''}"><div class="space-y-3">
    <div><label class="text-sm">Nama *</label><input name="nama" required value="${escapeHtml(editing?.nama||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="text-sm">Email</label><input name="email" type="email" value="${escapeHtml(editing?.email||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">No WhatsApp</label><input name="no_wa" value="${escapeHtml(editing?.no_wa||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="text-sm">Mapel</label><input name="mapel" value="${escapeHtml(editing?.mapel||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Tarif per Sesi</label><input name="tarif" type="number" value="${editing?.tarif||''}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div><label class="text-sm">Nama Bank</label><input name="nama_bank" value="${escapeHtml(editing?.nama_bank||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">No Rekening</label><input name="no_rekening" value="${escapeHtml(editing?.no_rekening||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    </div>
    <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-semibold">Simpan</button>
  </div></form>`;
  openModal(editing?'Edit Tentor':'Tambah Tentor', body, simpanTentor);
}

function renderJadwal() {
  const role = DB.profile?.role || 'tentor';
  const myTentorId = getMyTentorId();
  let filteredJadwal = [];
  if (role === 'admin') filteredJadwal = DB.jadwal;
  else if (role === 'tentor' && myTentorId) filteredJadwal = DB.jadwal.filter(j => j.tentor_id === myTentorId);

  const q = (searchSiswa || '').toLowerCase();
  if (q) {
    const matchingSiswaIds = DB.siswa.filter(s => (s.nama||'').toLowerCase().includes(q)).map(s => s.id);
    filteredJadwal = filteredJadwal.filter(j => matchingSiswaIds.includes(j.siswa_id));
  }

  const grouped = {};
  filteredJadwal.forEach(j => { if (!grouped[j.siswa_id]) grouped[j.siswa_id] = []; grouped[j.siswa_id].push(j); });
  Object.keys(grouped).forEach(sid => {
    grouped[sid].sort((a, b) => {
      const da = a.tanggal || '9999-12-31', db = b.tanggal || '9999-12-31';
      if (da !== db) return da.localeCompare(db);
      return (a.jam_mulai || '').localeCompare(b.jam_mulai || '');
    });
  });
  const sortedSiswaIds = Object.keys(grouped).sort((a, b) => {
    const nameA = DB.siswa.find(x=>x.id===a)?.nama || '';
    const nameB = DB.siswa.find(x=>x.id===b)?.nama || '';
    return nameA.localeCompare(nameB);
  });
  const today = todayISO();

  return `<div>
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
      <div><h1 class="text-2xl font-bold">Jadwal Les</h1><p class="text-gray-500 text-sm">${filteredJadwal.length} sesi untuk ${sortedSiswaIds.length} siswa</p></div>
      ${role==='admin'?`<button onclick="openJadwalForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold self-start">+ Tambah Jadwal</button>`:''}
    </div>
    <div class="bg-white rounded-xl border p-3 mb-4">
      <div class="relative"><i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="search-jadwal" oninput="doSearch('siswa', this.value, 'search-jadwal')" value="${escapeHtml(searchSiswa)}" placeholder="Cari nama siswa..." class="w-full border rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
      </div>
    </div>
    ${sortedSiswaIds.length === 0 ? `<div class="text-center text-gray-400 py-12 bg-white border rounded-xl"><i data-lucide="calendar" class="w-10 h-10 mx-auto mb-2 text-gray-300"></i><p>${searchSiswa ? 'Tidak ada jadwal yang cocok.' : 'Belum ada jadwal.'}</p></div>` :
    `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
      ${sortedSiswaIds.map(siswaId => {
        const s = DB.siswa.find(x=>x.id===siswaId) || {};
        const jadwalSiswa = grouped[siswaId];
        const isExpanded = expandedJadwal[siswaId] === true;
        const upcoming = jadwalSiswa.filter(j => j.tanggal && j.tanggal >= today);
        const past = jadwalSiswa.filter(j => !j.tanggal || j.tanggal < today);
        const nextJadwal = upcoming[0];
        return `<div class="bg-white rounded-xl border shadow-sm overflow-hidden flex flex-col transition hover:shadow-md">
          <button onclick="toggleJadwalCard('${siswaId}')" class="bg-orange-50 px-4 py-3 border-b border-orange-100 text-left w-full hover:bg-orange-100 transition">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0 flex-1">
                <i data-lucide="user" class="w-5 h-5 text-orange-600 flex-shrink-0"></i>
                <div class="min-w-0 flex-1">
                  <h2 class="font-bold text-base text-orange-800 truncate">${escapeHtml(s.nama || 'Siswa Terhapus')}</h2>
                  <div class="text-xs text-orange-600 truncate">${escapeHtml(s.kelas || '-')}${s.mapel ? ' • ' + escapeHtml(s.mapel) : ''}</div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <span class="text-xs bg-orange-600 text-white px-2 py-1 rounded-full font-semibold">${jadwalSiswa.length}×</span>
                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5 text-orange-600"></i>
              </div>
            </div>
            ${!isExpanded && nextJadwal ? `<div class="text-xs text-gray-600 mt-2 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> Berikutnya: ${formatTanggal(nextJadwal.tanggal)}</div>` : ''}
          </button>
          ${isExpanded ? `
          <div class="p-4 flex-1 space-y-2 animate-fade-in">
            ${upcoming.length === 0 && past.length === 0 ? '<p class="text-xs text-gray-400 text-center py-2">Belum ada jadwal</p>' : ''}
            ${upcoming.map(j => {
              const t = DB.tentor.find(x=>x.id===j.tentor_id) || {};
              return `<div class="bg-orange-50 border border-orange-200 rounded-lg p-3 flex justify-between items-start gap-2">
                <div class="flex-1 min-w-0">
                  <div class="font-semibold text-gray-800 text-sm">${formatTanggal(j.tanggal)}</div>
                  <div class="text-xs text-gray-600 mt-0.5 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${formatJam(j.jam_mulai)} - ${formatJam(j.jam_selesai)}</div>
                  <div class="text-xs text-orange-600 mt-1 font-medium truncate">Tentor: ${escapeHtml(t.nama || '-')}</div>
                </div>
                <div class="flex flex-col gap-0.5 flex-shrink-0">
                  <button onclick="event.stopPropagation(); openJadwalForm('${j.id}')" class="text-blue-500 hover:text-blue-700 p-1.5 rounded hover:bg-blue-50" title="Edit jadwal"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                  ${role==='admin'?`<button onclick="event.stopPropagation(); deleteRecord('jadwal','${j.id}','jadwal ${formatTanggal(j.tanggal)}')" class="text-red-400 hover:text-red-600 p-1.5 rounded hover:bg-red-50" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
                </div>
              </div>`;
            }).join('')}
            ${past.length > 0 ? `<details class="mt-2">
              <summary class="text-xs text-gray-500 cursor-pointer hover:text-gray-700 font-medium">Lihat ${past.length} jadwal lampau</summary>
              <div class="space-y-2 mt-2">
                ${past.map(j => {
                  const t = DB.tentor.find(x=>x.id===j.tentor_id) || {};
                  return `<div class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex justify-between items-start gap-2 opacity-75">
                    <div class="flex-1 min-w-0">
                      <div class="font-semibold text-gray-700 text-sm">${j.tanggal ? formatTanggal(j.tanggal) : (j.hari || 'Tanggal belum diatur')}</div>
                      <div class="text-xs text-gray-500 mt-0.5 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${formatJam(j.jam_mulai)} - ${formatJam(j.jam_selesai)}</div>
                      <div class="text-xs text-gray-500 mt-1 truncate">Tentor: ${escapeHtml(t.nama || '-')}</div>
                    </div>
                    <div class="flex flex-col gap-0.5 flex-shrink-0">
                      <button onclick="event.stopPropagation(); openJadwalForm('${j.id}')" class="text-blue-500 hover:text-blue-700 p-1.5 rounded hover:bg-blue-50" title="Edit jadwal"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                      ${role==='admin'?`<button onclick="event.stopPropagation(); deleteRecord('jadwal','${j.id}','jadwal ${j.tanggal || j.hari}')" class="text-red-400 hover:text-red-600 p-1.5 rounded hover:bg-red-50" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
                    </div>
                  </div>`;
                }).join('')}
              </div>
            </details>` : ''}
          </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}

function toggleJadwalCard(siswaId) {
  expandedJadwal[siswaId] = !expandedJadwal[siswaId];
  renderPage();
}

async function simpanJadwal(e) {
  const f = e.target;
  const id = f.dataset.id;
  const tanggal = f.tanggal.value;
  const d = new Date(tanggal + 'T00:00:00');
  const hari = NAMA_HARI[d.getDay()];
  const data = { siswa_id: f.siswa_id.value, tentor_id: f.tentor_id.value, tanggal, hari, jam_mulai: f.jam_mulai.value, jam_selesai: f.jam_selesai.value };
  const { error } = id
    ? await supabaseClient.from('jadwal').update(data).eq('id', id)
    : await supabaseClient.from('jadwal').insert([data]);
  if (error) { showToast('Gagal: ' + error.message, 'error'); return; }
  showToast(id ? 'Jadwal diperbarui' : 'Jadwal berhasil ditambahkan', 'success');
  closeModal();
}

function openJadwalForm(id) {
  const editing = id ? DB.jadwal.find(x=>x.id===id) : null;
  const role = DB.profile?.role || 'tentor';
  const myTentorId = getMyTentorId();
  const isTentor = role === 'tentor';

  const body = `<form data-id="${id||''}"><div class="space-y-3">
    <div><label class="text-sm">Siswa</label>
      <select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">
        ${DB.siswa.map(s=>`<option value="${s.id}" ${editing?.siswa_id===s.id?'selected':''}>${escapeHtml(s.nama)}${s.kelas?` (${escapeHtml(s.kelas)})`:''}${s.mapel?` - ${escapeHtml(s.mapel)}`:''}</option>`).join('')}
      </select>
    </div>
    ${isTentor
      ? `<input type="hidden" name="tentor_id" value="${myTentorId||''}" />
         <div><label class="text-sm">Tentor</label>
           <input type="text" disabled value="${escapeHtml(DB.tentor.find(t=>t.id===myTentorId)?.nama || '-')}" class="w-full border rounded-lg px-3 py-2 mt-1 bg-gray-100 text-gray-600" />
         </div>`
      : `<div><label class="text-sm">Tentor</label>
           <select name="tentor_id" required class="w-full border rounded-lg px-3 py-2 mt-1">
             ${DB.tentor.map(t=>`<option value="${t.id}" ${editing?.tentor_id===t.id?'selected':''}>${escapeHtml(t.nama)}</option>`).join('')}
           </select>
         </div>`}
    <div><label class="text-sm">Tanggal Les *</label><input type="date" name="tanggal" required value="${editing?.tanggal || todayISO()}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    <div class="grid grid-cols-2 gap-2">
      <div><label class="text-sm">Jam Mulai</label><input type="time" name="jam_mulai" value="${editing?.jam_mulai ? formatJam(editing.jam_mulai) : '15:00'}" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Jam Selesai</label><input type="time" name="jam_selesai" value="${editing?.jam_selesai ? formatJam(editing.jam_selesai) : '16:30'}" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
    </div>
    ${!editing ? `<div class="bg-blue-50 border border-blue-200 rounded-lg p-3"><p class="text-xs text-blue-700"><b>💡 Tips:</b> Tambahkan jadwal baru setiap akan les di tanggal yang sudah disepakati.</p></div>` : `<div class="bg-amber-50 border border-amber-200 rounded-lg p-3"><p class="text-xs text-amber-700"><b>✏️ Mode Edit:</b> Perubahan akan langsung memperbarui jadwal ini.</p></div>`}
    <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold">${editing ? 'Simpan Perubahan' : 'Simpan'}</button>
  </div></form>`;
  openModal(editing ? 'Edit Jadwal Les' : 'Tambah Jadwal Les', body, simpanJadwal);
}

async function deleteRecord(table, id, name = 'data ini') {
  showConfirm('Hapus Data?', `Yakin ingin menghapus "${name}"? Tindakan ini tidak bisa dibatalkan.`, async () => {
    const { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) showToast('Gagal menghapus: ' + error.message, 'error');
    else showToast('Data berhasil dihapus', 'success');
  });
}

window.addEventListener('DOMContentLoaded', async () => {
  if (localStorage.getItem('sidebarCollapsed') === '1') {
    document.body.classList.add('sidebar-collapsed');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
  await loadLogo();
  checkSession();
});
</script>
</body>
