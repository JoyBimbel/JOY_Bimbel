<!-- LOGIN -->
<div id="login-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 p-4">
  <form id="login-form" class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md transition-all duration-300">

</div>

<!-- APP -->
<div id="app-page" class="hidden opacity-0 transition-opacity duration-500">
  <div class="md:hidden bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-30">
    <button onclick="toggleSidebar()"><i data-lucide="menu" class="w-6 h-6"></i></button>
    <span class="font-bold"><span class="text-orange-600">Joy</span> Bimbel</span>
    <button onclick="logout()" class="text-red-600 p-1"><i data-lucide="log-out" class="w-5 h-5"></i></button>
  </div>

  <div class="flex min-h-screen">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-white border-r p-4 flex-col hidden md:flex transform -translate-x-full md:translate-x-0 transition-transform overflow-y-auto">
      <div class="flex items-center justify-between mb-6"><h1 class="text-xl font-bold"><span class="text-orange-600">Joy</span> Bimbel</h1><button class="md:hidden" onclick="toggleSidebar()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="text-xs text-gray-500 mb-4 px-3 py-2 bg-gray-50 rounded-lg">Login: <b id="sidebar-role"></b></div>
      <nav id="nav" class="flex-1 space-y-1 overflow-y-auto"></nav>
      <button onclick="logout()" class="mt-4 flex items-center gap-3 px-3 py-2 rounded-lg text-red-600 hover:bg-red-50 w-full flex-shrink-0"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
    </aside>
    <main class="flex-1 p-4 md:p-8 overflow-x-auto"><div id="content"></div></main>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-5 border-b sticky top-0 bg-white z-10"><h2 id="modal-title" class="text-lg font-bold"></h2><button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button></div>
    <div id="modal-body" class="p-5"></div>
  </div>
</div>

<div id="print-area"></div>

<script>
// ================= ERROR HANDLER GLOBAL =================
window.onerror = function(msg, url, line, col, error) {
  const errDiv = document.getElementById('global-error');
  if (errDiv) {
    errDiv.innerHTML = "⚠️ Error Sistem: " + msg + " (Baris " + line + ")";
    errDiv.classList.remove('hidden');
    setTimeout(() => errDiv.classList.add('hidden'), 5000);
  }
  return false;
};

// ================= GLOBAL DATA =================
let DB = { profile: null, siswa: [], tentor: [], jadwal: [], absensi: [], invoice: [], laporan: [] };
let currentPage = 'dashboard';
let absensiDate = new Date().toISOString().slice(0,10);
let realtimeChannel = null;
let refreshTimeout = null;

// ================= HELPERS =================
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

// ================= AUTH =================
async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      await loadAllData(session.user);
    } else {
      const lp = document.getElementById('login-page');
      const ap = document.getElementById('app-page');
      const ldp = document.getElementById('loading-page');
      if (lp) lp.classList.remove('hidden');
      if (ap) ap.classList.add('hidden');
      if (ldp) ldp.classList.add('hidden');
    }
  } catch (e) {
    console.error(e);
    const lp = document.getElementById('login-page');
    if (lp) lp.classList.remove('hidden');
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  if (btn) btn.disabled = true; 
  if (btnText) btnText.innerHTML = `Memverifikasi...`;

  const email = f.email.value.trim();
  const password = f.password.value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadAllData(data.user);
  } catch (err) {
    alert("Login Gagal: " + err.message);
    const loginError = document.getElementById('login-error');
    if (loginError) loginError.classList.remove('hidden');
    if (btn) btn.disabled = false; 
    if (btnText) btnText.innerText = 'Masuk';
  }
});

async function loadAllData(user) {
  try {
    const lp = document.getElementById('login-page');
    if (lp) lp.classList.add('hidden');
    
    const loadingPage = document.getElementById('loading-page');
    if (loadingPage) {
      loadingPage.classList.remove('hidden'); 
      setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);
    }

    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
    
    if (profErr || !profile) {
      throw new Error("Profil Anda belum terdaftar di tabel 'profiles'.");
    }
    DB.profile = profile;

    const [resSiswa, resTentor, resJadwal, resAbsensi, resInvoice, resLaporan] = await Promise.all([
      supabaseClient.from('siswa').select('*').order('nama'),
      supabaseClient.from('tentor').select('*').order('nama'),
      supabaseClient.from('jadwal').select('*'),
      supabaseClient.from('absensi').select('*'),
      supabaseClient.from('invoice').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('laporan').select('*').order('created_at', { ascending: false })
    ]);

    DB.siswa = resSiswa.data || []; DB.tentor = resTentor.data || []; DB.jadwal = resJadwal.data || [];
    DB.absensi = resAbsensi.data || []; DB.invoice = resInvoice.data || []; DB.laporan = resLaporan.data || [];

    bootApp();
    
    if (realtimeChannel) {
      await supabaseClient.removeChannel(realtimeChannel);
    }

    realtimeChannel = supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => loadAllData(user), 1000);
      }).subscribe();

  } catch (err) {
    alert("Error Load Data: " + err.message);
    await supabaseClient.auth.signOut();
    location.reload();
  }
}

async function logout() { 
  if (!confirm('Apakah Anda yakin ingin keluar?')) return; 
  try {
    if (realtimeChannel) {
      await supabaseClient.removeChannel(realtimeChannel);
      realtimeChannel = null;
    }
    await supabaseClient.removeAllChannels();
    await supabaseClient.auth.signOut(); 
    location.reload(); 
  } catch (error) {
    console.error("Gagal logout:", error);
    location.reload(); 
  }
}

// ================= APP ROUTING =================
function bootApp() {
  const loadingPage = document.getElementById('loading-page');
  if (loadingPage) loadingPage.classList.add('opacity-0');
  
  setTimeout(() => {
    if (loadingPage) loadingPage.classList.add('hidden');
    
    const appPage = document.getElementById('app-page');
    if (appPage) {
      appPage.classList.remove('hidden'); 
      setTimeout(() => appPage.classList.remove('opacity-0'), 50);
    }
    
    const sidebarRole = document.getElementById('sidebar-role');
    if (sidebarRole && DB.profile) sidebarRole.textContent = DB.profile.role.toUpperCase() + ' - ' + DB.profile.nama;
    
    const mobileRole = document.getElementById('mobile-role');
    if (mobileRole && DB.profile) mobileRole.textContent = DB.profile.role;
    
    renderNav(); renderPage(); 
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }, 400);
}

function renderNav() {
  const s = DB.profile;
  const adminMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'}, {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'absensi', label:'Absensi', icon:'clipboard-check'}, {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
    {id:'invoice', label:'Invoice', icon:'file-text'}, {id:'keuangan', label:'Laporan Keuangan', icon:'bar-chart-3'},
    {id:'backup', label:'Backup Data', icon:'database'}
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'}, {id:'absensi', label:'Absensi', icon:'clipboard-check'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'}
  ];
  const menus = s && s.role === 'admin' ? adminMenus : tentorMenus;
  const nav = document.getElementById('nav');
  if (nav) {
    nav.innerHTML = menus.map(m => `
      <button onclick="navigate('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg w-full text-left transition ${currentPage===m.id ? 'bg-orange-50 text-orange-700 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">
        <i data-lucide="${m.icon}" class="w-4 h-4 flex-shrink-0"></i> <span class="truncate">${m.label}</span>
      </button>`).join('');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function navigate(page) { currentPage = page; renderNav(); renderPage(); if (window.innerWidth < 768) { const sb = document.getElementById('sidebar'); if (sb) { sb.classList.add('hidden','-translate-x-full'); } } }
function toggleSidebar() { const s = document.getElementById('sidebar'); if (s) { s.classList.toggle('hidden'); s.classList.toggle('-translate-x-full'); } }

// ================= MODAL =================
let modalSubmit = null;
function openModal(title, body, onSubmit) {
  const mTitle = document.getElementById('modal-title');
  if (mTitle) mTitle.textContent = title; 
  const mBody = document.getElementById('modal-body');
  if (mBody) mBody.innerHTML = body;
  modalSubmit = onSubmit; 
  const m = document.getElementById('modal');
  if (m) m.classList.remove('hidden'); 
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

// ================= RENDER PAGE =================
function renderPage() {
  const content = document.getElementById('content');
  if (!content) return;
  const pages = { dashboard: renderDashboard, siswa: () => renderSiswa(), tentor: () => renderTentor(), jadwal: () => renderJadwal(), absensi: () => renderAbsensi(), invoice: () => renderInvoice(), keuangan: () => renderLaporanKeuangan(), backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor() };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// ================= DASHBOARD =================
function renderDashboard() {
  const s = DB.profile; const siswa = DB.siswa, tentor = DB.tentor, inv = DB.invoice;
  const pemasukan = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);
  const pemasukanCard = s && s.role === 'admin' ? `<div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Pemasukan Lunas</div><div class="text-xl font-bold text-emerald-600">${rupiah(pemasukan)}</div></div>` : '';
  return `
    <div>
      <h1 class="text-2xl font-bold mb-1">Dashboard ${s && s.role==='admin'?'Admin':'Tentor'}</h1>
      <p class="text-gray-500 mb-6 text-sm">Selamat datang, ${s ? escapeHtml(s.nama) : ''} 👋</p>
      <div class="grid grid-cols-2 ${s && s.role==='admin'?'md:grid-cols-4':'md:grid-cols-3'} gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Siswa</div><div class="text-xl font-bold">${siswa.length}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Tentor</div><div class="text-xl font-bold">${tentor.length}</div></div>
        ${pemasukanCard}
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Laporan</div><div class="text-xl font-bold text-orange-600">${DB.laporan.length}</div></div>
      </div>
    </div>`;
}

// ================= CRUD FUNCTIONS =================
async function deleteRecord(table, id) {
  if (!confirm('Yakin hapus data ini?')) return;
  await supabaseClient.from(table).delete().eq('id', id);
}

async function simpanSiswa(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { nama: f.nama.value, kelas: f.kelas.value, nama_orang_tua: f.nama_orang_tua.value, tentor_id: f.tentor_id.value || null, aktif: true };
  if (id) await supabaseClient.from('siswa').update(data).eq('id', id);
  else await supabaseClient.from('siswa').insert([data]);
  closeModal();
}

function openSiswaForm(id) {
  const editing = id ? DB.siswa.find(x=>x.id===id) : null;
  const body = `<form data-id="${id||''}">
    <div class="space-y-3">
      <div><label class="text-sm">Nama *</label><input name="nama" required value="${escapeHtml(editing?.nama||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Kelas</label><input name="kelas" value="${escapeHtml(editing?.kelas||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Orang Tua *</label><input name="nama_orang_tua" required value="${escapeHtml(editing?.nama_orang_tua||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Tentor</label><select name="tentor_id" class="w-full border rounded-lg px-3 py-2 mt-1"><option value="">-</option>${DB.tentor.map(t=>`<option value="${t.id}" ${editing?.tentor_id===t.id?'selected':''}>${escapeHtml(t.nama)}</option>`).join('')}</select></div>
      <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg">Simpan</button>
    </div></form>`;
  openModal(editing?'Edit Siswa':'Tambah Siswa', body, simpanSiswa);
}

async function simpanTentor(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { nama: f.nama.value, email: f.email.value, mapel: f.mapel.value, tarif: Number(f.tarif.value)||0 };
  if (id) await supabaseClient.from('tentor').update(data).eq('id', id);
  else await supabaseClient.from('tentor').insert([data]);
  closeModal();
}
function openTentorForm(id) {
  const editing = id ? DB.tentor.find(x=>x.id===id) : null;
  const body = `<form data-id="${id||''}">
    <div class="space-y-3">
      <div><label class="text-sm">Nama *</label><input name="nama" required value="${escapeHtml(editing?.nama||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Email</label><input name="email" type="email" value="${escapeHtml(editing?.email||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Mapel</label><input name="mapel" value="${escapeHtml(editing?.mapel||'')}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Tarif per Sesi</label><input name="tarif" type="number" value="${editing?.tarif||''}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg">Simpan</button>
    </div></form>`;
  openModal(editing?'Edit Tentor':'Tambah Tentor', body, simpanTentor);
}

// ================= VIEWS =================
function renderSiswa() {
  const role = DB.profile ? DB.profile.role : 'tentor';
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Daftar Siswa</h1>${role==='admin'?`<button onclick="openSiswaForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm">+ Tambah Siswa</button>`:''}</div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-left px-4 py-3">Kelas</th><th class="text-left px-4 py-3">Ortu</th>${role==='admin'?'<th class="text-right px-4 py-3">Aksi</th>':''}</tr></thead>
      <tbody>${DB.siswa.map(s=>`<tr class="border-t"><td class="px-4 py-3 font-medium">${escapeHtml(s.nama)}</td><td class="px-4 py-3">${escapeHtml(s.kelas)}</td><td class="px-4 py-3">${escapeHtml(s.nama_orang_tua)}</td>${role==='admin'?`<td class="px-4 py-3 text-right"><button onclick="openSiswaForm('${s.id}')" class="text-orange-600 p-1.5"><i data-lucide="pencil" class="w-4 h-4"></i></button><button onclick="deleteRecord('siswa','${s.id}')" class="text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>`:''}</tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function renderTentor() {
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Daftar Tentor</h1><button onclick="openTentorForm()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm">+ Tambah Tentor</button></div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-left px-4 py-3">Mapel</th><th class="text-left px-4 py-3">Email</th><th class="text-right px-4 py-3">Aksi</th></tr></thead>
      <tbody>${DB.tentor.map(t=>`<tr class="border-t"><td class="px-4 py-3 font-medium">${escapeHtml(t.nama)}</td><td class="px-4 py-3">${escapeHtml(t.mapel)}</td><td class="px-4 py-3">${escapeHtml(t.email)}</td><td class="px-4 py-3 text-right"><button onclick="openTentorForm('${t.id}')" class="text-orange-600 p-1.5"><i data-lucide="pencil" class="w-4 h-4"></i></button><button onclick="deleteRecord('tentor','${t.id}')" class="text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`).join('')}</tbody>
    </table></div>
  </div>`;
}

function renderJadwal() {
  const role = DB.profile ? DB.profile.role : 'tentor';
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Jadwal</h1>${role==='admin'?`<button onclick="openJadwalForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm">+ Tambah</button>`:''}</div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Hari</th><th class="text-left px-4 py-3">Jam</th><th class="text-left px-4 py-3">Siswa</th>${role==='admin'?'<th class="text-right px-4 py-3">Aksi</th>':''}</tr></thead>
      <tbody>${DB.jadwal.map(j=>{ const s = DB.siswa.find(x=>x.id===j.siswa_id)||{}; return `<tr class="border-t"><td class="px-4 py-3">${j.hari}</td><td class="px-4 py-3">${j.jam_mulai}-${j.jam_selesai}</td><td class="px-4 py-3">${escapeHtml(s.nama)}</td>${role==='admin'?`<td class="px-4 py-3 text-right"><button onclick="deleteRecord('jadwal','${j.id}')" class="text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>`:''}</tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}
async function simpanJadwal(e) {
  const f = e.target;
  await supabaseClient.from('jadwal').insert([{ siswa_id: f.siswa_id.value, tentor_id: f.tentor_id.value, hari: f.hari.value, jam_mulai: f.jam_mulai.value, jam_selesai: f.jam_selesai.value }]);
  closeModal();
}
function openJadwalForm() {
  const body = `<form>
    <div class="space-y-3">
      <div><label class="text-sm">Siswa</label><select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.siswa.map(s=>`<option value="${s.id}">${escapeHtml(s.nama)}</option>`).join('')}</select></div>
      <div><label class="text-sm">Tentor</label><select name="tentor_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.tentor.map(t=>`<option value="${t.id}">${escapeHtml(t.nama)}</option>`).join('')}</select></div>
      <div><label class="text-sm">Hari</label><select name="hari" class="w-full border rounded-lg px-3 py-2 mt-1">${HARI.map(h=>`<option value="${h}">${h}</option>`).join('')}</select></div>
      <div class="grid grid-cols-2 gap-2"><div><label class="text-sm">Mulai</label><input type="time" name="jam_mulai" value="15:00" class="w-full border rounded-lg px-3 py-2" /></div><div><label class="text-sm">Selesai</label><input type="time" name="jam_selesai" value="16:30" class="w-full border rounded-lg px-3 py-2" /></div></div>
      <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg">Simpan</button>
    </div></form>`;
  openModal('Tambah Jadwal', body, simpanJadwal);
}

function renderAbsensi() {
  const existing = DB.absensi.filter(a => a.tanggal === absensiDate);
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Absensi</h1><input type="date" value="${absensiDate}" onchange="absensiDate=this.value; renderPage();" class="border rounded-lg px-3 py-2 text-sm" /></div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-center px-4 py-3">Status</th></tr></thead>
      <tbody>${DB.siswa.map(s=>{ const cur = existing.find(a=>a.siswa_id===s.id)?.status; return `<tr class="border-t"><td class="px-4 py-3">${escapeHtml(s.nama)}</td><td class="px-4 py-3 flex justify-center gap-1">${['hadir','izin','sakit','alpa'].map(st=>`<button onclick="setAbsensi('${s.id}','${st}')" class="px-3 py-1 rounded text-xs border ${cur===st?'bg-orange-500 text-white':'bg-white'} capitalize">${st}</button>`).join('')}</td></tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}
async function setAbsensi(siswa_id, status) {
  const ex = DB.absensi.find(a => a.siswa_id===siswa_id && a.tanggal===absensiDate);
  if (ex) await supabaseClient.from('absensi').update({ status }).eq('id', ex.id);
  else await supabaseClient.from('absensi').insert([{ siswa_id, tanggal: absensiDate, status, oleh: DB.profile ? DB.profile.email : '' }]);
}

function renderLaporanTentor() {
  const role = DB.profile ? DB.profile.role : 'tentor';
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Laporan Mengajar</h1>${role==='tentor'?`<button onclick="openLaporanForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm">+ Buat Laporan</button>`:''}</div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${DB.laporan.map(l=>{ const s = DB.siswa.find(x=>x.id===l.siswa_id)||{}; const t = DB.tentor.find(x=>x.id===l.tentor_id)||{}; return `<div class="bg-white rounded-xl border overflow-hidden flex flex-col">${l.foto?`<img src="${l.foto}" class="w-full h-48 object-cover border-b" />`:''}<div class="p-4 flex-1"><div class="font-bold text-lg">${escapeHtml(s.nama)}</div><div class="text-xs text-gray-500 mb-2">${l.tanggal} • ${escapeHtml(t.nama)}</div><p class="text-sm text-gray-700">${escapeHtml(l.catatan)}</p></div></div>`; }).join('')}</div>
  </div>`;
}
function openLaporanForm() {
  const body = `<form id="form-laporan">
    <div class="space-y-3">
      <div><label class="text-sm">Siswa *</label><select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.siswa.map(s=>`<option value="${s.id}">${escapeHtml(s.nama)}</option>`).join('')}</select></div>
      <div class="grid grid-cols-2 gap-3"><div><label class="text-sm">Tanggal</label><input name="tanggal" type="date" required value="${todayISO()}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div><div><label class="text-sm">Mapel</label><input name="mapel" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div></div>
      <div><label class="text-sm">Perkembangan *</label><textarea name="catatan" required rows="3" class="w-full border rounded-lg px-3 py-2 mt-1"></textarea></div>
      <div><label class="text-sm">Foto *</label><input type="file" id="foto-input" accept="image/*" required class="w-full border rounded-lg px-3 py-2 mt-1 text-sm" /></div>
      <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold">Kirim Laporan</button>
    </div></form>`;
  openModal('Buat Laporan', body, async (e) => {
    const f = e.target; const file = document.getElementById('foto-input').files[0];
    if (!file) return;
    const fileName = `laporan/${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
    const { data: uploadData, error: err } = await supabaseClient.storage.from('foto_laporan').upload(fileName, file);
    if (err) { alert("Gagal upload foto: " + err.message); return; }
    const { data: { publicUrl } } = supabaseClient.storage.from('foto_laporan').getPublicUrl(fileName);
    
    const myTentor = DB.tentor.find(t => DB.profile && t.email === DB.profile.email) || DB.tentor[0] || { id: null };
    await supabaseClient.from('laporan').insert([{ tentor_id: myTentor.id, siswa_id: f.siswa_id.value, tanggal: f.tanggal.value, mapel: f.mapel.value, catatan: f.catatan.value, foto: publicUrl }]);
    closeModal();
  });
}

function renderInvoice() {
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Invoice</h1><button onclick="openInvoiceForm()" class="bg-rose-600 text-white px-4 py-2 rounded-lg text-sm">+ Buat Invoice</button></div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">No</th><th class="text-left px-4 py-3">Penerima</th><th class="text-left px-4 py-3">Total</th><th class="text-right px-4 py-3">Aksi</th></tr></thead>
      <tbody>${DB.invoice.map(i=>{ const t = i.jenis==='siswa'?DB.siswa.find(x=>x.id===i.untuk_id):DB.tentor.find(x=>x.id===i.untuk_id); return `<tr class="border-t"><td class="px-4 py-3">${i.no_invoice}</td><td class="px-4 py-3">${escapeHtml(t?.nama||'-')}</td><td class="px-4 py-3 font-semibold">${rupiah(i.total)}</td><td class="px-4 py-3 text-right"><button onclick="deleteRecord('invoice','${i.id}')" class="text-red-600 p-1.5"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td></tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}
function openInvoiceForm() {
  const body = `<form>
    <div class="space-y-3">
      <div><label class="text-sm">Jenis</label><select name="jenis" class="w-full border rounded-lg px-3 py-2 mt-1"><option value="siswa">Siswa</option><option value="tentor">Tentor</option></select></div>
      <div><label class="text-sm">Penerima</label><select name="untuk_id" class="w-full border rounded-lg px-3 py-2 mt-1">${DB.siswa.map(s=>`<option value="${s.id}">${escapeHtml(s.nama)}</option>`).join('')}${DB.tentor.map(t=>`<option value="${t.id}">${escapeHtml(t.nama)}</option>`).join('')}</select></div>
      <div><label class="text-sm">Total (Rp)</label><input type="number" name="total" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <button type="submit" class="w-full bg-rose-600 text-white py-2 rounded-lg">Simpan</button>
    </div></form>`;
  openModal('Buat Invoice', body, async (e) => {
    const f = e.target;
    const no = `INV-${new Date().getFullYear()}-${Math.floor(Math.random()*1000)}`;
    await supabaseClient.from('invoice').insert([{ no_invoice: no, jenis: f.jenis.value, untuk_id: f.untuk_id.value, total: Number(f.total.value), items: [] }]);
    closeModal();
  });
}

function renderLaporanKeuangan() {
  const inv = DB.invoice;
  const pemasukan = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);
  return `<div>
    <h1 class="text-2xl font-bold mb-4">Laporan Keuangan</h1>
    <div class="grid grid-cols-2 gap-4 mb-6"><div class="bg-white p-4 rounded border"><div class="text-xs text-gray-500">Total Pemasukan Lunas</div><div class="text-xl font-bold text-emerald-600">${rupiah(pemasukan)}</div></div></div>
  </div>`;
}

function renderBackup() {
  return `<div><h1 class="text-2xl font-bold mb-4">Backup Data (CSV)</h1><p class="text-sm text-gray-500">Data tersimpan aman di Supabase Cloud.</p></div>`;
}

// ================= INIT =================
window.addEventListener('DOMContentLoaded', () => { 
  if (typeof lucide !== 'undefined') lucide.createIcons(); 
  checkSession(); 
});
</script>
</body>
</html>
