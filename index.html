<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Joy Bimbel</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --theme-50: #fff7ed; --theme-100: #ffedd5; --theme-500: #f97316;
    --theme-600: #ea580c; --theme-700: #c2410c; --theme-800: #9a3412;
  }
  /* Override Tailwind classes dynamically based on theme */
  .bg-orange-50 { background-color: var(--theme-50) !important; }
  .bg-orange-100 { background-color: var(--theme-100) !important; }
  .bg-orange-500 { background-color: var(--theme-500) !important; }
  .bg-orange-600 { background-color: var(--theme-600) !important; }
  .hover\:bg-orange-700:hover { background-color: var(--theme-700) !important; }
  .text-orange-600 { color: var(--theme-600) !important; }
  .text-orange-700 { color: var(--theme-700) !important; }
  .text-orange-800 { color: var(--theme-800) !important; }
  .border-orange-600 { border-color: var(--theme-600) !important; }
  .focus\:ring-orange-500:focus { --tw-ring-color: var(--theme-500) !important; }
  .border-orange-500 { border-color: var(--theme-500) !important; }

  /* Animasi Loading */
  .spinner {
    border: 4px solid rgba(255, 255, 255, 0.3);
    border-top: 4px solid white;
    border-radius: 50%;
    width: 40px; height: 40px;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

  #print-area { display: none; }
  @media print {
    body * { visibility: hidden; }
    #print-area, #print-area * { visibility: visible; }
    #print-area { display: block !important; position: absolute; left: 0; top: 0; width: 100%; padding: 20px; background: white; color: black; }
    @page { margin: 1cm; }
  }
</style>
</head>
<body class="bg-slate-100">

<!-- 1. HALAMAN LOGIN -->
<div id="login-page" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-800 to-slate-900 p-4">
  <form id="login-form" class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md transition-all duration-300">
    <h1 class="text-3xl font-bold text-center mb-2"><span class="text-orange-600">Joy</span> Bimbel</h1>
    <p class="text-center text-gray-500 mb-6 text-sm">Silakan login untuk melanjutkan</p>
    <input name="email" type="email" required placeholder="Email" class="w-full border rounded-lg px-4 py-3 mb-3 focus:outline-none focus:ring-2 focus:ring-orange-500" />
    <input name="password" type="password" required placeholder="Password" class="w-full border rounded-lg px-4 py-3 mb-4 focus:outline-none focus:ring-2 focus:ring-orange-500" />
    
    <button type="submit" id="btn-login" class="w-full bg-orange-600 hover:bg-orange-700 text-white py-3 rounded-lg font-semibold flex justify-center items-center gap-2">
      <span id="btn-text">Masuk</span>
    </button>
    
    <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden">Email atau password salah!</p>
  </form>
</div>

<!-- 2. HALAMAN LOADING (Transisi) -->
<div id="loading-page" class="hidden fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center transition-opacity duration-500 opacity-0">
  <div class="spinner mb-4"></div>
  <h2 class="text-white text-xl font-bold animate-pulse">Menyiapkan Dashboard...</h2>
</div>

<!-- 3. HALAMAN UTAMA (APP) -->
<div id="app-page" class="hidden opacity-0 transition-opacity duration-500">
  <div class="md:hidden bg-white border-b px-4 py-3 flex items-center justify-between sticky top-0 z-30">
    <button onclick="toggleSidebar()"><i data-lucide="menu" class="w-6 h-6"></i></button>
    <span class="font-bold"><span class="text-orange-600">Joy</span> Bimbel</span>
    <span id="mobile-role" class="text-xs bg-orange-100 text-orange-700 px-2 py-1 rounded"></span>
  </div>

  <div class="flex min-h-screen">
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-40 w-64 bg-white border-r p-4 flex-col hidden md:flex transform -translate-x-full md:translate-x-0 transition-transform overflow-y-auto">
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-xl font-bold"><span class="text-orange-600">Joy</span> Bimbel</h1>
        <button class="md:hidden" onclick="toggleSidebar()"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="text-xs text-gray-500 mb-4 px-3 py-2 bg-gray-50 rounded-lg">Login: <b id="sidebar-role"></b></div>
      <nav id="nav" class="flex-1 space-y-1 overflow-y-auto"></nav>
      <button onclick="logout()" class="mt-4 flex items-center gap-3 px-3 py-2 rounded-lg text-red-600 hover:bg-red-50 w-full flex-shrink-0"><i data-lucide="log-out" class="w-4 h-4"></i> Logout</button>
    </aside>
    <main class="flex-1 p-4 md:p-8 overflow-x-auto"><div id="content"></div></main>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto">
    <div class="flex items-center justify-between p-5 border-b sticky top-0 bg-white z-10">
      <h2 id="modal-title" class="text-lg font-bold"></h2>
      <button onclick="closeModal()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div id="modal-body" class="p-5"></div>
  </div>
</div>

<div id="print-area"></div>

<script>
// ================= STORAGE =================
const K = { users:'jb_users', siswa:'jb_siswa', tentor:'jb_tentor', jadwal:'jb_jadwal', absensi:'jb_absensi', invoice:'jb_invoice', laporan:'jb_laporan', session:'jb_session', theme:'jb_theme', secLog:'jb_security' };
function load(key, fb) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } }
function save(key, v) { localStorage.setItem(key, JSON.stringify(v)); }

// ================= SEED & INIT =================
const seedUsers = [
  { id:'u1', email:'ricokristanto18@gmail.com', password:'admin123', role:'admin', nama:'Rico' },
  { id:'u2', email:'tentor@bimbel.com', password:'tentor123', role:'tentor', nama:'Bu Sari (Tentor)', tentor_id:'t1' }
];
const seedTentor = [{id:'t1', nama:'Bu Sari', email:'sari@bimbel.com', mapel:'Matematika', no_wa:'081211112222', tarif:50000, aktif:true}];
const seedSiswa = [{id:'s1', nama:'Ahmad Fauzi', kelas:'SD 5', nama_orang_tua:'Bpk. Hasan', no_wa:'081234567890', alamat:'Jl. Merdeka 1', aktif:true, tentor_id:'t1', tarif_bulanan:300000}];
const seedJadwal = [{id:'j1', siswa_id:'s1', tentor_id:'t1', mapel:'Matematika', hari:'Senin', jam_mulai:'15:00', jam_selesai:'16:30'}];

function initData(key, seed) { if (!localStorage.getItem(key)) save(key, seed); }
initData(K.users, seedUsers); 
initData(K.tentor, seedTentor); 
initData(K.siswa, seedSiswa); 
initData(K.jadwal, seedJadwal);

// ================= SKRIP PAKSA UPDATE ADMIN (DIPERBAIKI) =================
let currentUsers = load(K.users, []);

// 1. Cari apakah akun admin lama masih ada
let oldAdminIndex = currentUsers.findIndex(u => u.email === 'admin@bimbel.com');
if (oldAdminIndex !== -1) {
    // Ubah email dan nama, TAPI JANGAN UBAH PASSWORD
    currentUsers[oldAdminIndex].email = 'ricokristanto18@gmail.com';
    currentUsers[oldAdminIndex].nama = 'Rico';
}

// 2. Pastikan akun Rico ada
let ricoIndex = currentUsers.findIndex(u => u.email === 'ricokristanto18@gmail.com');
if (ricoIndex === -1) {
    // Jika benar-benar belum ada, baru buat baru dengan password default
    currentUsers.push({ id:'u1', email:'ricokristanto18@gmail.com', password:'admin123', role:'admin', nama:'Rico' });
} else {
    // Jika sudah ada, pastikan namanya Rico, tapi JANGAN SENTUH PASSWORD-NYA
    currentUsers[ricoIndex].nama = 'Rico';
    currentUsers[ricoIndex].role = 'admin';
}

save(K.users, currentUsers);

// 3. Logout paksa jika sesi saat ini masih menggunakan akun admin lama
let oldSession = load(K.session, null);
if (oldSession && oldSession.email === 'admin@bimbel.com') {
    localStorage.removeItem(K.session);
}
// =============================================================

const getUsers = () => load(K.users, []); const saveUsers = v => save(K.users, v);
const getSiswa = () => load(K.siswa, []); const saveSiswa = v => save(K.siswa, v);
const getTentor = () => load(K.tentor, []); const saveTentor = v => save(K.tentor, v);
const getJadwal = () => load(K.jadwal, []); const saveJadwal = v => save(K.jadwal, v);
const getAbsensi = () => load(K.absensi, []); const saveAbsensi = v => save(K.absensi, v);
const getInvoice = () => load(K.invoice, []); const saveInvoice = v => save(K.invoice, v);
const getLaporan = () => load(K.laporan, []); const saveLaporan = v => save(K.laporan, v);
const getSession = () => load(K.session, null);

// ================= HELPERS =================
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

function applyTheme(themeName) {
  const themes = {
    'orange': { 50:'#fff7ed', 100:'#ffedd5', 500:'#f97316', 600:'#ea580c', 700:'#c2410c', 800:'#9a3412' },
    'blue':   { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af' },
    'green':  { 50:'#f0fdf4', 100:'#dcfce7', 500:'#22c55e', 600:'#16a34a', 700:'#15803d', 800:'#166534' },
    'purple': { 50:'#faf5ff', 100:'#f3e8ff', 500:'#a855f7', 600:'#9333ea', 700:'#7e22ce', 800:'#6b21a8' },
    'rose':   { 50:'#fff1f2', 100:'#ffe4e6', 500:'#f43f5e', 600:'#e11d48', 700:'#be123c', 800:'#9f1239' }
  };
  const t = themes[themeName] || themes['orange'];
  const root = document.documentElement;
  root.style.setProperty('--theme-50', t[50]); root.style.setProperty('--theme-100', t[100]);
  root.style.setProperty('--theme-500', t[500]); root.style.setProperty('--theme-600', t[600]);
  root.style.setProperty('--theme-700', t[700]); root.style.setProperty('--theme-800', t[800]);
  
  const lp = document.getElementById('login-page');
  if (lp) {
    lp.style.backgroundImage = `linear-gradient(to bottom right, ${t[500]}, ${t[600]})`;
    Array.from(lp.classList).forEach(c => {
      if (c.startsWith('from-') || c.startsWith('to-') || c === 'bg-gradient-to-br') {
        lp.classList.remove(c);
      }
    });
  }
}

// ================= AUTH & LOGIN FLOW =================
document.getElementById('login-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  
  btn.disabled = true;
  btn.classList.add('opacity-75', 'cursor-not-allowed');
  btnText.innerHTML = `<div class="spinner" style="width:20px;height:20px;border-width:2px;margin-right:8px;"></div> Memverifikasi...`;
  
  const email = f.email.value.trim();
  const pass = f.password.value;
  
  setTimeout(() => {
    const user = getUsers().find(u => u.email === email && u.password === pass);
    
    if (user) {
      save(K.session, user);
      showLoadingAndBoot();
    } else {
      const logs = load(K.secLog, []);
      logs.push({ email, time: new Date().toISOString() });
      save(K.secLog, logs);
      
      document.getElementById('login-error').classList.remove('hidden');
      btn.disabled = false;
      btn.classList.remove('opacity-75', 'cursor-not-allowed');
      btnText.innerText = 'Masuk';
    }
  }, 600); 
});

function showLoadingAndBoot() {
  const loginPage = document.getElementById('login-page');
  const loadingPage = document.getElementById('loading-page');
  const appPage = document.getElementById('app-page');
  
  loginPage.classList.add('hidden');
  loadingPage.classList.remove('hidden');
  setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);
  
  setTimeout(() => {
    bootApp();
    loadingPage.classList.add('opacity-0');
    setTimeout(() => {
      loadingPage.classList.add('hidden');
      appPage.classList.remove('hidden');
      setTimeout(() => appPage.classList.remove('opacity-0'), 50);
      lucide.createIcons();
    }, 400);
  }, 1000);
}

function logout() { 
  if (!confirm('Logout?')) return; 
  localStorage.removeItem(K.session); 
  location.reload(); 
}

// ================= NAV & ROUTING =================
let currentPage = 'dashboard';
let absensiDate = todayISO();

function bootApp() {
  const session = getSession();
  if (!session) return;
  document.getElementById('sidebar-role').textContent = session.role.toUpperCase() + ' - ' + session.nama;
  document.getElementById('mobile-role').textContent = session.role;
  applyTheme(load(K.theme, 'orange'));
  renderNav(); renderPage();
}

function renderNav() {
  const s = getSession();
  const adminMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'},
    {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'absensi', label:'Absensi', icon:'clipboard-check'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
    {id:'invoice', label:'Invoice', icon:'file-text'},
    {id:'keuangan', label:'Laporan Keuangan', icon:'bar-chart-3'},
    {id:'akun', label:'Akun & Akses', icon:'shield'},
    {id:'tema', label:'Tema Tampilan', icon:'palette'},
    {id:'backup', label:'Backup Data (CSV)', icon:'database'},
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'},
    {id:'siswa', label:'Siswa', icon:'users'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'absensi', label:'Absensi', icon:'clipboard-check'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
  ];
  const menus = s.role === 'admin' ? adminMenus : tentorMenus;
  document.getElementById('nav').innerHTML = menus.map(m => `
    <button onclick="navigate('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg w-full text-left transition ${currentPage===m.id ? 'bg-orange-50 text-orange-700 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">
      <i data-lucide="${m.icon}" class="w-4 h-4 flex-shrink-0"></i> <span class="truncate">${m.label}</span>
    </button>`).join('');
  lucide.createIcons();
}
function navigate(page) { currentPage = page; renderNav(); renderPage(); if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('hidden','-translate-x-full'); }
function toggleSidebar() { const s = document.getElementById('sidebar'); s.classList.toggle('hidden'); s.classList.toggle('-translate-x-full'); }

// ================= MODAL =================
let modalSubmit = null;
function openModal(title, body, onSubmit) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  modalSubmit = onSubmit;
  document.getElementById('modal').classList.remove('hidden');
  lucide.createIcons();
}
function closeModal() { document.getElementById('modal').classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

// ================= RENDER PAGE =================
function renderPage() {
  const s = getSession();
  const content = document.getElementById('content');
  const pages = {
    dashboard: renderDashboard, siswa: () => renderSiswa(s.role), tentor: () => renderTentor(s.role),
    jadwal: () => renderJadwal(s.role), absensi: () => renderAbsensi(s.role), invoice: () => renderInvoice(),
    keuangan: () => renderLaporanKeuangan(), akun: () => renderAkun(), tema: () => renderTema(),
    backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor(s.role)
  };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  lucide.createIcons();
  if (currentPage === 'keuangan') setTimeout(mountChart, 50);
}

// ================= DASHBOARD =================
function renderDashboard() {
  const session = getSession();
  const siswa = getSiswa(), tentor = getTentor(), inv = getInvoice(), logs = load(K.secLog, []);
  
  let secAlert = '';
  if (session.role === 'admin' && logs.length > 0) {
    secAlert = `
      <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-lg flex justify-between items-start">
        <div>
          <h3 class="text-red-800 font-bold flex items-center gap-2"><i data-lucide="alert-triangle" class="w-5 h-5"></i> Peringatan Keamanan</h3>
          <p class="text-red-700 text-sm mt-1">Terdapat ${logs.length} percobaan login gagal. Pastikan ini bukan Anda!</p>
        </div>
        <button onclick="clearSecLog()" class="text-xs text-red-600 hover:text-red-800 border border-red-300 px-3 py-1 rounded">Hapus Notif</button>
      </div>`;
  }

  const pemasukan = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);

  const pemasukanCard = session.role === 'admin' ? `
    <div class="bg-white rounded-xl p-4 border">
      <div class="text-xs text-gray-500 mb-2">Pemasukan Lunas</div>
      <div class="text-xl font-bold text-emerald-600">${rupiah(pemasukan)}</div>
    </div>` : '';

  const gridClass = session.role === 'admin' ? 'md:grid-cols-4' : 'md:grid-cols-3';

  return `
    <div>
      ${secAlert}
      <h1 class="text-2xl font-bold mb-1">Dashboard ${session.role==='admin'?'Admin':'Tentor'}</h1>
      <p class="text-gray-500 mb-6 text-sm">Selamat datang, ${escapeHtml(session.nama)} 👋</p>
      <div class="grid grid-cols-2 ${gridClass} gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Siswa</div><div class="text-xl font-bold">${siswa.length}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Tentor</div><div class="text-xl font-bold">${tentor.length}</div></div>
        ${pemasukanCard}
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Laporan</div><div class="text-xl font-bold text-orange-600">${getLaporan().length}</div></div>
      </div>
    </div>`;
}
function clearSecLog() { save(K.secLog, []); renderPage(); }

// ================= AKUN & AKSES =================
function renderAkun() {
  const users = getUsers();
  return `
    <div>
      <div class="flex justify-between items-center mb-4">
        <div><h1 class="text-2xl font-bold">Akun & Akses</h1><p class="text-gray-500 text-sm">Kelola user yang bisa login</p></div>
        <button onclick="openUserForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm">+ Tambah Akun</button>
      </div>
      <div class="bg-white rounded-xl border overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-gray-50"><tr>
            <th class="text-left px-4 py-3">Nama</th><th class="text-left px-4 py-3">Email</th>
            <th class="text-left px-4 py-3">Role</th><th class="text-right px-4 py-3">Aksi</th>
          </tr></thead>
          <tbody>
            ${users.map(u => `
              <tr class="border-t hover:bg-gray-50">
                <td class="px-4 py-3 font-medium">${escapeHtml(u.nama)}</td>
                <td class="px-4 py-3 text-gray-600">${escapeHtml(u.email)}</td>
                <td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded ${u.role==='admin'?'bg-rose-100 text-rose-700':'bg-emerald-100 text-emerald-700'}">${u.role}</span></td>
                <td class="px-4 py-3 text-right">
                  <button onclick="resetPass('${u.id}')" class="text-blue-600 hover:bg-blue-50 px-2 py-1 rounded text-xs border border-blue-200 mr-1">Reset Pass</button>
                  ${u.email !== 'ricokristanto18@gmail.com' ? `<button onclick="delUser('${u.id}')" class="text-red-600 hover:bg-red-50 p-1.5 rounded"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                </td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
function openUserForm() {
  const body = `
    <form><div class="space-y-3">
      <div><label class="text-sm">Nama Lengkap *</label><input name="nama" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Email *</label><input name="email" type="email" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Password *</label><input name="password" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Role *</label>
        <select name="role" class="w-full border rounded-lg px-3 py-2 mt-1">
          <option value="tentor">Tentor</option><option value="admin">Admin</option>
        </select></div>
      <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg mt-4">Simpan</button>
    </div></form>`;
  openModal('Tambah Akun Baru', body, (e) => {
    const f = e.target;
    const users = getUsers();
    users.push({ id:'u'+Date.now(), nama:f.nama.value, email:f.email.value, password:f.password.value, role:f.role.value });
    saveUsers(users); closeModal(); renderPage();
  });
}
function resetPass(id) {
  const newPass = prompt('Masukkan password baru untuk akun ini:');
  if (!newPass) return;
  const users = getUsers();
  const i = users.findIndex(u => u.id === id);

function downloadCSV(type) {
  let headers = [], rows = [], filename = '';
  if (type === 'siswa') {
    headers = ['ID','Nama','Kelas','Orang Tua','No WA','Alamat','Aktif','Tarif Bulanan'];
    rows = getSiswa().map(s => [s.id, s.nama, s.kelas, s.nama_orang_tua, s.no_wa, s.alamat, s.aktif?'Ya':'Tidak', s.tarif_bulanan]);
    filename = 'Data_Siswa.csv';
  } else if (type === 'tentor') {
    headers = ['ID','Nama','Email','Mapel','No WA','Tarif/Sesi','Aktif'];
    rows = getTentor().map(t => [t.id, t.nama, t.email, t.mapel, t.no_wa, t.tarif, t.aktif?'Ya':'Tidak']);
    filename = 'Data_Tentor.csv';
  } else if (type === 'absensi') {
    headers = ['Tanggal','Nama Siswa','Kelas','Status','Diisi Oleh'];
    const siswas = getSiswa();
    rows = getAbsensi().map(a => {
      const s = siswas.find(x=>x.id===a.siswa_id) || {};
      return [a.tanggal, s.nama||'-', s.kelas||'-', a.status, a.oleh||'-'];
    });
    filename = 'Data_Absensi.csv';
  } else if (type === 'laporan') {
    headers = ['Tanggal','Nama Tentor','Nama Siswa','Mapel','Catatan Perkembangan','Link Foto'];
    const siswas = getSiswa(), tentors = getTentor();
    rows = getLaporan().map(l => {
      const t = tentors.find(x=>x.id===l.tentor_id) || {};
      const s = siswas.find(x=>x.id===l.siswa_id) || {};
      return [l.tanggal, t.nama||'-', s.nama||'-', l.mapel||'-', l.catatan, 'Ada Foto (Base64)'];
    });
    filename = 'Laporan_Mengajar.csv';
  }
  
  const csvContent = [headers, ...rows].map(e => e.map(c => `"${String(c||'').replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

function openLaporanForm() {
  const session = getSession();
  const tentor = getTentor().find(t => t.email === session.email) || getTentor()[0];
  const siswas = getSiswa();
  const body = `
    <form id="form-laporan">
      <div class="space-y-3">
        <div><label class="text-sm font-medium">Pilih Siswa *</label>
          <select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">

        <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg mt-4 font-semibold">Kirim Laporan</button>
      </div>
    </form>`;
  
  openModal('Buat Laporan Mengajar', body, (e) => {
    const f = e.target;
    const fileInput = document.getElementById('foto-input');
    
    const file = fileInput.files[0];
    if (!file) { alert('Pilih foto terlebih dahulu!'); return; }

    const reader = new FileReader();
    reader.onload = function(evt) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 600;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const base64 = canvas.toDataURL('image/jpeg', 0.7); 
        
        const newLaporan = {
          id: 'l'+Date.now(),
          tentor_id: tentor.id,
          siswa_id: f.siswa_id.value,
          tanggal: f.tanggal.value,
          mapel: f.mapel.value,
          catatan: f.catatan.value,
          foto: base64
        };
        const list = getLaporan();
        list.push(newLaporan);
        saveLaporan(list);
        closeModal(); renderPage();
      };
      img.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  });
}

          <thead class="bg-gray-50"><tr><th class="text-left px-4 py-3">Nama</th><th class="text-center px-4 py-3">Status</th></tr></thead>
          <tbody>
            ${siswas.map(s=>{
              const cur = existing.find(a=>a.siswa_id===s.id)?.status;
              return `<tr class="border-t">
                <td class="px-4 py-3 font-medium">${escapeHtml(s.nama)}</td>
                <td class="px-4 py-3 flex justify-center gap-1">
                  ${['hadir','izin','sakit','alpa'].map(st=>`
                    <button onclick="setAbsensi('${s.id}','${st}')" class="px-3 py-1 rounded text-xs border ${cur===st?'bg-orange-500 text-white border-orange-500':'bg-white hover:bg-gray-50'} capitalize">${st}</button>
                  `).join('')}
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>`;
}
function setAbsensi(siswa_id, status) {
  const all = getAbsensi();
  const i = all.findIndex(a => a.siswa_id===siswa_id && a.tanggal===absensiDate);
  if (i >= 0) all[i].status = status;
  else all.push({ id:'a'+Date.now(), siswa_id, tanggal:absensiDate, status, oleh:getSession().email });
  saveAbsensi(all); renderPage();
}

// ================= INVOICE (FULL FITUR) =================
function renderInvoice() {
  const inv = getInvoice();
  const siswas = getSiswa(), tentors = getTentor();
  const list = inv.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||''));
  return `
    <div>
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4">
        <div><h1 class="text-2xl font-bold">Invoice</h1><p class="text-gray-500 text-sm">${inv.length} invoice total</p></div>
        <button onclick="openInvoiceForm()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-semibold flex items-center gap-2 self-start">+ Buat Invoice</button>
      </div>
      <div class="bg-white rounded-xl border overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead class="bg-gray-50 text-gray-600"><tr>
              <th class="text-left px-4 py-3">No Invoice</th>
              <th class="text-left px-4 py-3">Jenis</th>
              <th class="text-left px-4 py-3">Penerima</th>
              <th class="text-left px-4 py-3">Periode</th>
              <th class="text-left px-4 py-3">Total</th>
              <th class="text-left px-4 py-3">Status</th>
              <th class="text-right px-4 py-3">Aksi</th>
            </tr></thead>
            <tbody>
              ${list.length===0?'<tr><td colspan="7" class="text-center text-gray-400 py-8">Belum ada invoice. Klik "Buat Invoice".</td></tr>':
              list.map(i=>{
                const target = i.jenis==='siswa' ? siswas.find(x=>x.id===i.untuk_id) : tentors.find(x=>x.id===i.untuk_id);
                return `<tr class="border-t hover:bg-gray-50">
                  <td class="px-4 py-3 font-mono text-xs">${escapeHtml(i.no_invoice)}</td>
                  <td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded ${i.jenis==='siswa'?'bg-orange-100 text-orange-700':'bg-amber-100 text-amber-700'}">${i.jenis==='siswa'?'Siswa':'Tentor'}</span></td>
                  <td class="px-4 py-3">${escapeHtml(target?.nama||'-')}</td>
                  <td class="px-4 py-3">${escapeHtml(i.periode||'-')}</td>
                  <td class="px-4 py-3 font-semibold">${rupiah(i.total)}</td>
                  <td class="px-4 py-3"><span class="text-xs px-2 py-1 rounded ${i.status==='lunas'?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'}">${i.status==='lunas'?'Lunas':'Belum Bayar'}</span></td>
                  <td class="px-4 py-3 text-right whitespace-nowrap">
                    <button onclick="openInvoiceDetail('${i.id}')" class="text-orange-600 hover:bg-orange-50 p-1.5 rounded" title="Lihat"><i data-lucide="eye" class="w-4 h-4"></i></button>
                    <button onclick="openInvoiceForm('${i.id}')" class="text-gray-600 hover:bg-gray-100 p-1.5 rounded" title="Edit"><i data-lucide="pencil" class="w-4 h-4"></i></button>
                    <button onclick="deleteInvoice('${i.id}')" class="text-red-600 hover:bg-red-50 p-1.5 rounded" title="Hapus"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                  </td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
      </div>
    </div>`;
}

function generateNoInvoice() {
  const inv = getInvoice();
  const year = new Date().getFullYear();
  const count = inv.filter(i => (i.no_invoice||'').includes('-'+year+'-')).length + 1;
  return `INV-${year}-${String(count).padStart(4,'0')}`;
}

function openInvoiceForm(id) {
  const editing = id ? getInvoice().find(x=>x.id===id) : null;
  const body = `
    <form>
      <div class="space-y-3">
        <div><label class="text-sm font-medium">Jenis Invoice *</label>
          <select name="jenis" onchange="refreshRecipients(this.value)" class="w-full border rounded-lg px-3 py-2 mt-1">
            <option value="siswa" ${editing?.jenis==='siswa'||!editing?'selected':''}>👨‍👩‍👧 Untuk Orang Tua Siswa (Pemasukan)</option>
            <option value="tentor" ${editing?.jenis==='tentor'?'selected':''}>👨‍🏫 Untuk Tentor (Gaji)</option>
          </select></div>
        <div><label class="text-sm font-medium">Penerima *</label>
          <select name="untuk_id" id="recipient-select" required class="w-full border rounded-lg px-3 py-2 mt-1"></select></div>
        <div><label class="text-sm font-medium">Periode</label>
          <input name="periode" value="${escapeHtml(editing?.periode||periodeNow())}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
        <div>
          <label class="text-sm font-medium">Item</label>
          <div id="items-container" class="space-y-2 mt-1"></div>
          <button type="button" onclick="addItemRow()" class="mt-2 text-sm text-orange-600 hover:underline">+ Tambah Baris</button>
        </div>
        <div><label class="text-sm font-medium">Status</label>
          <select name="status" class="w-full border rounded-lg px-3 py-2 mt-1">
            <option value="belum_bayar" ${editing?.status==='belum_bayar'||!editing?'selected':''}>Belum Bayar</option>
            <option value="lunas" ${editing?.status==='lunas'?'selected':''}>Lunas</option>
          </select></div>
        <div class="flex justify-between items-center pt-3 border-t">
          <span class="text-sm text-gray-500">Total</span>
          <span id="invoice-total" class="text-xl font-bold text-orange-600">Rp0</span>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="flex-1 border rounded-lg py-2 hover:bg-gray-50">Batal</button>
          <button type="submit" class="flex-1 bg-rose-600 text-white rounded-lg py-2 font-semibold hover:bg-rose-700">Simpan</button>
        </div>
      </div>
    </form>`;
  openModal(editing ? 'Edit Invoice' : 'Buat Invoice Baru', body, (e) => {
    const f = e.target;
    const items = [];
    document.querySelectorAll('#items-container .item-row').forEach(row => {
      const deskripsi = row.querySelector('.item-desk').value.trim();
      const qty = Number(row.querySelector('.item-qty').value) || 0;
      const harga = Number(row.querySelector('.item-harga').value) || 0;
      if (deskripsi && qty > 0) items.push({ deskripsi, qty, harga });
    });
    if (items.length === 0) { alert('Minimal 1 item harus diisi'); return; }
    const total = items.reduce((a,it)=>a+it.qty*it.harga, 0);
    const list = getInvoice();
    const data = {
      jenis: f.jenis.value, untuk_id: f.untuk_id.value, periode: f.periode.value.trim(),
      items, total, status: f.status.value,
    };
    if (editing) {
      const i = list.findIndex(x=>x.id===editing.id);
      list[i] = { ...list[i], ...data };
    } else {
      list.push({ id:'inv'+Date.now(), no_invoice:generateNoInvoice(), ...data, tanggal: todayISO(), created_at:new Date().toISOString() });
    }
    saveInvoice(list); closeModal(); renderPage();
  });

  refreshRecipients(editing?.jenis||'siswa', editing?.untuk_id);
  const items = editing ? editing.items : [{deskripsi:'', qty:1, harga:0}];
  items.forEach(it => addItemRow(it));
  updateInvoiceTotal();
}

function refreshRecipients(jenis, selectedId) {
  const sel = document.getElementById('recipient-select');
  if (!sel) return;
  const data = jenis === 'siswa' ? getSiswa() : getTentor();
  sel.innerHTML = '<option value="">— Pilih —</option>' + data.map(d => `
    <option value="${d.id}" ${d.id===selectedId?'selected':''}>
      ${escapeHtml(jenis==='siswa' ? `${d.nama} (${d.nama_orang_tua||'-'})` : `${d.nama} - ${d.mapel||'-'}`)}
    </option>`).join('');
}

function addItemRow(item) {
  const container = document.getElementById('items-container');
  if (!container) return;
  const it = item || { deskripsi:'', qty:1, harga:0 };
  const div = document.createElement('div');
  div.className = 'item-row flex gap-2 items-start';
  div.innerHTML = `
    <input class="item-desk flex-1 border rounded-lg px-2 py-1.5 text-sm" placeholder="Deskripsi" value="${escapeHtml(it.deskripsi)}" />
    <input class="item-qty w-16 border rounded-lg px-2 py-1.5 text-sm" type="number" min="1" placeholder="Qty" value="${it.qty}" oninput="updateInvoiceTotal()" />
    <input class="item-harga w-28 border rounded-lg px-2 py-1.5 text-sm" type="number" min="0" placeholder="Harga" value="${it.harga}" oninput="updateInvoiceTotal()" />
    <button type="button" onclick="this.parentElement.remove(); updateInvoiceTotal();" class="text-red-500 hover:bg-red-50 p-1.5 rounded">✕</button>
  `;
  container.appendChild(div);
  updateInvoiceTotal();
}

function updateInvoiceTotal() {
  let total = 0;
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    const q = Number(row.querySelector('.item-qty').value)||0;
    const h = Number(row.querySelector('.item-harga').value)||0;
    total += q*h;
  });
  const el = document.getElementById('invoice-total');
  if (el) el.textContent = rupiah(total);
}

function deleteInvoice(id) { if (!confirm('Hapus invoice ini?')) return; saveInvoice(getInvoice().filter(x=>x.id!==id)); renderPage(); }

function openInvoiceDetail(id) {
  const inv = getInvoice().find(x=>x.id===id);
  if (!inv) return;
  const target = inv.jenis==='siswa' ? getSiswa().find(x=>x.id===inv.untuk_id) : getTentor().find(x=>x.id===inv.untuk_id);
  const body = buildInvoiceHtml(inv, target) + `
    <div class="flex flex-wrap gap-2 mt-4 pt-4 border-t print:hidden">
      <button onclick="printInvoice('${id}')" class="flex-1 bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700">🖨️ Cetak / Simpan PDF</button>
      <a href="${buildWaUrl(inv, target)}" target="_blank" class="flex-1 bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-center">📱 Kirim WhatsApp</a>
      <button onclick="closeModal()" class="border px-4 py-2 rounded-lg hover:bg-gray-50">Tutup</button>
    </div>
  `;
  openModal('Detail Invoice', body);
}

function buildInvoiceHtml(inv, target) {
  const namaPenerima = inv.jenis==='siswa'
    ? `${target?.nama_orang_tua || '-'}<br/><span class="text-sm text-gray-600">Siswa: ${target?.nama || '-'}</span>`
    : `${target?.nama || '-'}<br/><span class="text-sm text-gray-600">${target?.mapel || '-'}</span>`;
  return `
    <div class="bg-white">
      <div class="flex justify-between items-start border-b pb-4 mb-4">
        <div>
          <h2 class="text-2xl font-bold text-orange-600">JOY BIMBEL</h2>
          <p class="text-xs text-gray-600">Jl. Pendidikan No. 1, Jakarta</p>
          <p class="text-xs text-gray-600">Telp: 0812-3456-7890</p>
        </div>
        <div class="text-right">
          <p class="font-bold text-xl">INVOICE</p>
          <p class="font-mono text-xs">${escapeHtml(inv.no_invoice)}</p>
          <p class="text-xs text-gray-600">${escapeHtml(inv.tanggal)}</p>
        </div>
      </div>
      <div class="mb-4 text-sm">
        <p class="text-xs text-gray-500 uppercase">Ditagihkan kepada:</p>
        <p class="font-semibold">${namaPenerima}</p>
        <p class="text-xs text-gray-600">Periode: ${escapeHtml(inv.periode)}</p>
      </div>
      <table class="w-full text-sm border-collapse">
        <thead><tr class="border-b bg-gray-50">
          <th class="text-left py-2 px-2">Deskripsi</th>
          <th class="text-center py-2 px-2">Qty</th>
          <th class="text-right py-2 px-2">Harga</th>
          <th class="text-right py-2 px-2">Subtotal</th>
        </tr></thead>
        <tbody>
          ${inv.items.map(it=>`
            <tr class="border-b">
              <td class="py-2 px-2">${escapeHtml(it.deskripsi)}</td>
              <td class="text-center py-2 px-2">${it.qty}</td>
              <td class="text-right py-2 px-2">${rupiah(it.harga)}</td>
              <td class="text-right py-2 px-2">${rupiah(it.qty*it.harga)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div class="flex justify-end mt-4">
        <div class="text-right">
          <p class="text-xs text-gray-500">Total</p>
          <p class="text-2xl font-bold text-orange-600">${rupiah(inv.total)}</p>
          <p class="text-xs mt-1 ${inv.status==='lunas'?'text-emerald-600':'text-rose-600'} font-semibold">
            ${inv.status==='lunas'?'✅ LUNAS':'⏳ BELUM BAYAR'}
          </p>
        </div>
      </div>
      <div class="mt-6 pt-4 border-t text-xs text-gray-500">
        <p><b>Pembayaran:</b> BCA 1234567890 a.n. Joy Bimbel</p>
        <p class="mt-1">Terima kasih atas kepercayaan Anda 🙏</p>
      </div>
    </div>`;
}

function buildWaUrl(inv, target) {
  const nomor = inv.jenis==='siswa' ? (target?.no_wa || '') : (target?.no_wa || '');
  const wa = formatWa(nomor);
  const total = rupiah(inv.total);
  const nama = inv.jenis==='siswa' ? (target?.nama_orang_tua||target?.nama||'') : (target?.nama||'');
  const msg = `Halo Bpk/Ibu ${nama},\n\nBerikut invoice *${inv.no_invoice}* periode *${inv.periode}* dengan total *${total}*.\n\nStatus: ${inv.status==='lunas'?'LUNAS':'BELUM BAYAR'}\n\nTerima kasih 🙏\nJoy Bimbel`;
  return `https://wa.me/${wa}?text=${encodeURIComponent(msg)}`;
}

function printInvoice(id) {
  const inv = getInvoice().find(x=>x.id===id);
  if (!inv) return;
  const target = inv.jenis==='siswa' ? getSiswa().find(x=>x.id===inv.untuk_id) : getTentor().find(x=>x.id===inv.untuk_id);
  document.getElementById('print-area').innerHTML = buildInvoiceHtml(inv, target);
  setTimeout(() => window.print(), 100);
}

// ================= LAPORAN KEUANGAN (REAL DATA) =================
function renderLaporanKeuangan() {
  const inv = getInvoice();
  const now = new Date();
  const bulanKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const invBulan = inv.filter(i => (i.tanggal||'').startsWith(bulanKey));
  const pemasukanBulan = invBulan.filter(i=>i.jenis==='siswa').reduce((a,b)=>a+b.total,0);
  const pengeluaranBulan = invBulan.filter(i=>i.jenis==='tentor').reduce((a,b)=>a+b.total,0);
  const lunas = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);
  const belum = inv.filter(i=>i.jenis==='siswa' && i.status==='belum_bayar').reduce((a,b)=>a+b.total,0);

  return `
    <div>
      <h1 class="text-2xl font-bold mb-1">Laporan Keuangan</h1>
      <p class="text-gray-500 mb-6 text-sm">Ringkasan pemasukan & pengeluaran bimbel</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-1">Pemasukan Bulan Ini</div><div class="text-lg font-bold text-emerald-600">${rupiah(pemasukanBulan)}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-1">Gaji Tentor Bulan Ini</div><div class="text-lg font-bold text-rose-600">${rupiah(pengeluaranBulan)}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-1">Piutang (Belum Bayar)</div><div class="text-lg font-bold text-amber-600">${rupiah(belum)}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-1">Total Pemasukan Lunas</div><div class="text-lg font-bold text-orange-600">${rupiah(lunas)}</div></div>
      </div>
      <div class="bg-white rounded-xl p-6 border">
        <h2 class="font-semibold mb-4">Grafik 6 Bulan Terakhir</h2>
        <div style="height: 300px;"><canvas id="chart-laporan"></canvas></div>
      </div>
    </div>`;
}

let chartInstance = null;
function mountChart() {
  const canvas = document.getElementById('chart-laporan');
  if (!canvas) return;
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  const inv = getInvoice();
  const labels = [], income = [], expense = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    labels.push(NAMA_BULAN[d.getMonth()].slice(0,3) + ' ' + String(d.getFullYear()).slice(2));
    income.push(inv.filter(x=>x.jenis==='siswa'  && (x.tanggal||'').startsWith(key)).reduce((a,b)=>a+b.total,0));
    expense.push(inv.filter(x=>x.jenis==='tentor' && (x.tanggal||'').startsWith(key)).reduce((a,b)=>a+b.total,0));
  }
  chartInstance = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Pemasukan',   data: income,  backgroundColor: '#f97316', borderRadius: 6 },
        { label: 'Pengeluaran', data: expense, backgroundColor: '#f43f5e', borderRadius: 6 },
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { position: 'bottom' } },
      scales: { y: { beginAtZero: true, ticks: { callback: v => 'Rp' + v.toLocaleString('id-ID') } } }
    }
  });
}

window.addEventListener('DOMContentLoaded', () => {
  lucide.createIcons();
  if (getSession()) {
    document.getElementById('login-page').classList.add('hidden');
    bootApp();
    document.getElementById('app-page').classList.remove('hidden', 'opacity-0');
    lucide.createIcons();
  } else {
    applyTheme(load(K.theme, 'orange'));
  }
});
</script>
