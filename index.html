<script>
// ================= ERROR HANDLER =================
window.onerror = function(msg, url, line, col, error) {
  const errDiv = document.getElementById('global-error');
  if (errDiv) {
    errDiv.innerHTML = "⚠️ Error Sistem: " + msg + " (Baris " + line + ")";
    errDiv.classList.remove('hidden');
    setTimeout(() => errDiv.classList.add('hidden'), 5000);
  }
  return false;
};

// ================= GLOBAL DATA =================
let DB = { profile: null, siswa: [], tentor: [], jadwal: [], invoice: [], laporan: [], users: [], settings: {} };
let currentPage = 'dashboard';
let realtimeChannel = null;
let refreshTimeout = null;
let LOGO_URL = '';

let searchSiswa = '';
let searchTentor = '';
let searchInvoice = '';
let filterInvoiceStatus = 'all';
let filterInvoiceJenis = 'all';
let searchLaporan = '';
let filterLaporanTentor = 'all';
let expandedJadwal = {};

// ================= HELPERS =================
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const NAMA_BULAN_SINGKAT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const NAMA_HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const NAMA_HARI_SINGKAT = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

function formatJam(t) { if (!t) return '-'; return String(t).substring(0, 5); }
function formatTanggal(tgl) {
  if (!tgl) return null;
  const d = new Date(tgl + 'T00:00:00');
  if (isNaN(d)) return tgl;
  return `${NAMA_HARI_SINGKAT[d.getDay()]}, ${d.getDate()} ${NAMA_BULAN_SINGKAT[d.getMonth()]} ${d.getFullYear()}`;
}

// ================= TOAST & CONFIRM =================
function showToast(message, type = 'success') {
  const colors = { success: 'bg-emerald-500', error: 'bg-red-500', info: 'bg-blue-500', warning: 'bg-amber-500' };
  const icons = { success: 'check-circle', error: 'x-circle', info: 'info', warning: 'alert-triangle' };
  const toast = document.createElement('div');
  toast.className = `fixed top-4 right-4 z-[99999] px-4 py-3 rounded-xl shadow-2xl text-white font-medium flex items-center gap-2 max-w-xs animate-slide-in ${colors[type] || colors.success}`;
  toast.innerHTML = `<i data-lucide="${icons[type] || 'check'}" class="w-5 h-5 flex-shrink-0"></i><span class="text-sm">${escapeHtml(message)}</span>`;
  document.body.appendChild(toast);
  if (typeof lucide !== 'undefined') lucide.createIcons();
  setTimeout(() => {
    toast.style.transition = 'all 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(120%)';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

function showConfirm(title, message, onConfirm, confirmLabel = 'Ya, Lanjutkan', danger = true) {
  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 bg-black/50 z-[99998] flex items-center justify-center p-4 animate-fade-in';
  overlay.innerHTML = `
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden animate-scale-in">
      <div class="p-6 text-center">
        <div class="w-14 h-14 mx-auto rounded-full ${danger ? 'bg-red-100 text-red-600' : 'bg-orange-100 text-orange-600'} flex items-center justify-center mb-4">
          <i data-lucide="${danger ? 'alert-triangle' : 'help-circle'}" class="w-7 h-7"></i>
        </div>
        <h3 class="text-lg font-bold mb-2">${escapeHtml(title)}</h3>
        <p class="text-sm text-gray-600">${escapeHtml(message)}</p>
      </div>
      <div class="flex gap-2 p-4 bg-gray-50">
        <button class="cancel-btn flex-1 bg-white border rounded-lg py-2.5 font-semibold text-gray-700 hover:bg-gray-100">Batal</button>
        <button class="confirm-btn flex-1 ${danger ? 'bg-red-600 hover:bg-red-700' : 'bg-orange-600 hover:bg-orange-700'} text-white rounded-lg py-2.5 font-semibold">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  if (typeof lucide !== 'undefined') lucide.createIcons();
  overlay.querySelector('.cancel-btn').onclick = () => overlay.remove();
  overlay.querySelector('.confirm-btn').onclick = () => { overlay.remove(); onConfirm(); };
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };
}

// ================= LOGO MANAGEMENT =================
async function loadLogo() {
  try {
    const { data } = await supabaseClient.from('settings').select('value').eq('key', 'logo_url').single();
    if (data && data.value) { LOGO_URL = data.value; applyLogo(); }
  } catch (e) { console.log("Logo belum diatur."); }
}
function applyLogo() {
  if (!LOGO_URL) return;
  ['login-logo','sidebar-logo','mobile-logo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.src = LOGO_URL; el.classList.remove('hidden'); }
  });
  const favicon = document.getElementById('favicon');
  if (favicon) favicon.href = LOGO_URL;
}

// ================= AUTH =================
async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { await loadAllData(session.user); }
    else {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-page').classList.add('hidden');
      document.getElementById('loading-page').classList.add('hidden');
    }
  } catch (e) {
    console.error(e);
    document.getElementById('login-page').classList.remove('hidden');
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true; btnText.innerHTML = `Memverifikasi...`;
  const email = f.email.value.trim();
  const password = f.password.value;
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadAllData(data.user);
  } catch (err) {
    showToast("Login gagal: " + err.message, 'error');
    document.getElementById('login-error').classList.remove('hidden');
    btn.disabled = false; btnText.innerText = 'Masuk';
  }
});

async function loadAllData(user) {
  try {
    document.getElementById('login-page').classList.add('hidden');
    const loadingPage = document.getElementById('loading-page');
    loadingPage.classList.remove('hidden'); setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);

    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
    if (profErr || !profile) throw new Error("Profil Anda belum terdaftar.");
    DB.profile = profile;

    const [resSiswa, resTentor, resJadwal, resInvoice, resLaporan, resUsers, resSettings] = await Promise.all([
      supabaseClient.from('siswa').select('*').order('nama'),
      supabaseClient.from('tentor').select('*').order('nama'),
      supabaseClient.from('jadwal').select('*'),
      supabaseClient.from('invoice').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('laporan').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('profiles').select('*').order('nama'),
      supabaseClient.from('settings').select('*')
    ]);

    DB.siswa = resSiswa.data || []; DB.tentor = resTentor.data || []; DB.jadwal = resJadwal.data || [];
    DB.invoice = resInvoice.data || []; DB.laporan = resLaporan.data || [];
    DB.users = resUsers.data || [];
    if (resSettings.data) { resSettings.data.forEach(s => DB.settings[s.key] = s.value); if (DB.settings.logo_url) LOGO_URL = DB.settings.logo_url; }

    bootApp();
    
    if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public' }, () => {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => loadAllData(user), 1000);
      }).subscribe();
  } catch (err) {
    showToast("Error: " + err.message, 'error');
    await supabaseClient.auth.signOut();
    location.reload();
  }
}

function logout() { 
  showConfirm('Logout?', 'Anda akan keluar dari sistem Joy Bimbel.', async () => {
    try {
      if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
      await supabaseClient.removeAllChannels();
      await supabaseClient.auth.signOut();
      location.reload();
    } catch(e) { location.reload(); }
  }, 'Ya, Logout', false);
}

// ================= ROUTING =================
function bootApp() {
  const loadingPage = document.getElementById('loading-page');
  if (loadingPage) loadingPage.classList.add('opacity-0');
  setTimeout(() => {
    if (loadingPage) loadingPage.classList.add('hidden');
    const appPage = document.getElementById('app-page');
    if (appPage) { appPage.classList.remove('hidden'); setTimeout(() => appPage.classList.remove('opacity-0'), 50); }
    applyLogo();
    const sidebarRole = document.getElementById('sidebar-role');
    if (sidebarRole && DB.profile) sidebarRole.textContent = DB.profile.role.toUpperCase() + ' - ' + DB.profile.nama;
    const mobileRole = document.getElementById('mobile-role');
    if (mobileRole && DB.profile) mobileRole.textContent = DB.profile.role;
    renderNav(); renderPage();
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }, 400);
}

function renderNav() {
  const s = DB.profile;
  const adminMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'}, {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
    {id:'invoice', label:'Invoice & Slip Gaji', icon:'file-text'}, {id:'keuangan', label:'Laporan Keuangan', icon:'bar-chart-3'},
    {id:'akun', label:'Akun & Akses', icon:'shield'},
    {id:'pengaturan', label:'Pengaturan Website', icon:'settings'},
    {id:'backup', label:'Backup Data', icon:'database'}
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'}
  ];
  const menus = s && s.role === 'admin' ? adminMenus : tentorMenus;
  const nav = document.getElementById('nav');
  if (nav) {
    nav.innerHTML = menus.map(m => `
      <button onclick="navigate('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg w-full text-left transition ${currentPage===m.id ? 'bg-orange-50 text-orange-700 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">
        <i data-lucide="${m.icon}" class="w-4 h-4 flex-shrink-0"></i> <span class="truncate">${m.label}</span>
      </button>`).join('');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function navigate(page) { 
  currentPage = page; 
  searchSiswa = ''; searchTentor = ''; searchInvoice = ''; searchLaporan = '';
  filterInvoiceStatus = 'all'; filterInvoiceJenis = 'all'; filterLaporanTentor = 'all';
  expandedJadwal = {};
  renderNav(); renderPage(); 
  if (window.innerWidth < 768) { const sb = document.getElementById('sidebar'); if (sb) sb.classList.add('hidden','-translate-x-full'); }
}
function toggleSidebar() { const s = document.getElementById('sidebar'); if (s) { s.classList.toggle('hidden'); s.classList.toggle('-translate-x-full'); } }

// ================= MODAL =================
let modalSubmit = null;
function openModal(title, body, onSubmit) {
  const mTitle = document.getElementById('modal-title'); if (mTitle) mTitle.textContent = title; 
  const mBody = document.getElementById('modal-body'); if (mBody) mBody.innerHTML = body;
  modalSubmit = onSubmit; 
  const m = document.getElementById('modal'); if (m) m.classList.remove('hidden'); 
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

// ================= RENDER PAGE =================
function renderPage() {
  const content = document.getElementById('content');
  if (!content) return;
  const pages = { dashboard: renderDashboard, siswa: () => renderSiswa(), tentor: () => renderTentor(), jadwal: () => renderJadwal(), invoice: () => renderInvoice(), keuangan: () => renderLaporanKeuangan(), akun: () => renderAkun(), pengaturan: () => renderPengaturan(), backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor() };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// ================= DASHBOARD =================

async function uploadLogo() {
  const input = document.getElementById('logo-input');
  const btn = document.getElementById('btn-upload-logo');
  const file = input.files[0];
  if (!file) { showToast('Pilih file gambar terlebih dahulu!', 'warning'); return; }
  if (file.size > 2 * 1024 * 1024) { showToast('Ukuran file maksimal 2MB.', 'warning'); return; }
  btn.disabled = true; btn.textContent = 'Mengupload...';
  try {
    const fileName = `logo_${Date.now()}.${file.name.split('.').pop()}`;
    const { error: uploadErr } = await supabaseClient.storage.from('logo').upload(fileName, file);
    if (uploadErr) throw uploadErr;
    const { data: { publicUrl } } = supabaseClient.storage.from('logo').getPublicUrl(fileName);
    const { error: dbErr } = await supabaseClient.from('settings').upsert({ key: 'logo_url', value: publicUrl });
    if (dbErr) throw dbErr;
    LOGO_URL = publicUrl; applyLogo();
    showToast('Logo berhasil diperbarui!', 'success');
    renderPage();
  } catch (err) {
    showToast('Gagal upload logo: ' + err.message, 'error');
    btn.disabled = false; btn.textContent = 'Upload Logo';
  }
}

function backupCard(table, label, icon, color, count) {
  return `<div class="bg-white rounded-xl border p-4 hover:shadow-md transition">
    <div class="flex items-center gap-3 mb-3">
      <div class="bg-${color}-100 text-${color}-600 p-2 rounded-lg"><i data-lucide="${icon}" class="w-5 h-5"></i></div>
      <div class="flex-1 min-w-0"><div class="font-semibold text-sm truncate">${label}</div><div class="text-xs text-gray-500">${count} data</div></div>
    </div>
    <button onclick="downloadCSV('${table}')" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-800 text-sm py-2 rounded-lg font-semibold transition flex items-center justify-center gap-2"><i data-lucide="download" class="w-4 h-4"></i> Download CSV</button>
  </div>`;
}

function downloadCSV(table) {
  const data = DB[table] || [];
  if (data.length === 0) { showToast(`Tidak ada data ${table} untuk diunduh.`, 'warning'); return; }
  const allKeys = [...new Set(data.flatMap(obj => Object.keys(obj)))];
  const csvRows = [allKeys.map(h => `"${h}"`).join(',')];
  data.forEach(row => {
    csvRows.push(allKeys.map(h => {
      let val = row[h];
      if (val === null || val === undefined) val = '';
      if (typeof val === 'object') val = JSON.stringify(val);
      return `"${String(val).replace(/"/g, '""')}"`;
    }).join(','));
  });
  const blob = new Blob(['\uFEFF' + csvRows.join('\n')], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `JoyBimbel_${table}_${todayISO()}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  showToast(`File ${table} berhasil diunduh`, 'success');
}

function downloadAllBackup() {
  const backup = { exported_at: new Date().toISOString(), version: '1.0', app: 'Joy Bimbel',
    data: { siswa: DB.siswa, tentor: DB.tentor, jadwal: DB.jadwal, invoice: DB.invoice, laporan: DB.laporan, settings: DB.settings }
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `JoyBimbel_BackupLengkap_${todayISO()}.json`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  showToast('Backup lengkap berhasil diunduh', 'success');
}

async function simpanUser(e) {
  e.preventDefault();
  const f = e.target;
  const tempClient = supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } });
  try {
    const { data, error } = await tempClient.auth.signUp({ 
      email: f.email.value.trim(), password: f.password.value,
      options: { data: { nama: f.nama.value, role: f.role.value } }
    });
    if (error) throw error;
    showToast('Akun berhasil dibuat!', 'success');
    closeModal();
    loadAllData({ id: DB.profile.id });
  } catch (err) { showToast("Gagal: " + err.message, 'error'); }
}

async function resetPass(email) {
  const newPass = prompt(`Masukkan password baru untuk akun ${email}:\n(Minimal 6 karakter)`);
  if (!newPass) return;
  if (newPass.length < 6) { showToast('Password terlalu pendek! Minimal 6 karakter.', 'warning'); return; }
  try {
    const { error } = await supabaseClient.rpc('admin_reset_password', { user_email: email, new_password: newPass });
    if (error) throw error;
    showToast(`Password ${email} diubah menjadi: ${newPass}`, 'success');
  } catch (err) { showToast("Gagal: " + err.message, 'error'); }
}

async function hapusAkun(email, nama) {
  showConfirm('Hapus Akun?', `Yakin ingin menghapus akun "${nama}" (${email}) secara permanen?`, async () => {
    try {
      const { error } = await supabaseClient.rpc('delete_user_by_admin', { user_email: email });
      if (error) throw error;
      showToast(`Akun ${nama} berhasil dihapus`, 'success');
      loadAllData({ id: DB.profile.id });
    } catch (err) { showToast("Gagal: " + err.message, 'error'); }
  });
}

            <option value="lunas" ${editing?.status==='lunas'?'selected':''}>Lunas / Sudah Dibayar</option>

      </div>

    const f = e.target;

      const deskripsi = row.querySelector('.item-desk').value.trim();
      const qty = Number(row.querySelector('.item-qty').value) || 0;
      const harga = Number(row.querySelector('.item-harga').value) || 0;
      let tanggal = null;
      const tglInput = row.querySelector('.item-tgl');
      if (tglInput && tglInput.value) tanggal = tglInput.value;
      
      if (deskripsi && qty > 0) items.push({ tanggal, deskripsi, qty, harga });
    });
    if (items.length === 0) { showToast('Minimal 1 item harus diisi', 'warning'); return; }
    const total = items.reduce((a,it)=>a+it.qty*it.harga, 0);
    const data = { jenis: f.jenis.value, untuk_id: f.untuk_id.value, periode: f.periode.value.trim(), items: items, total: total, status: f.status.value };

    toggleItemFields(jenis);

  const items = editing ? editing.items : [{deskripsi:'', qty:1, harga:0}];
  if(Array.isArray(items)) items.forEach(it => addItemRow(it));
  updateInvoiceTotal();
}

function onJenisChange(jenis) {
  refreshRecipients(jenis, '');
  toggleItemFields(jenis);
  document.getElementById('items-container').innerHTML = '';
  addItemRow();
  updateInvoiceTotal();
  const btn = document.getElementById('btn-fetch-jadwal');
  if (btn) btn.classList.toggle('hidden', jenis !== 'tentor');
}

function onRecipientChange(untukId) {
  const jenis = document.querySelector('select[name="jenis"]').value;
  const btn = document.getElementById('btn-fetch-jadwal');
  if (btn) btn.classList.toggle('hidden', jenis !== 'tentor');

  if (jenis === 'tentor' && untukId) {
    const tentor = DB.tentor.find(t => t.id === untukId);
    if (!tentor) return;
    
    const pastInvoices = DB.invoice.filter(i => i.jenis === 'tentor' && i.untuk_id === untukId);
    const invoicedDates = new Set();
    pastInvoices.forEach(inv => {
      if (Array.isArray(inv.items)) {
        inv.items.forEach(it => { if (it.tanggal) invoicedDates.add(it.tanggal); });
      }
    });
    
    const today = todayISO();
    const jadwalTentor = DB.jadwal.filter(j => j.tentor_id === untukId && j.tanggal && j.tanggal <= today && !invoicedDates.has(j.tanggal));
    
    document.getElementById('items-container').innerHTML = '';
    
    if (jadwalTentor.length > 0) {
      jadwalTentor.sort((a,b) => a.tanggal.localeCompare(b.tanggal));
      jadwalTentor.forEach(j => {
        const siswa = DB.siswa.find(s => s.id === j.siswa_id);
        const mapel = siswa?.mapel || tentor.mapel || 'Les Privat';
        addItemRow({
          tanggal: j.tanggal,
          deskripsi: mapel,
          qty: 1,
          harga: tentor.tarif
        });
      });
      showToast(`Ditemukan ${jadwalTentor.length} jadwal mengajar`, 'success');
    } else {
      addItemRow();
      showToast('Tidak ada jadwal baru yang belum ditagihkan', 'warning');
    }
    updateInvoiceTotal();
  }
}

function toggleItemFields(jenis) {
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    const tglInput = row.querySelector('.item-tgl');
    if (jenis === 'tentor') {
      if (!tglInput) {
        const newTgl = document.createElement('input');
        newTgl.type = 'date';
        newTgl.className = 'item-tgl w-32 border rounded-lg px-2 py-1.5 text-sm';
        newTgl.style.flexShrink = '0';
        newTgl.required = true;
        row.insertBefore(newTgl, row.firstChild);
      }
    } else {
      if (tglInput) tglInput.remove();
    }
  });
}

function refreshRecipients(jenis, selectedId) {
  const sel = document.getElementById('recipient-select');
  if (!sel) return;
  const data = jenis === 'siswa' ? DB.siswa : DB.tentor;
  sel.innerHTML = '<option value="">— Pilih —</option>' + data.map(d => `
    <option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(jenis==='siswa' ? `${d.nama} (${d.nama_orang_tua||'-'})` : `${d.nama} - ${d.mapel||'-'}`)}</option>`).join('');
}

function addItemRow(item) {
  const container = document.getElementById('items-container');
  if (!container) return;
  const it = item || { deskripsi:'', qty:1, harga:0, tanggal: '' };
  const jenis = document.querySelector('select[name="jenis"]').value;
  
  const div = document.createElement('div');
  div.className = 'item-row flex gap-2 items-start';
  
  let html = '';
  if (jenis === 'tentor') {
    html += `<input type="date" class="item-tgl w-32 border rounded-lg px-2 py-1.5 text-sm flex-shrink-0" value="${it.tanggal || ''}" required />`;
  }
  
  html += `
    <input class="item-desk flex-1 border rounded-lg px-2 py-1.5 text-sm" placeholder="${jenis==='tentor'?'Mata Pelajaran':'Deskripsi'}" value="${escapeHtml(it.deskripsi)}" required />
    <input class="item-qty w-14 border rounded-lg px-2 py-1.5 text-sm" type="number" min="1" value="${it.qty}" oninput="updateInvoiceTotal()" required />
    <input class="item-harga w-24 border rounded-lg px-2 py-1.5 text-sm" type="number" min="0" value="${it.harga}" oninput="updateInvoiceTotal()" required />
    <button type="button" onclick="this.parentElement.remove(); updateInvoiceTotal();" class="text-red-500 hover:bg-red-50 p-1.5 rounded font-bold">✕</button>
  `;
  
  div.innerHTML = html;
  container.appendChild(div);
  updateInvoiceTotal();
}

function updateInvoiceTotal() {
  let total = 0;
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    const q = Number(row.querySelector('.item-qty').value)||0;
    const h = Number(row.querySelector('.item-harga').value)||0;
    total += q*h;
  });
  const el = document.getElementById('invoice-total');
  if (el) el.textContent = rupiah(total);
}

function printInvoice(id) {
  const inv = DB.invoice.find(x=>x.id===id);
  if (!inv) return;
  const target = inv.jenis==='siswa' ? DB.siswa.find(x=>x.id===inv.untuk_id) : DB.tentor.find(x=>x.id===inv.untuk_id);

async function simpanSiswa(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { 
    nama: f.nama.value, 
    kelas: f.kelas.value, 
    mapel: f.mapel.value || null,
    alamat: f.alamat.value || null,
    nama_orang_tua: f.nama_orang_tua.value, 
    no_wa: f.no_wa.value, 
    tentor_id: f.tentor_id.value || null, 
    aktif: true 
  };
  if (id) await supabaseClient.from('siswa').update(data).eq('id', id);
  else await supabaseClient.from('siswa').insert([data]);
  showToast(id ? 'Data siswa diperbarui' : 'Siswa baru ditambahkan', 'success');
  closeModal();
}

async function simpanTentor(e) {
  const f = e.target; const id = f.dataset.id;
  const data = { 
    nama: f.nama.value, 
    email: f.email.value, 
    no_wa: f.no_wa.value,
    mapel: f.mapel.value, 
    tarif: Number(f.tarif.value)||0,
    nama_bank: f.nama_bank.value || null,
    no_rekening: f.no_rekening.value || null
  };
  if (id) await supabaseClient.from('tentor').update(data).eq('id', id);
  else await supabaseClient.from('tentor').insert([data]);
  showToast(id ? 'Data tentor diperbarui' : 'Tentor baru ditambahkan', 'success');
  closeModal();
}

// ================= JADWAL =================
function renderJadwal() {
  const role = DB.profile?.role || 'tentor';
  const myTentorId = getMyTentorId();
  let filteredJadwal = [];
  if (role === 'admin') filteredJadwal = DB.jadwal;
  else if (role === 'tentor' && myTentorId) filteredJadwal = DB.jadwal.filter(j => j.tentor_id === myTentorId);

  const q = (searchSiswa || '').toLowerCase();
  if (q) {
    const matchingSiswaIds = DB.siswa.filter(s => (s.nama||'').toLowerCase().includes(q)).map(s => s.id);
    filteredJadwal = filteredJadwal.filter(j => matchingSiswaIds.includes(j.siswa_id));
  }

  const grouped = {};
  filteredJadwal.forEach(j => { if (!grouped[j.siswa_id]) grouped[j.siswa_id] = []; grouped[j.siswa_id].push(j); });

  Object.keys(grouped).forEach(sid => {
    grouped[sid].sort((a, b) => {
      const da = a.tanggal || '9999-12-31';
      const db = b.tanggal || '9999-12-31';
      if (da !== db) return da.localeCompare(db);
      return (a.jam_mulai || '').localeCompare(b.jam_mulai || '');
    });
  });

  const sortedSiswaIds = Object.keys(grouped).sort((a, b) => {
    const nameA = DB.siswa.find(x=>x.id===a)?.nama || '';
    const nameB = DB.siswa.find(x=>x.id===b)?.nama || '';
    return nameA.localeCompare(nameB);
  });

  const today = todayISO();

  return `<div>
    <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-4">
      <div><h1 class="text-2xl font-bold">Jadwal Les</h1><p class="text-gray-500 text-sm">${filteredJadwal.length} sesi untuk ${sortedSiswaIds.length} siswa</p></div>
      ${role==='admin'?`<button onclick="openJadwalForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold self-start">+ Tambah Jadwal</button>`:''}
    </div>
    
    <div class="bg-white rounded-xl border p-3 mb-4">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input oninput="searchSiswa=this.value; renderPage();" value="${escapeHtml(searchSiswa)}" placeholder="Cari nama siswa..." class="w-full border rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500" />
      </div>
    </div>

    ${sortedSiswaIds.length === 0 ? `<div class="text-center text-gray-400 py-12 bg-white border rounded-xl"><i data-lucide="calendar" class="w-10 h-10 mx-auto mb-2 text-gray-300"></i><p>${searchSiswa ? 'Tidak ada jadwal yang cocok.' : 'Belum ada jadwal.'}</p></div>` : 
    `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 items-start">
      ${sortedSiswaIds.map(siswaId => {
        const s = DB.siswa.find(x=>x.id===siswaId) || {};
        const jadwalSiswa = grouped[siswaId];
        const isExpanded = expandedJadwal[siswaId] === true;
        const upcoming = jadwalSiswa.filter(j => j.tanggal && j.tanggal >= today);
        const past = jadwalSiswa.filter(j => !j.tanggal || j.tanggal < today);
        const nextJadwal = upcoming[0];
        
        return `<div class="bg-white rounded-xl border shadow-sm overflow-hidden flex flex-col transition hover:shadow-md">
          <button onclick="toggleJadwalCard('${siswaId}')" class="bg-orange-50 px-4 py-3 border-b border-orange-100 text-left w-full hover:bg-orange-100 transition">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0 flex-1">
                <i data-lucide="user" class="w-5 h-5 text-orange-600 flex-shrink-0"></i>
                <div class="min-w-0 flex-1">
                  <h2 class="font-bold text-base text-orange-800 truncate">${escapeHtml(s.nama || 'Siswa Terhapus')}</h2>
                  <div class="text-xs text-orange-600 truncate">${escapeHtml(s.kelas || '-')}${s.mapel ? ' • ' + escapeHtml(s.mapel) : ''}</div>
                </div>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0">
                <span class="text-xs bg-orange-600 text-white px-2 py-1 rounded-full font-semibold">${jadwalSiswa.length}×</span>
                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-5 h-5 text-orange-600"></i>
              </div>
            </div>
            ${!isExpanded && nextJadwal ? `<div class="text-xs text-gray-600 mt-2 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> Berikutnya: ${formatTanggal(nextJadwal.tanggal)}</div>` : ''}
          </button>
          ${isExpanded ? `
          <div class="p-4 flex-1 space-y-2 animate-fade-in">
            ${upcoming.length === 0 && past.length === 0 ? '<p class="text-xs text-gray-400 text-center py-2">Belum ada jadwal</p>' : ''}
            ${upcoming.map(j => {
              const t = DB.tentor.find(x=>x.id===j.tentor_id) || {};
              return `<div class="bg-orange-50 border border-orange-200 rounded-lg p-3 flex justify-between items-start gap-2">
                <div class="flex-1 min-w-0">
                  <div class="font-semibold text-gray-800 text-sm">${formatTanggal(j.tanggal)}</div>
                  <div class="text-xs text-gray-600 mt-0.5 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${formatJam(j.jam_mulai)} - ${formatJam(j.jam_selesai)}</div>
                  <div class="text-xs text-orange-600 mt-1 font-medium truncate">Tentor: ${escapeHtml(t.nama || '-')}</div>
                </div>
                ${role==='admin'?`<button onclick="event.stopPropagation(); deleteRecord('jadwal','${j.id}','jadwal ${formatTanggal(j.tanggal)}')" class="text-red-400 hover:text-red-600 p-1.5 rounded hover:bg-red-50 flex-shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
              </div>`;
            }).join('')}
            ${past.length > 0 ? `
              <details class="mt-2">
                <summary class="text-xs text-gray-500 cursor-pointer hover:text-gray-700 font-medium">Lihat ${past.length} jadwal lampau</summary>
                <div class="space-y-2 mt-2">
                  ${past.map(j => {
                    const t = DB.tentor.find(x=>x.id===j.tentor_id) || {};
                    return `<div class="bg-gray-50 border border-gray-200 rounded-lg p-3 flex justify-between items-start gap-2 opacity-75">
                      <div class="flex-1 min-w-0">
                        <div class="font-semibold text-gray-700 text-sm">${j.tanggal ? formatTanggal(j.tanggal) : (j.hari || 'Tanggal belum diatur')}</div>
                        <div class="text-xs text-gray-500 mt-0.5 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3"></i> ${formatJam(j.jam_mulai)} - ${formatJam(j.jam_selesai)}</div>
                        <div class="text-xs text-gray-500 mt-1 truncate">Tentor: ${escapeHtml(t.nama || '-')}</div>
                      </div>
                      ${role==='admin'?`<button onclick="event.stopPropagation(); deleteRecord('jadwal','${j.id}','jadwal ${j.tanggal || j.hari}')" class="text-red-400 hover:text-red-600 p-1.5 rounded hover:bg-red-50 flex-shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
                    </div>`;
                  }).join('')}
                </div>
              </details>
            ` : ''}
          </div>
          ` : ''}
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}

function toggleJadwalCard(siswaId) {
  expandedJadwal[siswaId] = !expandedJadwal[siswaId];
  renderPage();
}

async function simpanJadwal(e) {
  const f = e.target;
  const tanggal = f.tanggal.value;
  const d = new Date(tanggal + 'T00:00:00');
  const hari = NAMA_HARI[d.getDay()];
  await supabaseClient.from('jadwal').insert([{ 
    siswa_id: f.siswa_id.value, 
    tentor_id: f.tentor_id.value, 
    tanggal: tanggal,
    hari: hari,
    jam_mulai: f.jam_mulai.value, 
    jam_selesai: f.jam_selesai.value 
  }]);
  showToast('Jadwal berhasil ditambahkan', 'success');
  closeModal();
}

  const body = `<form><div class="space-y-3">
    <div><label class="text-sm">Siswa</label><select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.siswa.map(s=>`<option value="${s.id}">${escapeHtml(s.nama)}${s.kelas?` (${escapeHtml(s.kelas)})`:''}${s.mapel?` - ${escapeHtml(s.mapel)}`:''}</option>`).join('')}</select></div>
    <div><label class="text-sm">Tentor</label><select name="tentor_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.tentor.map(t=>`<option value="${t.id}">${escapeHtml(t.nama)}</option>`).join('')}</select></div>
    <div><label class="text-sm">Tanggal Les *</label><input type="date" name="tanggal" required value="${todayISO()}" class="w-full border rounded-lg px-3 py-2 mt-1" /></div>

      <div><label class="text-sm">Jam Mulai</label><input type="time" name="jam_mulai" value="15:00" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>
      <div><label class="text-sm">Jam Selesai</label><input type="time" name="jam_selesai" value="16:30" required class="w-full border rounded-lg px-3 py-2 mt-1" /></div>

    <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
      <p class="text-xs text-blue-700"><b>💡 Tips:</b> Untuk siswa paket 2×/bulan, tinggal tambahkan jadwal baru setiap akan les di tanggal yang sudah disepakati. Fleksibel!</p>
    </div>
    <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold">Simpan</button>

// ================= DELETE HELPER =================
async function deleteRecord(table, id, name = 'data ini') {
  showConfirm('Hapus Data?', `Yakin ingin menghapus "${name}"? Tindakan ini tidak bisa dibatalkan.`, async () => {
    const { error } = await supabaseClient.from(table).delete().eq('id', id);
    if (error) showToast('Gagal menghapus: ' + error.message, 'error');
    else showToast('Data berhasil dihapus', 'success');
  });
}
