<script>
// ================= ERROR HANDLER GLOBAL =================
window.onerror = function(msg, url, line, col, error) {
  const errDiv = document.getElementById('global-error');
  if (errDiv) {
    errDiv.innerHTML = "⚠️ Error Sistem: " + msg + " (Baris " + line + ")";
    errDiv.classList.remove('hidden');
    setTimeout(() => errDiv.classList.add('hidden'), 5000);
  }
  return false;
};

// ================= GLOBAL DATA =================
let DB = { profile: null, siswa: [], tentor: [], jadwal: [], absensi: [], invoice: [], laporan: [], users: [], settings: {} };
let currentPage = 'dashboard';
let absensiDate = new Date().toISOString().slice(0,10);
let realtimeChannel = null;
let refreshTimeout = null;
let chartInstance = null;
let LOGO_URL = '';

// ================= HELPERS =================
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

// ================= LOGO MANAGEMENT =================
async function loadLogo() {
  try {
    const { data } = await supabaseClient.from('settings').select('value').eq('key', 'logo_url').single();
    if (data && data.value) { LOGO_URL = data.value; applyLogo(); }
  } catch (e) { console.log("Logo belum diatur."); }
}
function applyLogo() {
  if (!LOGO_URL) return;
  ['login-logo','sidebar-logo','mobile-logo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.src = LOGO_URL; el.classList.remove('hidden'); }
  });
  const favicon = document.getElementById('favicon');
  if (favicon) favicon.href = LOGO_URL;
}

// ================= AUTH =================
async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { await loadAllData(session.user); }
    else {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-page').classList.add('hidden');
      document.getElementById('loading-page').classList.add('hidden');
    }
  } catch (e) {
    console.error(e);
    document.getElementById('login-page').classList.remove('hidden');
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true; btnText.innerHTML = `Memverifikasi...`;

  const email = f.email.value.trim();
  const password = f.password.value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadAllData(data.user);
  } catch (err) {
    alert("Login Gagal: " + err.message);
    document.getElementById('login-error').classList.remove('hidden');
    btn.disabled = false; btnText.innerText = 'Masuk';
  }
});

async function loadAllData(user) {
  try {
    document.getElementById('login-page').classList.add('hidden');
    const loadingPage = document.getElementById('loading-page');
    loadingPage.classList.remove('hidden'); setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);

    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
    if (profErr || !profile) throw new Error("Profil Anda belum terdaftar.");
    DB.profile = profile;

    const [resSiswa, resTentor, resJadwal, resAbsensi, resInvoice, resLaporan, resUsers, resSettings] = await Promise.all([
      supabaseClient.from('siswa').select('*').order('nama'),
      supabaseClient.from('tentor').select('*').order('nama'),
      supabaseClient.from('jadwal').select('*'),
      supabaseClient.from('absensi').select('*'),
      supabaseClient.from('invoice').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('laporan').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('profiles').select('*').order('nama'),
      supabaseClient.from('settings').select('*')
    ]);

    DB.siswa = resSiswa.data || []; DB.tentor = resTentor.data || []; DB.jadwal = resJadwal.data || [];
    DB.absensi = resAbsensi.data || []; DB.invoice = resInvoice.data || []; DB.laporan = resLaporan.data || [];
    DB.users = resUsers.data || [];
    
    if (resSettings.data) {
      resSettings.data.forEach(s => DB.settings[s.key] = s.value);
      if (DB.settings.logo_url) { LOGO_URL = DB.settings.logo_url; }
    }

    bootApp();
    
    if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => loadAllData(user), 1000);
      }).subscribe();

  } catch (err) {
    alert("Error Load Data: " + err.message);
    await supabaseClient.auth.signOut();
    location.reload();
  }
}

async function logout() { 
  if (!confirm('Apakah Anda yakin ingin keluar?')) return; 
  try {
    if (realtimeChannel) { await supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
    await supabaseClient.removeAllChannels();
    await supabaseClient.auth.signOut(); 
    location.reload(); 
  } catch (error) { location.reload(); }
}

// ================= APP ROUTING =================
function bootApp() {
  const loadingPage = document.getElementById('loading-page');
  if (loadingPage) loadingPage.classList.add('opacity-0');
  
  setTimeout(() => {
    if (loadingPage) loadingPage.classList.add('hidden');
    const appPage = document.getElementById('app-page');
    if (appPage) { appPage.classList.remove('hidden'); setTimeout(() => appPage.classList.remove('opacity-0'), 50); }
    
    applyLogo();
    
    const sidebarRole = document.getElementById('sidebar-role');
    if (sidebarRole && DB.profile) sidebarRole.textContent = DB.profile.role.toUpperCase() + ' - ' + DB.profile.nama;
    const mobileRole = document.getElementById('mobile-role');
    if (mobileRole && DB.profile) mobileRole.textContent = DB.profile.role;
    
    renderNav(); renderPage(); 
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }, 400);
}

function renderNav() {
  const s = DB.profile;
  const adminMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'}, {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'absensi', label:'Absensi', icon:'clipboard-check'}, {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
    {id:'invoice', label:'Invoice & Slip Gaji', icon:'file-text'}, {id:'keuangan', label:'Laporan Keuangan', icon:'bar-chart-3'},
    {id:'akun', label:'Akun & Akses', icon:'shield'},
    {id:'pengaturan', label:'Pengaturan Website', icon:'settings'},
    {id:'backup', label:'Backup Data', icon:'database'}
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'}, {id:'absensi', label:'Absensi', icon:'clipboard-check'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'}
  ];
  const menus = s && s.role === 'admin' ? adminMenus : tentorMenus;
  const nav = document.getElementById('nav');
  if (nav) {
    nav.innerHTML = menus.map(m => `
      <button onclick="navigate('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg w-full text-left transition ${currentPage===m.id ? 'bg-orange-50 text-orange-700 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">
        <i data-lucide="${m.icon}" class="w-4 h-4 flex-shrink-0"></i> <span class="truncate">${m.label}</span>
      </button>`).join('');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function navigate(page) { currentPage = page; renderNav(); renderPage(); if (window.innerWidth < 768) { const sb = document.getElementById('sidebar'); if (sb) { sb.classList.add('hidden','-translate-x-full'); } } }
function toggleSidebar() { const s = document.getElementById('sidebar'); if (s) { s.classList.toggle('hidden'); s.classList.toggle('-translate-x-full'); } }

// ================= MODAL =================
let modalSubmit = null;
function openModal(title, body, onSubmit) {
  const mTitle = document.getElementById('modal-title'); if (mTitle) mTitle.textContent = title; 
  const mBody = document.getElementById('modal-body'); if (mBody) mBody.innerHTML = body;
  modalSubmit = onSubmit; 
  const m = document.getElementById('modal'); if (m) m.classList.remove('hidden'); 
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

// ================= RENDER PAGE =================
function renderPage() {
  const content = document.getElementById('content');
  if (!content) return;
  const pages = { dashboard: renderDashboard, siswa: () => renderSiswa(), tentor: () => renderTentor(), jadwal: () => renderJadwal(), absensi: () => renderAbsensi(), invoice: () => renderInvoice(), keuangan: () => renderLaporanKeuangan(), akun: () => renderAkun(), pengaturan: () => renderPengaturan(), backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor() };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// ================= PENGATURAN WEBSITE =================
function renderPengaturan() {
  return `<div>
    <h1 class="text-2xl font-bold mb-1">Pengaturan Website</h1>
    <p class="text-gray-500 mb-6 text-sm">Sesuaikan identitas visual website Anda</p>
    
    <div class="bg-white rounded-xl border p-6 max-w-2xl">
      <h2 class="font-bold text-lg mb-1 flex items-center gap-2"><i data-lucide="image" class="w-5 h-5 text-orange-600"></i> Logo Website</h2>
      <p class="text-sm text-gray-500 mb-4">Logo akan tampil di halaman login, sidebar, dan tab browser (favicon).</p>
      
      <div class="flex flex-col sm:flex-row items-center gap-6">
        <div class="w-32 h-32 border-2 border-dashed rounded-xl flex items-center justify-center bg-gray-50 overflow-hidden flex-shrink-0">
          ${LOGO_URL ? `<img src="${LOGO_URL}" class="max-w-full max-h-full object-contain" />` : `<i data-lucide="image" class="w-10 h-10 text-gray-300"></i>`}
        </div>
        
        <div class="flex-1 w-full">
          <label class="block text-sm font-medium mb-1">Pilih file gambar (PNG / JPG)</label>
          <input type="file" id="logo-input" accept="image/*" class="w-full border rounded-lg px-3 py-2 text-sm mb-3" />
          <button onclick="uploadLogo()" id="btn-upload-logo" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-orange-700 transition">Upload Logo</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function uploadLogo() {
  const input = document.getElementById('logo-input');
  const btn = document.getElementById('btn-upload-logo');
  const file = input.files[0];
  
  if (!file) { alert('Pilih file gambar terlebih dahulu!'); return; }
  if (file.size > 2 * 1024 * 1024) { alert('Ukuran file maksimal 2MB.'); return; }

  btn.disabled = true;
  btn.textContent = 'Mengupload...';

  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `logo_${Date.now()}.${fileExt}`;
    const { error: uploadErr } = await supabaseClient.storage.from('logo').upload(fileName, file);
    if (uploadErr) throw uploadErr;
    
    const { data: { publicUrl } } = supabaseClient.storage.from('logo').getPublicUrl(fileName);
    const { error: dbErr } = await supabaseClient.from('settings').upsert({ key: 'logo_url', value: publicUrl });
    if (dbErr) throw dbErr;
    
    LOGO_URL = publicUrl;
    applyLogo();
    alert('✅ Logo berhasil diperbarui!');
    renderPage();
  } catch (err) {
    alert('Gagal upload logo: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Upload Logo';
  }
}

// ================= FUNGSI BANTUAN: ID TENTOR =================
function getMyTentorId() {
  if (DB.profile.role !== 'tentor') return null;
  if (DB.profile.tentor_id) return DB.profile.tentor_id;
  const match = DB.tentor.find(t => t.email === DB.profile.email);
  return match ? match.id : null;
}

// ================= DASHBOARD =================
function renderDashboard() {
  const s = DB.profile; const siswa = DB.siswa, tentor = DB.tentor, inv = DB.invoice;
  const pemasukan = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);
  const pemasukanCard = s && s.role === 'admin' ? `<div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Pemasukan Lunas</div><div class="text-xl font-bold text-emerald-600">${rupiah(pemasukan)}</div></div>` : '';
  return `
    <div>
      <h1 class="text-2xl font-bold mb-1">Dashboard ${s && s.role==='admin'?'Admin':'Tentor'}</h1>
      <p class="text-gray-500 mb-6 text-sm">Selamat datang, ${s ? escapeHtml(s.nama) : ''} 👋</p>
      <div class="grid grid-cols-2 ${s && s.role==='admin'?'md:grid-cols-4':'md:grid-cols-3'} gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Siswa</div><div class="text-xl font-bold">${siswa.length}</div></div>
        <div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Total Tentor</div><div class="text-xl font-bold">${tentor.length}</div></div>
        ${pemasukanCard}

      </div>
    </div>`;
}

function renderBackup() {
  return `<div>
    <h1 class="text-2xl font-bold mb-1">Backup Data</h1>
    <p class="text-gray-500 mb-6 text-sm">Unduh data bimbel Anda sebagai cadangan</p>

    <h2 class="font-bold text-lg mb-3 flex items-center gap-2"><i data-lucide="table" class="w-5 h-5 text-gray-600"></i> Download per Tabel (CSV)</h2>
    <p class="text-sm text-gray-500 mb-4">Format CSV bisa langsung dibuka di Microsoft Excel atau Google Sheets.</p>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${backupCard('siswa', 'Data Siswa', 'users', 'blue', DB.siswa.length)}
      ${backupCard('tentor', 'Data Tentor', 'user-cog', 'emerald', DB.tentor.length)}
      ${backupCard('jadwal', 'Data Jadwal', 'calendar', 'purple', DB.jadwal.length)}
      ${backupCard('absensi', 'Data Absensi', 'clipboard-check', 'amber', DB.absensi.length)}
      ${backupCard('invoice', 'Invoice & Slip Gaji', 'file-text', 'rose', DB.invoice.length)}
      ${backupCard('laporan', 'Laporan Mengajar', 'file-check', 'indigo', DB.laporan.length)}
    </div>
    
    <div class="mt-6 bg-blue-50 border border-blue-200 rounded-xl p-4">
      <div class="flex items-start gap-3">

// Fungsi untuk download CSV
function downloadCSV(table) {
  const data = DB[table] || [];
  if (data.length === 0) { alert(`Tidak ada data ${table} untuk diunduh.`); return; }

  const allKeys = [...new Set(data.flatMap(obj => Object.keys(obj)))];
  const csvRows = [];
  csvRows.push(allKeys.map(h => `"${h}"`).join(','));
  
  data.forEach(row => {
    const values = allKeys.map(h => {
      let val = row[h];
      if (val === null || val === undefined) val = '';
      if (typeof val === 'object') val = JSON.stringify(val);
      return `"${String(val).replace(/"/g, '""')}"`;
    });
    csvRows.push(values.join(','));
  });

  const csvContent = '\uFEFF' + csvRows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0,10);
  link.download = `JoyBimbel_${table}_${date}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// Fungsi untuk download semua data (JSON)
function downloadAllBackup() {
  const backup = {
    exported_at: new Date().toISOString(),
    version: '1.0',
    app: 'Joy Bimbel',

      absensi: DB.absensi,

    }

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0,10);
  link.download = `JoyBimbel_BackupLengkap_${date}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

async function simpanUser(e) {
  e.preventDefault();
  const f = e.target;
  const email = f.email.value.trim();
  const pass = f.password.value;
  const nama = f.nama.value;
  const role = f.role.value;
  const tempClient = supabase.createClient(supabaseUrl, supabaseKey, { auth: { persistSession: false, autoRefreshToken: false } });

  try {
    const { data, error } = await tempClient.auth.signUp({ 
      email, password: pass,
      options: { data: { nama: nama, role: role } }
    });
    if (error) throw error;
    alert("✅ Akun berhasil dibuat!");
    closeModal();
    loadAllData({ id: DB.profile.id }); 
  } catch (err) { alert("Gagal membuat akun: " + err.message); }
}

async function resetPass(email) {
  const newPass = prompt(`Masukkan password baru untuk akun ${email}:\n(Minimal 6 karakter)`);
  if (!newPass) return;
  if (newPass.length < 6) { alert('Password terlalu pendek! Minimal 6 karakter.'); return; }
  try {
    const { error } = await supabaseClient.rpc('admin_reset_password', { user_email: email, new_password: newPass });
    if (error) throw error;
    alert(`✅ Password untuk ${email} berhasil diubah menjadi: ${newPass}`);
  } catch (err) { alert("Gagal mereset password: " + err.message); }
}

async function hapusAkun(email, nama) {
  if (!confirm(`Yakin ingin menghapus akun ${nama} (${email}) secara permanen?`)) return;

    if (items.length === 0) { alert('Minimal 1 item harus diisi'); return; }
    const total = items.reduce((a,it)=>a+it.qty*it.harga, 0);
    const data = { jenis: f.jenis.value, untuk_id: f.untuk_id.value, periode: f.periode.value.trim(), items: items, total: total, status: f.status.value };
    if (editing) { await supabaseClient.from('invoice').update(data).eq('id', editing.id); }
    else { const no = `INV-${new Date().getFullYear()}-${Math.floor(Math.random()*1000)}`; await supabaseClient.from('invoice').insert([{ no_invoice: no, ...data, tanggal: todayISO() }]); }
    closeModal();
  });

  refreshRecipients(editing?.jenis||'siswa', editing?.untuk_id);
  const items = editing ? editing.items : [{deskripsi:'', qty:1, harga:0}];
  if(Array.isArray(items)) items.forEach(it => addItemRow(it));
  updateInvoiceTotal();
}

function refreshRecipients(jenis, selectedId) {
  const sel = document.getElementById('recipient-select');
  if (!sel) return;
  const data = jenis === 'siswa' ? DB.siswa : DB.tentor;
  sel.innerHTML = '<option value="">— Pilih —</option>' + data.map(d => `
    <option value="${d.id}" ${d.id===selectedId?'selected':''}>${escapeHtml(jenis==='siswa' ? `${d.nama} (${d.nama_orang_tua||'-'})` : `${d.nama} - ${d.mapel||'-'}`)}</option>`).join('');
}

function addItemRow(item) {
  const container = document.getElementById('items-container');
  if (!container) return;
  const it = item || { deskripsi:'', qty:1, harga:0 };
  const div = document.createElement('div');
  div.className = 'item-row flex gap-2 items-start';
  div.innerHTML = `
    <input class="item-desk flex-1 border rounded-lg px-2 py-1.5 text-sm" placeholder="Deskripsi" value="${escapeHtml(it.deskripsi)}" />
    <input class="item-qty w-14 border rounded-lg px-2 py-1.5 text-sm" type="number" min="1" placeholder="Qty" value="${it.qty}" oninput="updateInvoiceTotal()" />
    <input class="item-harga w-24 border rounded-lg px-2 py-1.5 text-sm" type="number" min="0" placeholder="Harga" value="${it.harga}" oninput="updateInvoiceTotal()" />
    <button type="button" onclick="this.parentElement.remove(); updateInvoiceTotal();" class="text-red-500 hover:bg-red-50 p-1.5 rounded font-bold">✕</button>
  `;
  container.appendChild(div);
  updateInvoiceTotal();
}

function updateInvoiceTotal() {
  let total = 0;
  document.querySelectorAll('#items-container .item-row').forEach(row => {
    const q = Number(row.querySelector('.item-qty').value)||0;
    const h = Number(row.querySelector('.item-harga').value)||0;
    total += q*h;
  });
  const el = document.getElementById('invoice-total');
  if (el) el.textContent = rupiah(total);
}

// ================= JADWAL =================
function renderJadwal() {
  const role = DB.profile ? DB.profile.role : 'tentor';
  const myTentorId = getMyTentorId();
  let filteredJadwal = [];
  if (role === 'admin') { filteredJadwal = DB.jadwal; }
  else if (role === 'tentor') { filteredJadwal = myTentorId ? DB.jadwal.filter(j => j.tentor_id === myTentorId) : []; }

  const grouped = {};
  filteredJadwal.forEach(j => { if (!grouped[j.siswa_id]) grouped[j.siswa_id] = []; grouped[j.siswa_id].push(j); });
  const sortedSiswaIds = Object.keys(grouped).sort((a, b) => {
    const nameA = DB.siswa.find(x=>x.id===a)?.nama || '';
    const nameB = DB.siswa.find(x=>x.id===b)?.nama || '';
    return nameA.localeCompare(nameB);
  });

  return `<div>
    <div class="flex justify-between items-center mb-4">
      <h1 class="text-2xl font-bold">Jadwal Bimbel</h1>
      ${role==='admin'?`<button onclick="openJadwalForm()" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">+ Tambah</button>`:''}
    </div>
    ${sortedSiswaIds.length === 0 ? '<div class="text-center text-gray-400 py-8 bg-white border rounded-xl">Belum ada jadwal.</div>' : 
    `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      ${sortedSiswaIds.map(siswaId => {
        const s = DB.siswa.find(x=>x.id===siswaId) || {};
        const jadwalSiswa = grouped[siswaId];
        jadwalSiswa.sort((a, b) => {
          const dayA = HARI.indexOf(a.hari), dayB = HARI.indexOf(b.hari);
          if (dayA !== dayB) return dayA - dayB;
          return (a.jam_mulai || '').localeCompare(b.jam_mulai || '');
        });
        return `<div class="bg-white rounded-xl border shadow-sm overflow-hidden flex flex-col">
          <div class="bg-orange-50 px-4 py-3 border-b border-orange-100 flex items-center gap-2">
            <i data-lucide="user" class="w-5 h-5 text-orange-600"></i>
            <h2 class="font-bold text-lg text-orange-800 truncate">${escapeHtml(s.nama || 'Siswa Terhapus')}</h2>
          </div>
          <div class="p-4 flex-1 space-y-3">
            ${jadwalSiswa.map(j => {
              const t = DB.tentor.find(x=>x.id===j.tentor_id) || {};
              return `<div class="bg-gray-50 rounded-lg p-3 border flex justify-between items-center gap-2">
                <div class="flex-1 min-w-0">
                  <div class="font-semibold text-gray-800 flex items-center gap-1 text-sm"><i data-lucide="calendar" class="w-3 h-3 text-gray-500"></i> ${j.hari}</div>
                  <div class="text-sm text-gray-600 mt-0.5 flex items-center gap-1"><i data-lucide="clock" class="w-3 h-3 text-gray-500"></i> ${j.jam_mulai} - ${j.jam_selesai}</div>
                  <div class="text-xs text-orange-600 mt-1 font-medium truncate">Tentor: ${escapeHtml(t.nama || '-')}</div>
                </div>
                ${role==='admin'?`<button onclick="deleteRecord('jadwal','${j.id}')" class="text-red-400 hover:text-red-600 p-2 rounded hover:bg-red-50 flex-shrink-0"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`:''}
              </div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>`}
  </div>`;
}
async function simpanJadwal(e) {
  const f = e.target;
  await supabaseClient.from('jadwal').insert([{ siswa_id: f.siswa_id.value, tentor_id: f.tentor_id.value, hari: f.hari.value, jam_mulai: f.jam_mulai.value, jam_selesai: f.jam_selesai.value }]);
  closeModal();
}
function openJadwalForm() {
  const body = `<form><div class="space-y-3">
    <div><label class="text-sm">Siswa</label><select name="siswa_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.siswa.map(s=>`<option value="${s.id}">${escapeHtml(s.nama)}</option>`).join('')}</select></div>
    <div><label class="text-sm">Tentor</label><select name="tentor_id" required class="w-full border rounded-lg px-3 py-2 mt-1">${DB.tentor.map(t=>`<option value="${t.id}">${escapeHtml(t.nama)}</option>`).join('')}</select></div>
    <div><label class="text-sm">Hari</label><select name="hari" class="w-full border rounded-lg px-3 py-2 mt-1">${HARI.map(h=>`<option value="${h}">${h}</option>`).join('')}</select></div>
    <div class="grid grid-cols-2 gap-2"><div><label class="text-sm">Mulai</label><input type="time" name="jam_mulai" value="15:00" class="w-full border rounded-lg px-3 py-2" /></div><div><label class="text-sm">Selesai</label><input type="time" name="jam_selesai" value="16:30" class="w-full border rounded-lg px-3 py-2" /></div></div>
    <button type="submit" class="w-full bg-orange-600 text-white py-2 rounded-lg font-semibold">Simpan</button>
  </div></form>`;
  openModal('Tambah Jadwal', body, simpanJadwal);
}

// ================= ABSENSI =================
function renderAbsensi() {
  const existing = DB.absensi.filter(a => a.tanggal === absensiDate);
  return `<div>
    <div class="flex justify-between items-center mb-4"><h1 class="text-2xl font-bold">Absensi</h1><input type="date" value="${absensiDate}" onchange="absensiDate=this.value; renderPage();" class="border rounded-lg px-3 py-2 text-sm" /></div>
    <div class="bg-white rounded-xl border overflow-hidden"><table class="w-full text-sm"><thead class="bg-gray-50"><tr><th class="text-left px-3 py-3">Nama</th><th class="text-center px-3 py-3">Status</th></tr></thead>
      <tbody>${DB.siswa.map(s=>{ const cur = existing.find(a=>a.siswa_id===s.id)?.status; return `<tr class="border-t"><td class="px-3 py-3 text-sm">${escapeHtml(s.nama)}</td><td class="px-3 py-3"><div class="flex justify-center gap-1 flex-wrap">${['hadir','izin','sakit','alpa'].map(st=>`<button onclick="setAbsensi('${s.id}','${st}')" class="px-2 py-1.5 rounded text-xs border ${cur===st?'bg-orange-500 text-white':'bg-white hover:bg-gray-50'} capitalize">${st}</button>`).join('')}</div></td></tr>`; }).join('')}</tbody>
    </table></div>
  </div>`;
}
async function setAbsensi(siswa_id, status) {
  const ex = DB.absensi.find(a => a.siswa_id===siswa_id && a.tanggal===absensiDate);
  if (ex) await supabaseClient.from('absensi').update({ status }).eq('id', ex.id);
  else await supabaseClient.from('absensi').insert([{ siswa_id, tanggal: absensiDate, status, oleh: DB.profile ? DB.profile.email : '' }]);
}

async function deleteRecord(table, id) {
  if (!confirm('Yakin hapus data ini?')) return;
  await supabaseClient.from(table).delete().eq('id', id);
}
