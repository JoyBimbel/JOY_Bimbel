<script>
// ================= ERROR HANDLER GLOBAL =================
window.onerror = function(msg, url, line, col, error) {
  const errDiv = document.getElementById('global-error');
  if (errDiv) {
    errDiv.innerHTML = "⚠️ Error Sistem: " + msg + " (Baris " + line + ")";
    errDiv.classList.remove('hidden');
    setTimeout(() => errDiv.classList.add('hidden'), 5000);
  }
  return false;
};

// ================= GLOBAL DATA =================
let DB = { profile: null, siswa: [], tentor: [], jadwal: [], absensi: [], invoice: [], laporan: [], users: [], settings: {} };
let currentPage = 'dashboard';
let absensiDate = new Date().toISOString().slice(0,10);
let realtimeChannel = null;
let refreshTimeout = null;
let chartInstance = null;
let LOGO_URL = '';

// ================= HELPERS =================
function escapeHtml(s) { return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function formatWa(n) { n = String(n||'').replace(/\D/g,''); if (n.startsWith('0')) return '62' + n.slice(1); return n.startsWith('62')?n:'62'+n; }
function rupiah(n) { return 'Rp' + Number(n||0).toLocaleString('id-ID'); }
function todayISO() { return new Date().toISOString().slice(0,10); }
const NAMA_BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function periodeNow() { const d = new Date(); return `${NAMA_BULAN[d.getMonth()]} ${d.getFullYear()}`; }
const HARI = ['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];

// Fungsi untuk memotong detik (jam:menit:detik -> jam:menit)
function formatJam(t) {
  if (!t) return '-';
  return String(t).substring(0, 5);
}

// ================= LOGO MANAGEMENT =================
async function loadLogo() {
  try {
    const { data } = await supabaseClient.from('settings').select('value').eq('key', 'logo_url').single();
    if (data && data.value) { LOGO_URL = data.value; applyLogo(); }
  } catch (e) { console.log("Logo belum diatur."); }
}
function applyLogo() {
  if (!LOGO_URL) return;
  ['login-logo','sidebar-logo','mobile-logo'].forEach(id => {
    const el = document.getElementById(id);
    if (el) { el.src = LOGO_URL; el.classList.remove('hidden'); }
  });
  const favicon = document.getElementById('favicon');
  if (favicon) favicon.href = LOGO_URL;
}

// ================= AUTH =================
async function checkSession() {
  try {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) { await loadAllData(session.user); }
    else {
      document.getElementById('login-page').classList.remove('hidden');
      document.getElementById('app-page').classList.add('hidden');
      document.getElementById('loading-page').classList.add('hidden');
    }
  } catch (e) {
    console.error(e);
    document.getElementById('login-page').classList.remove('hidden');
  }
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = document.getElementById('btn-login');
  const btnText = document.getElementById('btn-text');
  btn.disabled = true; btnText.innerHTML = `Memverifikasi...`;

  const email = f.email.value.trim();
  const password = f.password.value;

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;
    await loadAllData(data.user);
  } catch (err) {
    alert("Login Gagal: " + err.message);
    document.getElementById('login-error').classList.remove('hidden');
    btn.disabled = false; btnText.innerText = 'Masuk';
  }
});

async function loadAllData(user) {
  try {
    document.getElementById('login-page').classList.add('hidden');
    const loadingPage = document.getElementById('loading-page');
    loadingPage.classList.remove('hidden'); setTimeout(() => loadingPage.classList.remove('opacity-0'), 50);

    const { data: profile, error: profErr } = await supabaseClient.from('profiles').select('*').eq('id', user.id).single();
    if (profErr || !profile) throw new Error("Profil Anda belum terdaftar.");
    DB.profile = profile;

    const [resSiswa, resTentor, resJadwal, resAbsensi, resInvoice, resLaporan, resUsers, resSettings] = await Promise.all([
      supabaseClient.from('siswa').select('*').order('nama'),
      supabaseClient.from('tentor').select('*').order('nama'),
      supabaseClient.from('jadwal').select('*'),
      supabaseClient.from('absensi').select('*'),
      supabaseClient.from('invoice').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('laporan').select('*').order('created_at', { ascending: false }),
      supabaseClient.from('profiles').select('*').order('nama'),
      supabaseClient.from('settings').select('*')
    ]);

    DB.siswa = resSiswa.data || []; DB.tentor = resTentor.data || []; DB.jadwal = resJadwal.data || [];
    DB.absensi = resAbsensi.data || []; DB.invoice = resInvoice.data || []; DB.laporan = resLaporan.data || [];
    DB.users = resUsers.data || [];
    
    if (resSettings.data) {
      resSettings.data.forEach(s => DB.settings[s.key] = s.value);
      if (DB.settings.logo_url) { LOGO_URL = DB.settings.logo_url; }
    }

    bootApp();
    
    if (realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
    realtimeChannel = supabaseClient.channel('custom-all-channel')
      .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
        clearTimeout(refreshTimeout);
        refreshTimeout = setTimeout(() => loadAllData(user), 1000);
      }).subscribe();

  } catch (err) {
    alert("Error Load Data: " + err.message);
    await supabaseClient.auth.signOut();
    location.reload();
  }
}

async function logout() { 
  if (!confirm('Apakah Anda yakin ingin keluar?')) return; 
  try {
    if (realtimeChannel) { await supabaseClient.removeChannel(realtimeChannel); realtimeChannel = null; }
    await supabaseClient.removeAllChannels();
    await supabaseClient.auth.signOut(); 
    location.reload(); 
  } catch (error) { location.reload(); }
}

// ================= APP ROUTING =================
function bootApp() {
  const loadingPage = document.getElementById('loading-page');
  if (loadingPage) loadingPage.classList.add('opacity-0');
  
  setTimeout(() => {
    if (loadingPage) loadingPage.classList.add('hidden');
    const appPage = document.getElementById('app-page');
    if (appPage) { appPage.classList.remove('hidden'); setTimeout(() => appPage.classList.remove('opacity-0'), 50); }
    
    applyLogo();
    
    const sidebarRole = document.getElementById('sidebar-role');
    if (sidebarRole && DB.profile) sidebarRole.textContent = DB.profile.role.toUpperCase() + ' - ' + DB.profile.nama;
    const mobileRole = document.getElementById('mobile-role');
    if (mobileRole && DB.profile) mobileRole.textContent = DB.profile.role;
    
    renderNav(); renderPage(); 
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }, 400);
}

function renderNav() {
  const s = DB.profile;
  const adminMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'tentor', label:'Tentor', icon:'user-cog'}, {id:'jadwal', label:'Jadwal', icon:'calendar'},
    {id:'absensi', label:'Absensi', icon:'clipboard-check'}, {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'},
    {id:'invoice', label:'Invoice & Slip Gaji', icon:'file-text'}, {id:'keuangan', label:'Laporan Keuangan', icon:'bar-chart-3'},
    {id:'akun', label:'Akun & Akses', icon:'shield'},
    {id:'pengaturan', label:'Pengaturan Website', icon:'settings'},
    {id:'backup', label:'Backup Data', icon:'database'}
  ];
  const tentorMenus = [
    {id:'dashboard', label:'Dashboard', icon:'home'}, {id:'siswa', label:'Siswa', icon:'users'},
    {id:'jadwal', label:'Jadwal', icon:'calendar'}, {id:'absensi', label:'Absensi', icon:'clipboard-check'},
    {id:'laporan_tentor', label:'Laporan Mengajar', icon:'file-check'}
  ];
  const menus = s && s.role === 'admin' ? adminMenus : tentorMenus;
  const nav = document.getElementById('nav');
  if (nav) {
    nav.innerHTML = menus.map(m => `
      <button onclick="navigate('${m.id}')" class="flex items-center gap-3 px-3 py-2 rounded-lg w-full text-left transition ${currentPage===m.id ? 'bg-orange-50 text-orange-700 font-semibold' : 'hover:bg-gray-100 text-gray-700'}">
        <i data-lucide="${m.icon}" class="w-4 h-4 flex-shrink-0"></i> <span class="truncate">${m.label}</span>
      </button>`).join('');
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function navigate(page) { currentPage = page; renderNav(); renderPage(); if (window.innerWidth < 768) { const sb = document.getElementById('sidebar'); if (sb) { sb.classList.add('hidden','-translate-x-full'); } } }
function toggleSidebar() { const s = document.getElementById('sidebar'); if (s) { s.classList.toggle('hidden'); s.classList.toggle('-translate-x-full'); } }

// ================= MODAL =================
let modalSubmit = null;
function openModal(title, body, onSubmit) {
  const mTitle = document.getElementById('modal-title'); if (mTitle) mTitle.textContent = title; 
  const mBody = document.getElementById('modal-body'); if (mBody) mBody.innerHTML = body;
  modalSubmit = onSubmit; 
  const m = document.getElementById('modal'); if (m) m.classList.remove('hidden'); 
  if (typeof lucide !== 'undefined') lucide.createIcons();
}
function closeModal() { const m = document.getElementById('modal'); if (m) m.classList.add('hidden'); modalSubmit = null; }
document.getElementById('modal-body').addEventListener('submit', (e) => { e.preventDefault(); if (modalSubmit) modalSubmit(e); });

// ================= RENDER PAGE =================
function renderPage() {
  const content = document.getElementById('content');
  if (!content) return;
  const pages = { dashboard: renderDashboard, siswa: () => renderSiswa(), tentor: () => renderTentor(), jadwal: () => renderJadwal(), absensi: () => renderAbsensi(), invoice: () => renderInvoice(), keuangan: () => renderLaporanKeuangan(), akun: () => renderAkun(), pengaturan: () => renderPengaturan(), backup: () => renderBackup(), laporan_tentor: () => renderLaporanTentor() };
  content.innerHTML = (pages[currentPage] || renderDashboard)();
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// ================= PENGATURAN WEBSITE =================
function renderPengaturan() {
  return `<div>
    <h1 class="text-2xl font-bold mb-1">Pengaturan Website</h1>
    <p class="text-gray-500 mb-6 text-sm">Sesuaikan identitas visual website Anda</p>
    
    <div class="bg-white rounded-xl border p-6 max-w-2xl">
      <h2 class="font-bold text-lg mb-1 flex items-center gap-2"><i data-lucide="image" class="w-5 h-5 text-orange-600"></i> Logo Website</h2>
      <p class="text-sm text-gray-500 mb-4">Logo akan tampil di halaman login, sidebar, dan tab browser (favicon).</p>
      
      <div class="flex flex-col sm:flex-row items-center gap-6">
        <div class="w-32 h-32 border-2 border-dashed rounded-xl flex items-center justify-center bg-gray-50 overflow-hidden flex-shrink-0">
          ${LOGO_URL ? `<img src="${LOGO_URL}" class="max-w-full max-h-full object-contain" />` : `<i data-lucide="image" class="w-10 h-10 text-gray-300"></i>`}
        </div>
        
        <div class="flex-1 w-full">
          <label class="block text-sm font-medium mb-1">Pilih file gambar (PNG / JPG)</label>
          <input type="file" id="logo-input" accept="image/*" class="w-full border rounded-lg px-3 py-2 text-sm mb-3" />
          <button onclick="uploadLogo()" id="btn-upload-logo" class="bg-orange-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-orange-700 transition">Upload Logo</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function uploadLogo() {
  const input = document.getElementById('logo-input');
  const btn = document.getElementById('btn-upload-logo');
  const file = input.files[0];
  
  if (!file) { alert('Pilih file gambar terlebih dahulu!'); return; }
  if (file.size > 2 * 1024 * 1024) { alert('Ukuran file maksimal 2MB.'); return; }

  btn.disabled = true;
  btn.textContent = 'Mengupload...';

  try {
    const fileExt = file.name.split('.').pop();
    const fileName = `logo_${Date.now()}.${fileExt}`;
    const { error: uploadErr } = await supabaseClient.storage.from('logo').upload(fileName, file);
    if (uploadErr) throw uploadErr;
    
    const { data: { publicUrl } } = supabaseClient.storage.from('logo').getPublicUrl(fileName);
    const { error: dbErr } = await supabaseClient.from('settings').upsert({ key: 'logo_url', value: publicUrl });
    if (dbErr) throw dbErr;
    
    LOGO_URL = publicUrl;
    applyLogo();
    alert('✅ Logo berhasil diperbarui!');
    renderPage();
  } catch (err) {
    alert('Gagal upload logo: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Upload Logo';
  }
}

// ================= FUNGSI BANTUAN: ID TENTOR =================
function getMyTentorId() {
  if (DB.profile.role !== 'tentor') return null;
  if (DB.profile.tentor_id) return DB.profile.tentor_id;
  const match = DB.tentor.find(t => t.email === DB.profile.email);
  return match ? match.id : null;
}

// ================= DASHBOARD =================
function renderDashboard() {
  const s = DB.profile; const siswa = DB.siswa, tentor = DB.tentor, inv = DB.invoice;
  const pemasukan = inv.filter(i=>i.jenis==='siswa' && i.status==='lunas').reduce((a,b)=>a+b.total,0);
  const pemasukanCard = s && s.role === 'admin' ? `<div class="bg-white rounded-xl p-4 border"><div class="text-xs text-gray-500 mb-2">Pemasukan Lunas</div><div class="text-xl font-bold text-emerald-600">${rupiah(pemasukan)}</div></div>` : '';
  return `
    <div>
      <h1 class="text-2xl font-bold mb-1">Dashboard ${s && s.role==='admin'?'Admin':'Tentor'}</h1>

function downloadCSV(table) {
  const data = DB[table] || [];
  if (data.length === 0) { alert(`Tidak ada data ${table} untuk diunduh.`); return; }

  const allKeys = [...new Set(data.flatMap(obj => Object.keys(obj)))];
  const csvRows = [];
  csvRows.push(allKeys.map(h => `"${h}"`).join(','));
  
  data.forEach(row => {
    const values = allKeys.map(h => {
      let val = row[h];
      if (val === null || val === undefined) val = '';
      if (typeof val === 'object') val = JSON.stringify(val);
      return `"${String(val).replace(/"/g, '""')}"`;
    });
    csvRows.push(values.join(','));
  });

  const csvContent = '\uFEFF' + csvRows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0,10);
  link.download = `JoyBimbel_${table}_${date}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

function downloadAllBackup() {
  const backup = {
    exported_at: new Date().toISOString(),
    version: '1.0',
    app: 'Joy Bimbel',
    data: {
      siswa: DB.siswa,
      tentor: DB.tentor,
      jadwal: DB.jadwal,
      absensi: DB.absensi,
      invoice: DB.invoice,
      laporan: DB.laporan,
      settings: DB.settings
    }
  };

  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0,10);
  link.download = `JoyBimbel_BackupLengkap_${date}.json`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}
